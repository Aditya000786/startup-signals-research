 are not pursuing this as a consumer service?"}, {"id": "38771919", "author": "PhilipRoman", "year": 2023, "thread": "The life and death of open source companies", "text": "My impression is that many of these \"open source developers\" overestimate the value of their code. There are many amazing projects for which I would pay considerable price, but the long tail of 99% of projects just aren't worth anything in my opinion. It is an interesting exercise though - to imagine how much I would pay for my window manager, gcc or even Vim.\n\nMaybe easier transactions of tiny sums is the real solution? Even if every user paid something trivial like 10 cents a month, it would be a huge revenue stream for popular projects which lack maintenance. Of course, adding monetary incentives opens a whole new can of worms, so maybe the current situation is the best we can do after al"}], "key": "i18-Open Source Tab"}, {"name": "Account Lifeline", "one_liner": "Insurance for your digital life: continuous export of your Google, Apple and Microsoft accounts, plus human-assisted recovery when you get locked out.", "problem": "People get locked out of Google, Microsoft or game accounts with no human to talk to and lose decades of photos, email and purchases. They say they would pay for real support.", "customer": "Families and freelancers whose digital lives live in one big-tech account.", "evidence": "Recurring high-pain stories (intensity 4-5): lost accounts, kids' game worlds gone, failed recovery with the recovery email. Commenters explicitly would pay for human support or automatic outside backups.", "solution": "A scheduled Takeout-style export of mail, photos, drive and contacts to the user's own storage, a recovery-readiness checklist (backup codes, recovery devices), and concierge help with recovery forms and escalation.", "mvp": "Automated Google account backup to the user's S3 or Backblaze, a readiness score, and a $5 a month plan.", "business_model": "$5 a month individual, $10 a month family.", "alternatives": "Google Takeout (manual, one-off), Spanning and Afi (business only), Apple and Google recovery flows. No consumer human-escalation service exists.", "why_now": "AI moderation bans are rising, and passkeys concentrate identity in a few providers.", "risks": "Can't actually force providers to restore accounts. API access to export data can be restricted.", "verdict_score": 5, "cluster": "accounts, recover, locked, human", "category": "security & privacy", "signal_score": 18.83, "authors": 8, "years": [2021, 2022, 2023, 2024, 2026], "pay_signals": 7.5, "avg_intensity": 4.38, "mentions": 8, "quotes": [{"id": "34863983", "author": "valdiorn", "year": 2023, "thread": "Facebook Announces Meta Verified", "text": "tbh, I'd prefer the option of paying for support over literally no support at all, ala. Google.\n\nIf my Gmail account is compromised, I'd be pretty fucked, despite doing my best to make backup arrangements - it's still the skeleton key to the rest of my digital life and my primary point of contact for everyone who interacts with me.\n\nI'd happily pay some small fee to have an actual human help me resolve the issue. But right now, that's not even an option."}, {"id": "40434147", "author": "muppetman", "year": 2024, "thread": "Show HN: Pls Fix – Hire big tech employees to appeal account suspensions", "text": "On the flip side I'd pay for this.\nMy Twitter account was suspended last year for no reason I can fathom. I wasn't abusive, I wasn't hacking/abusing the platform etc.  Just one day I posted a comment and was then told \"Your account is blocked\"\nI'd really love to get it back as it's a 3 letter handle.  Alas, despite submitting upwards of 100 appeals I hear nothing back (I guess since Elon took over there's no support staff anymore)\nAnyway, I can see there would be a market for this, however unethical/risky it would be for employees to participate in."}, {"id": "31391783", "author": "tqkxzugoaupvwqr", "year": 2022, "thread": "Google Account has been disabled because of a Python code", "text": "> My photos since I was a baby till nowadays (23 years of images), my niece's photos since she was in her mom's womb, my essential files, ALL passwords, reminders, and google login accounts. Everything is gone!\n\n> my google play account with my apps, my google extension developer with my extensions, my google AdMob with all of my unpaid revenue, firebase, google analytics, and google search console...\n\nI’d like to apply this algorithmic ban to Google employees’ private Google accounts so they too can experience the joy of getting punched in the face without recourse.\n\nI “only” have my emails left at Google. Starting July they want to take my money for what they promised to be a free service "}], "key": "i19-Account Lifeline"}, {"name": "CI That Waits Less", "one_liner": "Fast managed CI runners with a merge queue that works and real workflow debugging, as a drop-in for GitHub Actions.", "problem": "Teams find GitHub Actions runners slow, merge queues unusable and workflow debugging painful.", "customer": "Engineering teams of 20-500 on GitHub.", "evidence": "A small but high-pain cluster (avg 4/5) of team leads who say they'd pay.", "solution": "Bare-metal runners with warm caches, a merge queue with batching and bisection, and SSH or replay debugging of failed jobs.", "mvp": "A drop-in runner label (runs-on: fast) on bare-metal boxes with persistent caches, priced per minute.", "business_model": "Usage-based per-minute pricing at about half GitHub's rate.", "alternatives": "Namespace, Depot, BuildJet, Blacksmith, Ubicloud, Mergify, Trunk merge queue. A crowded but growing market.", "why_now": "Monorepos and AI-generated pull request volume increase CI load.", "risks": "Competition is crowded, and GitHub can cut prices.", "verdict_score": 4, "cluster": "ci, github, github actions, actions", "category": "devops & infra", "signal_score": 18.12, "authors": 8, "years": [2020, 2024, 2025, 2026], "pay_signals": 5.0, "avg_intensity": 3.62, "mentions": 8, "quotes": [{"id": "47943874", "author": "vadepaysa", "year": 2026, "thread": "Ghostty is leaving GitHub", "text": "What is confusing to me, is as a business I would happily pay GitHub for many many features that I pay others for. Maybe MS thinks its just a billion here, billion there, but isn't it so easy to capture these?\n\n1. faster more configureable action runtimes so I can get faster builds\n2. usable merge queues because the github one is a joke\n3. some reasonable CI management and workflow debugging features"}, {"id": "46617500", "author": "rurp", "year": 2026, "thread": "I hate GitHub Actions with passion", "text": "Yep, my company moved onto GH Actions a few years ago and this was probably the single biggest pain point. But also the whole system just feels awkward and annoying to work with. It feels like a classic Microsoft product that would never get traction from a standalone company but because it's part of Microsoft/GitHub and is \"good enough\" lots of people put up with it."}, {"id": "24791620", "author": "dbingham", "year": 2020, "thread": "Waypoint: Build, deploy, and release applications across any platform", "text": "Hey Mitchell,\n\nIt's an interesting idea, but as a Devops Lead, I'm not sure this is any where near our biggest pain point.  We've been in the midst of a Devops transition from manually managed EC2 and chef towards CI/CD and infrastructure as code for two years. Terraform solves one of our biggest problems - consistently representing infrastructure as code.  But Waypoint won't solve the other.  In fact, Waypoint doesn't seem to touch on anything that's actually much of a problem.\n\nThe deployment step isn't the problem - it's everything surrounding it. See, we're not on CI or CD yet.  We're working our way towards them from a legacy system.  In that intervening time, what we need is a generali"}], "key": "i20-CI That Waits Less"}, {"name": "Agent Sandbox", "one_liner": "Instant, per-project sandboxes for AI coding agents, with scoped short-lived credentials and network rules you don't hand-write.", "problem": "Developers running coding agents either give them their whole machine and cloud accounts, or spend hours hand-writing Docker, bwrap and network rules for each project. Agents also need temporary, narrowly scoped access to code hosts and clouds, which today means long-lived personal tokens.", "customer": "Developers and small teams running agents daily, and platform teams asked to make agent use safe.", "evidence": "A recent cluster (2025-2026) of high-intensity comments. They describe hand-configuring bwrap per project, stitching together packaging, sandboxes and state, and wanting delegated credentials that expire. One commenter explicitly says they would pay.", "solution": "A CLI that starts an agent inside a lightweight VM or container from a base image matched to the repo. It mounts only the project, and applies a default-deny network policy with a short allowlist. A credential broker mints short-lived, repo-scoped tokens for GitHub and the cloud providers. Every grant and request is logged.", "mvp": "macOS and Linux CLI: `sbx run claude` in any repo. It auto-detects the toolchain, mounts only the repo, and allows only package registries plus an allowlist. It ships with a GitHub App that issues 1-hour, single-repo tokens.", "business_model": "Free CLI. $15-30 per user per month for the credential broker, audit log and team policies.", "alternatives": "Docker or devcontainers (heavy, no credential story), E2B and Daytona (hosted, aimed at agent builders rather than end developers), and vendor sandboxes that only cover one agent.", "why_now": "Agents now run unattended for hours. Security teams are starting to ask what they can reach.", "risks": "Agent vendors may ship good-enough built-in sandboxes. Cross-platform VM isolation on macOS is hard. Developers resist anything that slows them down.", "verdict_score": 7, "cluster": "agents, ai agents, developers, agent", "category": "AI & ML tooling", "signal_score": 20.1, "authors": 13, "years": [2025, 2026], "pay_signals": 7.0, "avg_intensity": 3.36, "mentions": 14, "quotes": [{"id": "46636406", "author": "MrOrelliOReilly", "year": 2026, "thread": "Design and Implementation of Sprites", "text": "I appreciate the Fly.io team’s enthusiasm and am optimistic this will mature into a product I’d pay for, but my initial impression was of a lack of polish.\n\nDocumentation is sparse, or not even available? The API docs don’t tell you much about the service itself, and a Google search for docs returns an inaccessible website as the first result (https://docs.sprites.dev). Blog posts and forum threads and Claude skills shouldn’t be a substitute.\n\nThe snappiness of the sprites is very cool and I can definitely see it integrating into future Claude Code workflows. But the lack of a base container images means you’re still doing setup work on the sprite before you can begin development. I understa"}, {"id": "49706334", "author": "sieve", "year": 2026, "thread": "Ask HN: What are you working on? (September 2026)", "text": "Lots of things!\n\n- Wanted to start blogging. So built an SSG for that.\n\n- Have an ink tank printer that must be used a few times each month or bad things happen. Have been printing Sanskrit stories instead of test pages. Was manually building booklets with typst and then using pdfimpose. Finally, decided to write an app that does MD -> booklet.\n\n- Decided that running harnesses directly on my machine is a bad idea. Docker/Podman are too complicated for the task at hand. So I built Adamant. It started out as a basic wrapper around Bubblewrap. Then I added networking via a socat proxy. Now it can do this:[1]\n\n  # Runs a webserver inside the sandbox that is accessible from outside\n  adamant --p"}, {"id": "49808021", "author": "sieve", "year": 2026, "thread": "Show HN: Drop – A rootless Linux sandbox with gVisor support", "text": "I guess people are slowly realizing that giving LLMs r/w access to your entire machine is an utterly insane idea.\n\nI did a quick look-around last month and decided to start using bwrap. But manually configuring it on a per-project basis is irritating. So I rolled out something for my own use (+ a couple of friends) based on bwrap.\n\nWhat I do:\n\n- start with `bwrap --clearenv --unshare-all --die-with-parent --tmpfs / ...`\n\n- every single file and folder and envar I need has to be mapped in. I have profiles in TOML, and `prepare/probe` commands to make this task simpler\n\n- `--tmpfs /` means sandbox inits as `/home/user` on tmpfs unless you specify your own `home` and `user` keys.\n\n- `--unshare-"}, {"id": "50374549", "author": "smashed", "year": 2026, "thread": "Ask HN: What's your current AI agentic setup?", "text": "I am using mainly claude code on a Pro subscription.\n\nI also have an OpenCode Go subscription, so I can keep an eye on the capabilities of the Chinese models.\n\nOpus 5.5 medium for the vast majority of coding and code review tasks. I will sometimes save on tokens by dropping to sonnet if I have a well detailed plan built with opus.\n\nI spend a lot of time on the design/architecture of features. These tasks are assisted by Gen AI but I still need to make a lot of corrections. It's my main bottleneck.\n\nFor orchestration and sandboxing I've used plain VMs (I have a make VM script which installs Claude in a fresh VM).\n\nI've used Scion at work, which gave me a lot of ideas and got me excited about "}], "key": "i21-Agent Sandbox"}, {"name": "Agent Undo", "one_liner": "A safety layer for AI agents that act on your files: every change is snapshotted, reviewable like a git diff and revertible, and access is limited to the folders you approve.", "problem": "AI agents that touch the filesystem or a database can delete or overwrite things irreversibly. Users want git-like review and revert of everything an agent changed, prompts before destructive operations, and folder-level limits on what an agent can see.", "customer": "Non-developer and developer users of desktop AI agents, and self-hosters who let agents do ops work.", "evidence": "Mostly 2025-2026 comments, high intensity (4), with explicit willingness to pay. Commenters asked for a firewall-like tool for agent file access and for automatic backups before destructive operations.", "solution": "A filesystem layer (FSEvents/fanotify plus copy-on-write snapshots on APFS, btrfs or ZFS). It records each agent session's changes as a reviewable changeset with one-click revert. A policy file sets which folders an agent may read or write. Deletes and overwrites of more than N files pause for confirmation.", "mvp": "macOS menu-bar app: pick folders an agent may touch. It snapshots before each session and shows a timeline with a diff and revert per session.", "business_model": "$5-10 per month, or a one-time licence, for individuals. A team tier adds central policy.", "alternatives": "Time Machine (too coarse and slow), git (only for code repos), and agent-specific permission prompts (which vary by vendor and are often turned off).", "why_now": "Agents with computer and file access went mainstream in 2025-2026, and so did incidents of agents deleting files.", "risks": "Operating systems or agent vendors may build this in. Kernel-level file interception is hard to get approved on macOS.", "verdict_score": 6, "cluster": "ai, file, commit, agent", "category": "AI & ML tooling", "signal_score": 17.7, "authors": 9, "years": [2025, 2026], "pay_signals": 4.5, "avg_intensity": 3.33, "mentions": 9, "quotes": [{"id": "45996513", "author": "redhale", "year": 2025, "thread": "Launch HN: Poly (YC S22) – Cursor for Files", "text": "My immediate hesitance with a tool like this (which sounds awesome) is that I don't actually trust tools like Claude Code unless I have them running in a git directory where I can see exactly what changed, and easily revert when needed.\n\nDo y'all have a solution for this here? Some kind of safety layer of some kind to easily review and optionally revert actions the agent has taken across my entire file system?\n\nThe search part of this is cool, but if the write side is solved, shut up and take my money."}, {"id": "47056344", "author": "crossroadsguy", "year": 2026, "thread": "Claude Sonnet 4.6", "text": "I am just shocked to see people are letting these tools run freely even on their personal computers without hardening the access and execution range.\n\nI wish there was something like Lulu for file system access for an app/tool installed on a mac where I could set “/path” and that tool could access only that folder or its children and nothing else, if it tried I would get a popup. (Without relying on the tool’s (e.g. Claude’s) pinky promise."}, {"id": "50499142", "author": "ericmay", "year": 2026, "thread": "Claude asked to renumber pages deletes professor's syllabus, year of notes", "text": "Why isn't there a backup or a secondary deletion confirmation or something along those lines?\n\nPlenty of people have accidentally deleted such things, so it's not unheard of. Not sure we should be overreacting to stochastic agents being used tens of millions of times per day making a mistake. Eventually they won't make mistakes anyway."}, {"id": "47034684", "author": "xnorswap", "year": 2026, "thread": "Anthropic tries to hide Claude's AI actions. Devs hate it", "text": "Yes, this is why I generally still use \"ask for permission\" prompts.\n\nAs tedious as it is a lot of the time ( And I wish there was an in-between \"allow this session\" not just allow once or \"allow all\" ), it's invaluable to catch when the model has tried to fix the problem in entirely the wrong project.\n\nWorking on a monolithic code-base with several hundred library projects, it's essential that it doesn't start digging in the wrong place.\n\nIt's better than it used to be, but the failure mode for going wrong can be extreme, I've come back to 20+ minutes of it going around in circles frustrating itself because of a wrong meaning ascribed to an instruction."}], "key": "i22-Agent Undo"}, {"name": "Agent Flight Recorder", "one_liner": "Record, replay and grade whole AI agent sessions, including tool choices, browser and API calls, so teams can debug agents and trust AI-written tests.", "problem": "Teams building agents find frameworks opaque: they cannot see why the agent picked the wrong tool, cannot replay a session, and have no quantitative benchmarks. Reviewing AI-written tests is a bottleneck because nobody can see what the test actually exercised.", "customer": "Engineering teams shipping agent features and teams using AI to write tests.", "evidence": "A 2025-2026 cluster with intensity around 4. Commenters ask for hermetic environments that record browser and API interactions, session-level evaluations and wrong-tool detection.", "solution": "An SDK and proxy that captures every model call, tool call, HTTP request and browser action in a session into a replayable trace. It provides a deterministic replay mode with recorded responses, session-level evaluators (wrong tool, loops, unverified claims), and visual diffs for AI-written end-to-end tests.", "mvp": "An OpenTelemetry-compatible tracer for one popular agent framework plus a web viewer that replays a session step by step and flags loops and tool errors.", "business_model": "Usage-based SaaS, roughly $50-500 per month per team, with a self-hosted enterprise tier.", "alternatives": "LangSmith, Langfuse and Braintrust (strong on LLM calls, weaker on browser and API side effects and full-session replay), and Playwright traces (no agent context).", "why_now": "Agents moved from demos to production in 2025-2026, and debugging them is now a daily cost.", "risks": "A crowded observability market where incumbents can add replay. Frameworks change fast.", "verdict_score": 6, "cluster": "ai, teams, agents, ai agents", "category": "AI & ML tooling", "signal_score": 21.96, "authors": 17, "years": [2023, 2025, 2026], "pay_signals": 9.5, "avg_intensity": 3.35, "mentions": 17, "quotes": [{"id": "46449705", "author": "axdithya", "year": 2026, "thread": "Show HN: LáR – An open-source, deterministic \"Glass Box\" agent framework", "text": "Hey HN,\n\nI've spent the last few months building Lár (Irish for \"core\"). It's a Python framework for building AI agents, but heavily inspired by the philosophy of \"Glass Box\" engineering rather than magical \"Black Boxes\".\n\nThe Problem:\nMost agent frameworks today (LangChain, AutoGen) feel like magic. They hide the prompt chains, the state transitions, and the retry logic. When they break in production, debugging is a nightmare.\n\nThe Solution:\nLár is designed to be the \"PyTorch for Agents\". It uses a \"Define-by-Run\" architecture where:\n1. Agents are just directed graphs (Nodes + Edges).\n2. Every state transition is immutable and logged.\n3. The engine produces a JSON \"Flight Log\" that makes th"}, {"id": "47248766", "author": "MickeyShmueli", "year": 2026, "thread": "Launch HN: Cekura (YC F24) – Testing and monitoring for voice and chat AI agents", "text": "the mock tool platform thing is smart. testing agents against real APIs is a nightmare, you get flakiness, you burn through rate limits, and you can't reproduce failures\n\none thing i'm curious about: how do you handle testing the tool selection logic itself? like the agent choosing WHICH tool to call is often where things break, not the tool execution\n\nwe had a support agent that would sometimes call the \"refund order\" tool when the user just wanted to check order status. the tool worked perfectly, the LLM just kept picking the wrong one. your mock platform lets you verify the tool returns the right data, but does it catch when the agent calls the wrong tool entirely?\n\nalso the full-session "}, {"id": "49394427", "author": "fabianlindfors", "year": 2026, "thread": "Building an (almost) fully self-hosted, sandboxed, agentic software factory", "text": "Agreed, we had agents writing standard integration/unit/e2e tests but turned out to be a ton of work reviewing just that and hard to wrap one’s head around as a developer.\n\nWe ended up building our own test platform to reduce the human bottleneck in the verification loop.\n\nTakes the form of a hermetic test environment that run all our code and infra in a way that matches production. Our tests interact with it from the ”outside”, e.g. by driving a browser, a terminal or making API calls.\n\nWe still have coding agents writing those tests but the big difference is that we record the browser and the API calls and can review and verify through a UI without having to do any manual testing. It also "}, {"id": "43014495", "author": "aksosnckckd", "year": 2025, "thread": "Firing programmers for AI is a mistake", "text": "As in writing test cases? I’ve seen devs write (heavily mocked) unit tests using only AI, but these are worse than no tests for a variety of reasons. Our company also used to contract for these tests…but only because they wanted to make the test coverage metric to up. They didn’t add any value but the contractor was offshore and cheap.\n\nIf you’re able to have AI generate integration level tests (ie call an API then ensure database or external system is updated correctly - correctly is doing a lot of heavy lifting here) that would be amazing! You’re sitting on a goldmine, and I’d happily pay for these kind of tests."}], "key": "i23-Agent Flight Recorder"}, {"name": "Codebase Atlas", "one_liner": "Auto-generated, always-current architecture docs and live data-flow maps for codebases you inherit.", "problem": "Developers joining legacy or abandoned codebases spend weeks rebuilding a mental model. They cannot trace runtime data flow through dependency injection and abstraction layers, and nobody wrote down the domain boundaries.", "customer": "Engineers joining a team, consultancies taking over client code, and companies after acquisitions.", "evidence": "A 2022-2026 cluster where commenters explicitly say they would pay for human-readable architecture docs per repo and visual maps of live data flow.", "solution": "Static analysis plus an LLM to produce a navigable map: modules, domain concepts, entry points and an explained call graph. An optional runtime tracer records a few real requests and overlays the actual data path on the map. The map regenerates on every merge.", "mvp": "A GitHub App that generates an architecture overview and per-module explanations for one repo (TypeScript or Python first), and posts updates on pull requests that change structure.", "business_model": "$20-50 per developer per month. Consultancies pay per engagement.", "alternatives": "Sourcegraph and Cody, IDE AI chat (answers questions but builds no persistent map), CodeSee (shut down), and manual wikis that go stale.", "why_now": "LLMs can now summarize large codebases cheaply, and AI-written code is increasing the amount of code nobody understands.", "risks": "Coding assistants may make a separate map feel unnecessary. Accuracy problems would destroy trust.", "verdict_score": 6, "cluster": "codebases, developers, code, inheriting", "category": "developer tools", "signal_score": 21.84, "authors": 17, "years": [2020, 2022, 2023, 2024, 2025, 2026], "pay_signals": 9.5, "avg_intensity": 2.71, "mentions": 17, "quotes": [{"id": "43157734", "author": "muzani", "year": 2025, "thread": "Ask HN: What are you working on? (February 2025)", "text": "I would pay for it as an individual. Just things like going into code and spending 3 weeks reverse engineering everything is not ideal. Especially if it's something where the entire team has quit or been laid off. And lately the solution for that is just rewriting the damn thing lol.\n\nHow much we're willing to pay is a whole other question. I feel like this is the kind of thing that Cursor already does by itself but it's just not releasing a user-readable output of it.\n\nIt won't likely be a subscription thing, but one off payments per repo makes sense, and there should be some kind of satisfaction guarantee or say, charge to have the output in a human readable format.\n\nMonorepos are also a p"}, {"id": "47369441", "author": "nonameiguess", "year": 2026, "thread": "Ask HN: What's your biggest pain point when joining a new developer team?", "text": "Totally depends on the org. I've worked as the 3rd employee of a months old startup and the biggest pain point was we owned no infrastructure and I did everything on my own computer, which was easy but limiting because were heavy into statistical modeling and needed more powerful compute, which we got but it took a few months. I've worked on a military/intelligence project that had been in operation for over 40 years. The oldest code had no commit history because it predated any modern VCS. Whoever wrote it was long retired if not dead. Pieces were spread across thousands of repos on many different forges. With large old-school Java OSGI and now with Kubernetes, which is basically Java writt"}, {"id": "34327440", "author": "vaughan", "year": 2023, "thread": "Ask HN: I'm 40 and feel my mental ability declining. Programming seems harder.", "text": "My biggest pain point with programming is I am constantly rebuilding mental models of software projects.\n\nI think its a problem with the way we write software. I think all code we write should be visualizable at different levels of granularity, and should be able to show data flowing through it inline. We have all these principles about writing good software such as it should be testable, performant, self-documenting...but I would argue the most important thing is that it should be visualizable! And easily debuggable.\n\n---\n\nI would suggest using a visual debugger and an IDE with static call hierarchy features (sometimes called find usages or find all references).\n\nYou should think about how "}, {"id": "41401357", "author": "Uptrenda", "year": 2024, "thread": "Launch HN: CodeViz (YC S24) – Visual maps of your codebase in VS Code", "text": "Yeah dude, take my money. I can't believe what I'm seeing. You've actually given me a reason to use a second monitor again."}], "key": "i24-Codebase Atlas"}, {"name": "Plain Git Host", "one_liner": "Boring, reliable, cheap git hosting with issues and reviews, no upsell, and bring-your-own CI, for people tired of GitHub outages and bloat.", "problem": "Developers and small companies want core git hosting (repos, pull requests, issues) to just work. GitHub keeps adding AI upsells and has outages, and self-hosting a full forge is a nightmare.", "customer": "Solo developers, small teams of up to 20, and companies that want a second git host for redundancy.", "evidence": "A 2022-2026 cluster with many explicit prices ($20-50 a year for solo developers, cheap tiers for 5-person teams) and repeated complaints about GitHub reliability.", "solution": "A managed Forgejo-based forge with a mirror-to-GitHub option, so open-source projects keep visibility. It has an SLA and status history, and lets you attach self-hosted CI runners.", "mvp": "Managed Forgejo instances with automatic two-way GitHub mirroring and a public uptime record, sold to the first 100 teams.", "business_model": "$4 per user per month. A personal plan at $30 a year.", "alternatives": "GitHub, GitLab (heavy), Codeberg (non-profit, limited capacity), SourceHut (opinionated workflow), and self-hosted Gitea.", "why_now": "GitHub's AI push and visible outages in 2025-2026 have made a second host feel prudent.", "risks": "Network effects keep open source on GitHub. Thin margins against free tiers.", "verdict_score": 5, "cluster": "github, github alternative, hosting, reliable", "category": "developer tools", "signal_score": 18.63, "authors": 10, "years": [2022, 2023, 2025, 2026], "pay_signals": 8.5, "avg_intensity": 2.82, "mentions": 11, "quotes": [{"id": "47936006", "author": "0xbadcafebee", "year": 2026, "thread": "GitHub Copilot code review will start consuming GitHub Actions minutes", "text": "I started moving my repos off GitHub weeks ago, but I'm still waiting for a \"good\" GitHub competitor to appear. GitLab sucks (if you're not a company and like unnecessary complexity), Codeberg is slow and limited (and has weird mods), Sourcehut UX is weird (and being DDoS'd), Gitea Cloud didn't even have a working login page last time I tried, BitBucket isn't the worst but it has quite a few problems (& isn't set up for public repos/search). Please can somebody start a simple, reliable hosted GitHub alternative? I'd pay for it..."}, {"id": "32153185", "author": "Stampo00", "year": 2022, "thread": "The Gullible Software Altruist", "text": "I'm so tired of this argument. I want to host stuff myself. Really, I do. But I really don't have enough time in the day to do it.\n\nI set up a blog this weekend using Hugo, Ansible, and Github Actions to host it on NearlyFreeSpeech.NET. It \"only\" took two days, but I'm exhausted and I don't actually have any content yet.\n\nI host Plex and TiddlyWiki at home on my Raspberry Pi. I used docker and traefik. Sometimes it still has weird issues and I have to reboot it. It was another project that \"only\" took a weekend and left me exhausted.\n\nSo let's say I don't want to self host, but I don't want to use Github. What are my options? I used to use Bitbucket, but I moved to Github a few years ago to "}, {"id": "32425962", "author": "eatsyourtacos", "year": 2022, "thread": "Give nothing, expect nothing: Gitlab latest punching bag for entitled users", "text": "This exactly.. we literally use it for simple git and a little bit of issues (only because gitkraken has it integrated, so it's convenient sometimes). Not paying $20/mo PER DEVELOPER per month for that.\n\nWe have a small enough repo so will just stick with the free version I guess. They should have like $10/mo (for up to 5 developers) to cover small teams that just use basic features. I would happily pay that, but anything else is just stupid for simple git storage."}, {"id": "47533127", "author": "jrudolph", "year": 2026, "thread": "Moving from GitHub to Codeberg, for lazy people", "text": "To be fair, GitHub has several magnitudes higher of revenue to support that. Including from companies like mine who are paying them good money and get absolutely sub-par service and reliability from them. I'd be happy for Codeberg to take my money for a better service on the core feature set (git hosting, PRs, issues). I can take my CI/CD elsewhere, we self-host runners anyway."}], "key": "i25-Plain Git Host"}, {"name": "Landed Mail", "one_liner": "Make self-hosted or small-provider email actually reach the inbox: a managed relay, reputation monitoring and anti-spam gateway.", "problem": "People who self-host email or use small providers find that delivery to Gmail and Outlook is a nightmare. They also want affordable inbound spam filtering and a provider with accountable support that won't ban them overnight.", "customer": "Self-hosters, privacy-minded individuals, and small businesses running their own domain mail.", "evidence": "Comments from 2018-2026 with explicit willingness to pay, and intensity 4 on deliverability. Several said they gave up self-hosting purely because of deliverability.", "solution": "An outbound relay on warmed IPs with per-customer reputation isolation, plus DNS setup checks (SPF, DKIM, DMARC, ARC), Gmail Postmaster and blocklist monitoring with plain-English alerts, and an inbound anti-spam gateway in front of the user's own server.", "mvp": "A smarthost relay for Postfix and Mail-in-a-Box users with a setup wizard and a weekly deliverability report.", "business_model": "$5-15 per domain per month. Inbound filtering as an add-on.", "alternatives": "SES, Postmark and Mailgun (transactional, not for person-to-person mail and strict about it), Fastmail and Proton (you give up self-hosting), and SMTP2GO.", "why_now": "Big providers keep tightening sender rules, which pushes small senders off unless someone handles reputation for them.", "risks": "Abuse risk: a relay attracts spammers, and one bad customer burns the IPs. Low price ceiling.", "verdict_score": 5, "cluster": "self, email, hosted, self hosted", "category": "communication & social", "signal_score": 20.36, "authors": 13, "years": [2018, 2020, 2021, 2023, 2025, 2026], "pay_signals": 6.0, "avg_intensity": 3.15, "mentions": 13, "quotes": [{"id": "49329576", "author": "A_D_E_P_T", "year": 2026, "thread": "Self hosted email continues to steeply decline", "text": "I wish there were a way to self-host without my emails constantly getting stuck in other people's spam folders.  And it made me really paranoid about email, too -- like I'd send emails, and I'd never know if the other end received them or not, unless they replied.  Without a reply, I would always wonder whether the message got a look, or disappeared without a trace.\n\nThe only way around this seems to be hosting with Google, Microsoft, or maybe Proton.  Any other ideas?"}, {"id": "49042515", "author": "jedberg", "year": 2026, "thread": "Self-host your mail server", "text": "I ran my own mail server from 1999-2008, starting when I worked at Sendmail.  I helped create SPF and DKIM.\n\nI would never run my own mail server today.  Deliverability is a nightmare, despite what this article says.  Gmail/Hotmail (and all the domains they host for people, which is quite a lot) will pretty much block or silently drop any email that isn't from a large, known provider who has actually talked directly to them.\n\nIf you don't have time to be a full-time mail deliverability engineer/product manager, just pay someone to do it for you."}, {"id": "17448783", "author": "Jaruzel", "year": 2018, "thread": "Ask HN: Low-maintenance alternatives to Gmail?", "text": "I find the worst part of running a private mail system is the spam. It morphs so often that you are always fighting a running battle just to keep it under control. Achieving a zero-spam target is almost impossible. The larger players (gmail/Office365) only manage to do it because they are handling millions of messages a day and have thousands of honeypot addresses just for spam catching. As a small player there's no way you can compete with that.\n\nMy anti-spam system is a relatively new install of SpamAssassin. All my incoming mail runs through that. It's about 80% effective. I've not had the time to teach it properly or tweak the bayes filtering so I'm sure it's not running as effectively a"}, {"id": "27219707", "author": "diragon", "year": 2021, "thread": "Saying Good Bye to Hey.com", "text": "Basecamp is the kind of company whose products I would happily pay for, but $50/year is too much for this service for me.\n\nIn .fi there's a non-profit that's been running from 2006. For 40e/year they give me 550GB space, email (SMTP / IMAP), shell and a good Matrix homeserver."}], "key": "i26-Landed Mail"}, {"name": "Keep Shelf", "one_liner": "Buy movies, shows and creator videos once, download DRM-free files, and play them in your own Plex or Jellyfin.", "problem": "Viewers who buy content want to keep it: DRM-free, high-quality files that never disappear from a catalog. They want them delivered straight into their self-hosted media server, as easily as piracy.", "customer": "Home media server owners, collectors and fans of old or obscure titles.", "evidence": "One of the most explicit pay clusters, spanning 2011-2026: '$5-10 per movie for DRM-free files', 'Steam-like store for videos', and 'seasons of creators' videos delivered to Plex'.", "solution": "A storefront for rights holders who allow DRM-free sales (indie films, documentaries, back catalogs, YouTube creators), using social DRM (watermarking) instead of encryption. Purchases sync into Plex or Jellyfin through a plugin with full metadata.", "mvp": "Start with creators and indie filmmakers: a Gumroad-like store for video with a Jellyfin and Plex plugin that auto-downloads purchases.", "business_model": "Take 10-20% of each sale.", "alternatives": "Vimeo On Demand, Gumroad and Bandcamp-style stores (no media-server integration), Apple and Amazon purchases (DRM, revocable), and piracy.", "why_now": "Streaming catalogs keep shrinking and prices keep rising, and the self-hosting crowd is growing.", "risks": "Big studios won't license DRM-free. Supply will be niche at first.", "verdict_score": 5, "cluster": "viewers, video, creators, video platform + drm, download drm, download, movie", "category": "media & content", "signal_score": 26.42, "authors": 30, "years": [2011, 2012, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 25.5, "avg_intensity": 2.97, "mentions": 31, "quotes": [{"id": "42538296", "author": "orobinson", "year": 2024, "thread": "Piracy in the UK: the failed war on illegal content", "text": "When will the movie industry learn from the success of services like Spotify or DRM free music services like Bandcamp? I want media I can own, or consume from a single subscription. I would happily pay a few quid for a movie if I could download a high quality DRM free file. Piracy is not only free but provides a better product, a file you can do whatever you want with and watch anywhere.\n\nPersonally I don’t pirate, I prefer getting second hand physical media (funnily enough the movie studios miss out on any money there as well)."}, {"id": "33622068", "author": "andrepd", "year": 2022, "thread": "Digital books wear out faster than physical books", "text": "Those user hostile features are what drive me to piracy. No way I'll pay money to have the privilege of installing spyware just so I can stream low-quality video to whatever device the provider deems worthy at that particular moment.\n\nI'll just go on 1337x and in 2 minutes I have an high quality mkv that I can play anywhere I want. I'd happily pay 5-10$ a pop for this, and for indie movies I do make the effort of seeing if there's a way of paying to watch it somewhere, even if I just pay and don't watch it there, and watch the pirated rip anyway."}, {"id": "31127373", "author": "thot_experiment", "year": 2022, "thread": "The bottom is dropping out of Netflix", "text": "I pay for a handful of streaming services but that's only because they're decent for content discovery and ease of use. If there's ever anything on there that I genuinely like I just pirate it (Arcane most recently) because the UX of having files that just work everywhere is so much better than the alternative. I would happily pay for unencumbered .mkv downloads if my recent buying trends wrt bandcamp .flacs are any indication.\n\nThe only way to stop me from pirating the media I like is if you actually let me buy the superior experience I can have as a pirate.\n\nP.S. copyright and IP law in general need severe reform if we want to serve creatives and not executives"}, {"id": "21016203", "author": "esond", "year": 2019, "thread": "Too Many Video Streaming Choices May Drive Users Back To Piracy", "text": "People don't use Netflix et al. because they want to follow the law. They use them because they're a better service and experience than the alternatives (PVR TV and DVDs).\n\nWhen streaming services no longer offer a superior user experience, there's not much reason to use them. Maybe we'll see a new round of \"You wouldn't download a car\" ads.\n\nI would happily pay for a service that let me download content to my personal machine, without DRM, and without restrictions. The price paid for that right now is breaking the law, and current enforcement of that law hardly a price to pay."}], "key": "i27-Keep Shelf"}, {"name": "Show Pass", "one_liner": "Pay for the shows and creators you actually watch: a prepaid balance that pays creators by watch time, instead of five subscriptions or ads.", "problem": "Viewers do not want to subscribe to many networks or watch ads. They want to pay per show, or pay a flat amount that is split by what they actually watched.", "customer": "Light or selective viewers, and viewers who juggle many subscriptions.", "evidence": "The highest-scoring uncovered cluster: 28 commenters, almost all explicit about paying, spanning 2016-2025.", "solution": "A wallet-based player for independent and creator video: top up $10, watch, and each creator gets paid per minute watched with a monthly cap. It aggregates catalogs from creators who opt in.", "mvp": "A browser extension that meters watch time on participating creators' videos and distributes a monthly user payment, like Brave Rewards but for video and without ads.", "business_model": "Keep 10% of distributed revenue.", "alternatives": "Patreon (per creator, not per view), Nebula (one catalog), YouTube Premium (opaque split), and Flattr and Coil (failed).", "why_now": "Subscription fatigue is high, and creators want revenue that doesn't depend on platform ads.", "risks": "History: Coil and Flattr struggled to reach critical mass. Rights holders resist per-minute models.", "verdict_score": 4, "cluster": "viewers, streaming, content, movies", "category": "media & content", "signal_score": 25.22, "authors": 25, "years": [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 25.0, "avg_intensity": 3.24, "mentions": 25, "quotes": [{"id": "45218855", "author": "etskinner", "year": 2025, "thread": "Show HN: Small Transfers – charge from 0.000001 USD per request for your SaaS", "text": "$0.10 per hour is already WAY more than a creator usually gets from your viewing. I'd happily pay that amount for good youtube-like content. Creators would love it because it's far more money than they get now. Consumers would like it because for a lot of people it's cheaper than a subscription, and they could forgo ads"}, {"id": "31278121", "author": "sliken", "year": 2022, "thread": "Netflix’s big power clash and rivalries behind the crash", "text": "I was hoping for something like $50 a month and pay the creators accordingly.  If I spend 10% of my viewing hours watching a particular series then the creator+provide can split the $5.\n\nI wish the internet ads worked the same way.  I'd happily pay any website 2x whatever google or similar ad networks pay, to avoid ads.  Seems like it would help reduce clickbait as well."}, {"id": "37308609", "author": "echelon", "year": 2023, "thread": "200k users abandon Netflix after crackdown backfires", "text": "The streaming economy is shotgun malinvestment into the arts.\n\nThe subscriber pays a flat rate for unlimited choice within the catalog. They're not paying for the media they think they like the most. While technically the streamer is on the hook for this, they have competing optimization criteria - churn, hours viewed, etc.\n\nThe platform pours money into a lot of experiments. Platforms optimize for revenue and retention, get signals based on hours viewed, etc., yet none of this directly maps to satisfaction. Viewers will often mindlessly play stuff in the background. Expensive content reduces the number of cheap experiments that can be run. Weird stuff is long tail.\n\nThe old model of paying "}, {"id": "23277033", "author": "mulmen", "year": 2020, "thread": "Joe Rogan got ripped off", "text": "This is where cable companies really screwed up.\n\nThey could have offered consumers a choice of channels instead of packages.  It would have required changing their business model but most cable companies are local monopolies so they should be able to declare new economics.\n\nWith their position as ISPs for many they were well positioned to offer streaming services first.  These could have subscriptions by show instead of network.  I would happily pay for the handful of shows I actually watch rather than the pantheon of streaming services we have now."}], "key": "i28-Show Pass"}, {"name": "Paid Commons", "one_liner": "A small paid social network ($20-40 a year): no ads, no engagement algorithm, family groups and private circles, and federation so you can leave.", "problem": "Users keep saying they'd pay a modest yearly fee for social media with no ads, no tracking and no manipulation, with real groups, private family spaces and good web frontends.", "customer": "Adults who want to keep in touch with family and friends without Facebook, and small communities.", "evidence": "Two clusters combined (rank 13 and 19), spanning 2013-2026, with many explicit prices of $3-10 a month or $20-40 a year.", "solution": "A hosted social app built on ActivityPub, sold as a family or community plan: private circles, events and photos, chronological feeds, and a time-limited daily digest. Your account can federate or move elsewhere.", "mvp": "A private family-and-friends space with shared photo albums, events and a chronological feed for $3 a month per household.", "business_model": "Subscription per household or community.", "alternatives": "Facebook groups, WhatsApp groups, Mastodon and Bluesky (public-first), and Micro.blog.", "why_now": "Distrust of ad-funded social media is high, and ActivityPub makes portability credible.", "risks": "Network effects: people say they'd pay, but few do. Moderation costs scale with growth.", "verdict_score": 4, "cluster": "social, social network, network, social media + ad, social, ad social, 10", "category": "communication & social", "signal_score": 26.58, "authors": 42, "years": [2010, 2013, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2025, 2026], "pay_signals": 42.0, "avg_intensity": 2.69, "mentions": 42, "quotes": [{"id": "21763971", "author": "eitland", "year": 2019, "thread": "Twitter funding a team to develop an open standard for social media", "text": "Now if we could get\n\n- a few proper web frontends (and especially one like Google+),\n\n- groups (like Google+,  WhatsApp, Telegram)\n\nthen this would start to look seriously promising.\n\nI'd happily pay a 20-40 bucks a year for that and (if Telegram didn't exist) a bit more to get a hosted but private instance for my extended family.\n\n(That said I have been experimenting with hubzilla this year and it seems seriously promising but all instances seems to be locked down really hard  or doesn't acvept new members and testing on my own instance alone doesn't really give me a feel for how it works in practice.)"}, {"id": "17147195", "author": "egypturnash", "year": 2018, "thread": "Problems with Social Media", "text": "> I would happily pay 20 dollars a year for a social media site that\n> does not track or advertise if anyone is up for building it.\n\nIt costs me $20/mo to run a Mastodon instance. Might cost me less if I spent the time to seriously optimize it. Someday I should get a Patreon up so some of the other people using my instance can kick in a few bucks and bring the cost to me down. No ads, no tracking, I just run it because I want to help actually make “social media” actually be about talking to my friends instead of being fed Popular Tweets From Celebrities.\n\nYou could also just start running your own blog. Host it yourself, use WordPress Blogger Medium Tumblr, whatever."}, {"id": "18344492", "author": "Zanni", "year": 2018, "thread": "Micro.blog", "text": "$5/mo seems high to me, but that's irrelevant. I'd happily pay it, if this could be a replacement for Facebook. But it can't, because $5/mo would be insanely high to most of my friends, many of whom decide what their plans are for the evening by how much gas is in their tank, i.e. can they afford to drive to town? And if my friends aren't there, it's not really a social network. I love this idea, but it needs a free tier to scale, and it needs a \"pro\" tier that's around $10-$20/year.\n\nEDIT: Okay, apparently there is a free tier, but it isn't really viable. No way to post (without an existing, external blog) and no profile page."}, {"id": "5495375", "author": "rayiner", "year": 2013, "thread": "Facebook Home destroys any notion of privacy", "text": "I don't use the word \"evil\" pretty much for anybody, but I think the business model is at the very least screwed up. If it's a valuable service, why do they have to be so shady? I'd happily pay facebook $10/month or whatever (I can't imagine they make more than that on ads on me) to use their service. The problem is that they make it seem free, and people just don't understand the extent to which it tracks you. It's the same business model car dealerships use when they try to steer you towards negotiating in terms of monthly payments to avoid your focusing on the bottom line cost--you can get more out of people when you hide the ball about how much your service actually costs them.\n\nIndeed, "}], "key": "i29-Paid Commons"}, {"name": "Plain Pass", "one_liner": "A password manager that stays simple and stable: offline-first, consistent across every OS, optional self-hosted sync, a one-time or modest price, and no feature bloat.", "problem": "Users feel password managers are chasing growth with bloat and price hikes. They want stable, offline-first, cross-platform sync, clear security documentation, and the option to self-host while still paying the vendor.", "customer": "Technical users and families who want a password manager they never have to think about again.", "evidence": "A 2022-2026 cluster with explicit willingness to pay a profitable, non-VC vendor.", "solution": "A KeePass-compatible vault with polished native apps on all platforms, sync through your own storage or a hosted relay, family sharing, and hardware-key unlock, with a public 'we won't add' list.", "mvp": "A polished KeePass-format app for macOS, iOS and Android with iCloud, Dropbox and WebDAV sync and family sharing.", "business_model": "A one-time licence plus an optional $1-2 per month hosted sync.", "alternatives": "1Password and Bitwarden (subscriptions, growing feature sets), KeePassXC (no polished mobile apps), and Apple Passwords (one ecosystem).", "why_now": "Price hikes and breaches at big vendors are pushing users to look for something calmer.", "risks": "Hard to make money on a one-time price. Very sensitive security reputation.", "verdict_score": 4, "cluster": "password, password manager, manager, secret", "category": "security & privacy", "signal_score": 17.97, "authors": 10, "years": [2020, 2022, 2023, 2026], "pay_signals": 7.0, "avg_intensity": 3.0, "mentions": 10, "quotes": [{"id": "47141375", "author": "aed", "year": 2026, "thread": "1Password pricing increasing up to 33% in March", "text": "I'm a 15+ year user of 1password and have been telling myself to move off of it for like 5 years now. It ain't the price... $72 is really fine for good software that just works.\n\nBut as mentioned throughout the thread it's really just too much. My goodness they really could have a nice, profitable, business with simple software. I'd happily pay $10/month for the version of 1password from 15 years ago! It's just all too much."}, {"id": "29995630", "author": "throwaway984393", "year": 2022, "thread": "1Password Has Raised $620M", "text": "Jesus Christ this is infuriating. Now I have to go find a different password manager that will just take my money, be profitable, and not become another fucking SV unicorn horror show capitalist wet dream."}, {"id": "34150596", "author": "drbawb", "year": 2022, "thread": "What’s in a PR statement: LastPass breach explained", "text": "It's a tradeoff based on convenience. I use Linux, Windows, Android, and iOS on a daily basis; using some combination of SyncThing, OneDrive, Google Workspaces, and iCloud. Getting an offline-first PW manager to work correctly and consistently across those devices, operating systems, and services is no easy feat. Doubly so if you actually want proper integration with the OS & browser keychain.\n\nAt some point the closest you'll get is a self-hosted BitWarden instance, in which case you are basically running LastPass/1Password/et al. yourself anyways. Then you have to ask yourself (a) can you host it cheaper than a monthly subscription of a competing service, and (b) can you maintain that inst"}, {"id": "34151106", "author": "hcurtiss", "year": 2022, "thread": "What’s in a PR statement: LastPass breach explained", "text": "Yeah, I’m definitely not trained in security like the password manager engineers are. But I keep wondering if being distributed offsets that risk. That is, I can spin up Bitwarden in my Unraid machine  in like five minutes and behind a reverse proxy, nobody even knows it’s there to attack. Maybe I have some security vulnerability, but it seems significantly less likely to be tested than a centralized commercial service. Curious if others have thoughts. I’d happily pay Bitwarden for whatever."}], "key": "i30-Plain Pass"}, {"name": "Linux Studio Box", "one_liner": "A pre-tuned Linux audio workstation sold as hardware plus a supported distro: low-latency, reproducible audio routing and a vetted plugin set.", "problem": "Musicians on Linux fight JACK and PipeWire configuration, latency tuning and audio breakage, with no graphical setup tool. They would pay for a commercially supported machine that just works.", "customer": "Linux-using musicians, podcast and home-studio producers, and schools.", "evidence": "Explicit willingness to pay for 'a commercially supported Linux audio distro on tuned hardware', plus several PipeWire and JACK pain comments.", "solution": "A mini PC with a known-good audio interface, a real-time kernel, preconfigured PipeWire profiles, a graphical routing and latency tool, snapshot-and-rollback updates, and bundled Linux-native plugins.", "mvp": "A graphical PipeWire and WirePlumber setup and diagnosis tool, sold standalone as an entry product, then a hardware bundle.", "business_model": "Hardware margin of $800-1500 per box plus a support subscription.", "alternatives": "Ubuntu Studio and AV Linux (free, unsupported), macOS with Logic, and DIY setups.", "why_now": "PipeWire has made Linux audio viable but not easy, and Bitwig and Reaper run natively.", "risks": "Small market. Hardware logistics. Plugin licensing.", "verdict_score": 4, "cluster": "audio, linux, midi, musicians + pipewire, audio, linux, setup", "category": "media & content", "signal_score": 20.45, "authors": 14, "years": [2019, 2020, 2021, 2022, 2023, 2025, 2026], "pay_signals": 8.0, "avg_intensity": 2.71, "mentions": 14, "quotes": [{"id": "46432352", "author": "bnastic", "year": 2025, "thread": "Linux DAW: Help Linux musicians to quickly and easily find the tools they need", "text": "I dont/didn't use Jack at all, straight into pipewire, which makes for a super unintuitive way to select 'audio device' in Reaper (iirc, something like select ALSA and 'default's for input/output and somehow that's all routed via pipewire). I'm not unhappy about pipewire, I finally have a low-ish latency audio system (enough for mixing, if not recording) that I don't have to spend hours on to get it to work. A la MacOS.\n\nBut generally that's my point, 'it works if you go and edit this obscure line in this obscure config file'. Mac has had a stable CoreAudio backend for quarter of a century now (counterpoint - Windows is also a mess). I wish Linux would stabilise their userland a bit more and"}, {"id": "46432595", "author": "ofalkaed", "year": 2025, "thread": "Linux DAW: Help Linux musicians to quickly and easily find the tools they need", "text": ">Sometimes I wish there was a commercial company behind 'linux for audio' that will give me a finely tuned Linux distro on a finely tuned desktop machine, based on whatever distro,\n\nThat would be Ubuntu Studio or Kx-Studio. Mint is quite far from what you want unless you are willing to put in the time to set it up right. Most any distro which ships PipeWire with Jack support enabled will probably perform better than your Mint setup running ALSA. PipeWire speaks Jack so if built with Jack support, any Jack aware application will connect to PipeWire with no need to start Jack or anything, it just works.\n\nIt is not an obscure file that I had to edit, it is the file (script) which starts the ser"}, {"id": "23446222", "author": "flavor8", "year": 2020, "thread": "A new project: multi-track audio editing (2005)", "text": "I digitized my studio a few months ago and settled on Reaper (running on kubuntu 20.04). I'm pretty happy with it, though Linux support is \"beta\" and support is forum based (there's a couple bugs that I'm just living with because nobody's engaged on them in forum posts).\n\nI probably could have gotten away with Ardour for my needs (recording, editing, mastering) - however, I can run Reaper at lower latencies (via Jack configuration) than Ardour. Mixbus seemed promising, but requires more latency still. Bitwig is cool, and I'd happily pay for it, but their midi implementation on linux is pretty weird, and I don't have the patience to fiddle around to make it work. I haven't used Ableton, so I "}, {"id": "38817392", "author": "amlib", "year": 2023, "thread": "LinuxDAW – Quality audio software for Linux", "text": "> Carla requires Jack which defaults to non usable state at every installation and is a nightmare to set up in a reproducible way\n\nI've been using linux audio for the last 15 years and I've been trough it all. However, things have much improved since I've switched to Pipewire. No more need for a bespoke implementation of the jack daemon, it's implemented natively right there in Pipewire, vastly simplifying setup and removing any annoyances that keeping the Jack daemon working entailed. As a bonus any jack client/jack graph visualizer, including carla, gets a direct view to all Pipewire clients, not just native jack clients. You can then use Carla to route audio directly from your hardware in"}], "key": "i31-Linux Studio Box"}, {"name": "Plug Share Lot", "one_liner": "Metered EV charging for apartment parking spots and shared driveways: the landlord installs once, and each driver pays for exactly their electricity.", "problem": "Apartment dwellers and street parkers find EV charging a major hassle. They would happily pay metered electricity at their spot or a neighbor's, but buildings won't install chargers without a billing and cost-recovery story.", "customer": "Renters and condo owners with EVs, small landlords and HOAs, and homeowners willing to share a driveway charger.", "evidence": "Explicit willingness to pay, intensity 3-4, spanning 2016-2026, including 'pay friends for home charging' and 'neighborhood charging when my building is slow'.", "solution": "Smart Level 2 chargers or retrofitted outlets with per-driver authentication and automatic billing to the landlord's account. A load-management mode fits more chargers on the existing service. A peer-sharing marketplace lets homeowners offer a driveway charger.", "mvp": "A metering-and-billing app for existing smart chargers (Wallbox, Emporia, OCPP), so a landlord can bill tenants per kWh this month.", "business_model": "Hardware markup plus 10% of billed electricity, or $10 per port per month.", "alternatives": "ChargePoint and EVPassport (aimed at large properties), EVmatch (sharing), and landlords doing nothing.", "why_now": "EV adoption is moving into renters, and many cities now require EV-ready parking.", "risks": "Utility tariff rules on reselling electricity. Slow building decision cycles.", "verdict_score": 5, "cluster": "ev, charging, apartment, owners", "category": "travel & local", "signal_score": 18.74, "authors": 9, "years": [2016, 2017, 2021, 2023, 2024, 2026], "pay_signals": 7.5, "avg_intensity": 3.33, "mentions": 9, "quotes": [{"id": "12605876", "author": "chadgeidel", "year": 2016, "thread": "It May Not Cost You More to Drive Home in a Climate-Friendly Car", "text": "This is the biggest issue for me. I would happily pay for any metered electricity to a parking spot in my apartment complex, but the managers aren't interested. And my building was built in 2014!"}, {"id": "38741150", "author": "hedora", "year": 2023, "thread": "Volkswagen, Porsche, and Audi say they will use Tesla's EV charging plug", "text": "Currently, I just plug into my friends’ charger, and it goes on their electric bill.\n\nI usually bring 10x the dollar value of the charge in booze and food, so it doesn’t matter.\n\nAlso, they don’t have to stress out over trying to figure out how to pair my car to their house and charge me $5 while they’re trying to plate dinner and deal with their kids.\n\nIf they cared about the $5 (or if I had a hummer and they had a DC fast charger, so it was $20-50) I’d happily pay cash or apple pay or venmo or really any option other than authenticating with their landlord."}, {"id": "47440757", "author": "Gravityloss", "year": 2026, "thread": "Iran war energy shock sparks global push to reduce fossil fuel dependence", "text": "It feels so slow. I would like to have an electric car or e-bike. I live in a building that is part of a housing company that has many owners (most of them people living here). It is slow to decide and implement renovation, and the pipeline is basically full for a few years.\n\nWe might get car charging infrastructure only a few years down the line. Maybe a bike shed for e-bike charging a year after that?\n\nWhat happened to those optimistic ideas where every lamp post had a charger? I would pay for that. I also see these small transformer huts on the streets. What if at least those had neighborhood high speed chargers, it shouldn't cost much since basically there's a good power source right the"}, {"id": "38128015", "author": "throwawaaarrgh", "year": 2023, "thread": "Auto industry executives admit electric vehicle plans are in jeopardy", "text": "Reasons why I can't buy an EV:\n\n- I need a truck with large towing capacity and no EV but a Semi currently comes close.\n\nReasons why I don't want to buy an EV:\n\n- I live in an apartment with street parking. The nearest public chargers are 15 minutes away. Charging would be a time consuming hassle.\n\n- Any EV truck is at least 5x more expensive than the average used truck.\n\n- I don't want to have to plan out every single trip around where the next charger is. I'd like to go hiking in the Catskills and not have to create an Excel spreadsheet to figure out where I'll need to stop for power and how long.\n\n- Unless you can use a Tesla charger, public chargers suck. They often are broken, do not pr"}], "key": "i32-Plug Share Lot"}, {"name": "Fair Storage Tiers", "one_liner": "Simple cloud backup and storage with the tiers people actually need (50 GB, 200 GB, 5 TB), honest pricing, and per-folder backup policies.", "problem": "Storage plans jump from tiny to 2 TB. Backup services raise prices or drop features. Nobody makes it easy to set different policies for keys, live files, photos and bulk media.", "customer": "Individuals and families with a few hundred GB to a few TB, and small teams.", "evidence": "A 2014-2026 cluster with explicit willingness to pay, including ship-a-drive seeding and retention beyond 30 days.", "solution": "A backup app on top of cheap object storage (B2 or R2) that offers simple tiers and pay-per-TB above them. Policy templates cover 'keys and documents: versioned forever', 'photos: deduplicated', and 'media: cold storage'. Mail-in drive seeding and restore.", "mvp": "A restic-based desktop app with policy templates and transparent per-GB pricing on B2.", "business_model": "Storage at cost-plus, about $1 per 100 GB per month.", "alternatives": "Backblaze, iCloud, Google One, Dropbox, Arq and restic (DIY).", "why_now": "Repeated price hikes and limits at incumbents are making users shop around.", "risks": "A commodity market with thin margins. Trust in a new backup vendor takes years.", "verdict_score": 3, "cluster": "storage, cloud storage, cloud, tier + backup, drive, pricing, minimum", "category": "consumer & home", "signal_score": 22.24, "authors": 15, "years": [2014, 2015, 2018, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 12.0, "avg_intensity": 2.8, "mentions": 15, "quotes": [{"id": "7200471", "author": "jlgaddis", "year": 2014, "thread": "100 time cheaper dropbox like service", "text": "> I think Dropbox is leaving money on the table with the current pricing structure.\n\nI've long thought the same thing, both on their personal and business accounts.\n\nOn the personal side, the free 2 GB account isn't quite enough for my needs but 100 GB is waaaaay more than what I'd use.\n\n> IMHO I think that a personal Dropbox account (with no business features) for $5/month for 100gb would kill competition ...\n\nI'd happily pay that. Hell, I'd pay $5/month for, say, 20 GB. Realistically, I'd rarely use more than 10 GB.\n\nIt's the same story on the business side. My small team of eight would love to use Dropbox but, again, it's not a huge amount of storage that we need -- 10 GB would likely be "}, {"id": "38478332", "author": "drbaba", "year": 2023, "thread": "Ask HN: What subscriptions do you pay for?", "text": "1Password (password manager), iCloud+ (cloud storage), Arq (backup software), BackBlaze B2 (backup hosting), various streaming services (switching from month to month).\n\nI have also paid for e.g. Sublime Text 4, not sure if that counts as a sub. I used to pay for email (KolabNow), but recently switched to a free email provider.\n\nI would pay for Dropbox if they offered a reasonably priced tier between 2GB and 2TB (similarly to Apple’s 200GB tier), since Dropbox handles Git repos well compared to Google Drive/iCloud/OneDrive."}, {"id": "32279754", "author": "haunter", "year": 2022, "thread": "Amazon Drive is closing on January 31, 2023", "text": "It just feels like I'd pay for something I don't need. I don't even pay now, I'm using the free storage which is great and I _want_ to pay but to me there is a lack of option between the free 2GB or the paid 2TB. Even though the byte/cost could be higher with a lower tier (say 200GB for 5€)"}, {"id": "37244425", "author": "dave_walko", "year": 2023, "thread": "Backblaze Product and Pricing Updates", "text": "Not me.... This is a 30+% increase for my 2 year plan.  I have no need for the \"extra\" things.  If I wanted them, I would pay for them.  I now have til April to find another solution for 1 pc and about 7tb.  Worst case, I will just buy an external and ship the drive to my parents.  Use my Synology for local backup, and then the offsite drive.  Not ideal but better than this increase.\n\nNot to mention how BB is handling the pushback of the price increase by gaslighting their users."}], "key": "i33-Fair Storage Tiers"}, {"name": "Kernel Lens", "one_liner": "A GPU kernel profiler and tuning assistant that explains why a kernel is slow and suggests block sizes and layouts, for CUDA and ROCm.", "problem": "Kernel developers waste hours optimizing CUDA or HIP code without visibility into the architecture: bank conflicts, occupancy and tuning thread-block sizes per GPU. AMD and other non-CUDA targets are worse.", "customer": "ML infrastructure engineers, inference startups writing custom kernels, and HPC developers.", "evidence": "A 2021-2026 cluster with high intensity (4) and explicit willingness to pay for AMD parity.", "solution": "A profiler front end that wraps Nsight and rocprof data and annotates the source line by line with plain-English bottlenecks, lint-style warnings (bank conflicts, uninitialized shared memory), and an auto-tuner that sweeps launch parameters per target GPU.", "mvp": "A VS Code extension that runs a kernel under the profiler and shows annotated hot lines and occupancy, for Triton and CUDA.", "business_model": "$50-200 per seat per month, with team and enterprise tiers.", "alternatives": "Nsight Compute (powerful but hard to read), rocprof, and Triton's autotune (narrow).", "why_now": "Custom kernels are now a competitive advantage in AI inference, and AMD GPUs are entering production.", "risks": "NVIDIA can improve its free tools. A niche though valuable audience.", "verdict_score": 5, "cluster": "cuda, gpu, amd, gpus + gpu, memory, developers, libc", "category": "AI & ML tooling", "signal_score": 21.33, "authors": 17, "years": [2023, 2024, 2025, 2026], "pay_signals": 7.5, "avg_intensity": 3.12, "mentions": 17, "quotes": [{"id": "44735390", "author": "jaberjaber23", "year": 2025, "thread": "[dead]", "text": "Most CUDA developers waste hours trying to speed up kernels because they can’t see the full architecture and behavior of their GPU.\n\nSo, I built RightNow AI solo while still at university. It’s a CUDA code editor that profiles kernels live inside the editor, writes kernels optimized for your exact GPU, autocompletes code based on your hardware, shows inline profiling for debugging and optimization, and lets you choose between local AI or cloud models for privacy.\n\nIt’s free during the preview period. You can use your own API keys or run local LLMs with Ollama, etc.\n\nIn testing, kernels generated in RightNow AI have run up to 179x faster on the same hardware, with no manual tuning!!\n\nJoin the"}, {"id": "45167573", "author": "programjames", "year": 2025, "thread": "Why is Japan still investing in custom floating point accelerators?", "text": "Not the guy you replied to, but here are some improvements that feel obvious:\n\n1. Memory indexing. It's a pain to avoid banking conflicts, and implement cooperative loading on transposed matrices. To improve this, (1) pop up a warning when banking conflicts are detected, (2) make cooperative loading solved by the compiler. It wouldn't be too hard to have a second form of indexing memory_{idx} that the compiler solves a linear programming problem for to maximize throughput (do you spend more thread cycles cooperative loading, or are banking conflicts fine because you have other things to work on?)\n\n2. Why is there no warning when shared memory is unspecified? It isn't hard to check if you're "}, {"id": "42702202", "author": "jms55", "year": 2025, "thread": "The Missing Nvidia GPU Glossary", "text": "The weird part of the programming model is that threadblocks don't map 1:1 to warps or SMs. A single threadblock executes on a single SM, but each SM has multiple warps, and the threadblock could be the size of a single warp, or larger than the combined thread count of all warps in the SM.\n\nSo, how large do you make your threadblocks to get optimal SM/warp scheduling? Well it \"depends\" based on resource usage, divergence, etc. Basically run it, profile, switch the threadblock size, profile again, etc. Repeat on every GPU/platform (if you're programming for multiple GPU platforms and not just CUDA, like games do). It's a huge pain, and very sensitive to code changes.\n\nPeople new to GPU progra"}, {"id": "36090980", "author": "jchw", "year": 2023, "thread": "The reality of Wayland input methods in 2022 (2022)", "text": "I don't really believe the majority of desktop Linux users have Steam installed. I do believe that the majority of Linux users historically (at least leading into the 2010s) used NVIDIA GeForce graphics cards, for a multitude of reasons. Even today where AMD and Intel GPUs are clearly the better option for stability, that doesn't mean they're the best option for doing work with. If anything, gaming on AMD is pretty comparable today, in part thanks to Valve. Productivity on AMD is where things are not in good shape. I wish it weren't so, but compare the CUDA and OpenCL/ROCm ecosystems and it's pretty obvious. Most recently, when AMD released some pretty enticing GPU options into the market, R"}], "key": "i34-Kernel Lens"}, {"name": "Cargo for C++", "one_liner": "A Cargo-like experience for C++: one manifest, cached binary dependencies, and project-wide build-time analysis, working on top of existing CMake projects.", "problem": "C++ developers find dependency management and CMake miserable. Long compile times are impossible to analyze project-wide, and learners want a single standard tool.", "customer": "C++ teams in games, embedded and finance, and C++ learners.", "evidence": "A 2022-2026 cluster, intensity up to 4, including explicit frustration with writing CMake.", "solution": "A front end that reads a simple TOML manifest, resolves packages from vcpkg or Conan indexes, generates CMake behind the scenes, adds a shared remote binary cache, and reports which headers and targets cost the most build time.", "mvp": "A build-time analyzer for existing CMake and Ninja projects that ranks the headers and translation units that cost the most time and suggests fixes.", "business_model": "Free CLI. $20-40 per developer per month for the remote cache and team analytics.", "alternatives": "vcpkg, Conan, xmake, Bazel and ClangBuildAnalyzer.", "why_now": "AI-assisted code is growing C++ codebases, and build costs scale with them.", "risks": "Fragmented ecosystem with entrenched tools. Low willingness to pay for build tooling.", "verdict_score": 4, "cluster": "developers, management, package management, cmake", "category": "developer tools", "signal_score": 18.52, "authors": 11, "years": [2022, 2024, 2025, 2026], "pay_signals": 5.5, "avg_intensity": 3.0, "mentions": 11, "quotes": [{"id": "33441912", "author": "mk89", "year": 2022, "thread": "The pool of talented C++ developers is running dry", "text": "Interesting that I also am learning c++ since some months and I have a very similar feedback as you.\n\nJust to add something:\n\n> - C++ 20 concepts are a near mirror copy of Rust Traits and enable composition that's an alternative to inheritance, again difficult to find examples of\n\nI don't know Rust, but they remind me of Scala traits. I guess it's conceptually the same, and Scala comes first :)\n\n> - The features that make C++ decent are often found in C++ 20/23, for which there are woefully few resources\n\nSomehow yes, but I think lots of cool things happened in 11 and 17. At least when I read the docs, it seems so. C++20 seems to have simplified and ported a lot of more modern features to th"}, {"id": "47475947", "author": "IshKebab", "year": 2026, "thread": "The three pillars of JavaScript bloat", "text": "I wouldn't say every Rust app does, but I do think it has become more normal for Rust apps to have 200-600 dependencies. However when I look at the list, they usually all make sense, unlike with NPM. There are rarely any one-line crates. Actually I haven't seen any yet (except joke ones of course).\n\nThere's no way the average C++ app uses 250 packages though. It's usually more like 5. C++ packaging is a huge pain so people tend to use them only when absolutely necessary, and you get huge libraries like Boost primarily because of the packaging difficulty.\n\nI would say Python varies but 150 sounds high. Something more like 50-100 is typical in my experience."}, {"id": "32443279", "author": "mdaniel", "year": 2022, "thread": "The Unreasonable Effectiveness of Makefiles", "text": "People keep saying that, but of the systems I've encountered that use CMake they've worked the most predictably, as opposed to autotools, meson, scons, bazel, or heavenforbid ./build.sh\n\n*WRITING* CMake is the 11th circle of hell, but CLion is gradually getting more support for it because they use(d?) it as the first-class project definition when it launched\n\nI would pay good money for CMake 4.x to switch to skylark/starlark"}, {"id": "45268338", "author": "Night_Thastus", "year": 2025, "thread": "In Defense of C++", "text": "When it comes to programming, I generally decide my thoughts based on pain-in-my-ass levels. If I constantly have to fiddle with something to get it working, if it's fragile, if it frequently becomes a pain point - then it's not great.\n\nAnd out of all the tools and architecture I work with, C++ has been some of the least problematic. The STL is well-formed and easy to work with, creating user-defined types is easy, it's fast, and generally it has few issues when deploying. If there's something I need, there's a very high chance a C or C++ library exists to do what I need. Even crossing multiple major compiler versions doesn't seem to break anything, with rare exceptions.\n\nThe biggest problem"}], "key": "i35-Cargo for C++"}, {"name": "News subscribers want ad-free, nag-free reading and would pay more for it", "one_liner": "Draft: cluster not yet reviewed. Keywords: news, readers, readers news, headlines, cancellation, article", "draft": true, "verdict_score": null, "cluster": "news, readers, readers news, headlines", "category": "media & content", "signal_score": 23.83, "authors": 20, "years": [2015, 2018, 2019, 2020, 2022, 2023, 2024, 2025, 2026], "pay_signals": 16.0, "avg_intensity": 2.6, "mentions": 20, "problem": "Readers want well-edited ad-free news that prioritizes readers over advertisers; Readers want one Spotify-style news subscription across all outlets, paid out by article clicks without tracking; Readers want to pay for news without being tracked; News subscribers want simple paid access with no ads, no spam and easy cancellation; Readers would pay for news if cancellation were easy; Readers want a single subscription for a mix of well-researched news without ads", "quotes": [{"id": "40742620", "author": "mcculley", "year": 2024, "thread": "Many people don't pay full price, most don't want to pay at all for news", "text": "I would really like to pay for well edited news. I do not want to pay for advertising and trackers in my web browser. I want to pay someone that prioritizes readers over advertisers. Ideally, no ads at all, so there is no conflict of interest for the publication when choosing topics and investigating.\n\nI had a daily local newspaper subscription and canceled it over all of the analytics embedded in the website.\n\nI have long been a subscriber to The Economist. I value having a weekly update that is well edited and not repeating every 24 hours things that have not been well investigated.\n\nI am considering subscribing to other high value feeds like The Financial Times and Bloomberg.\n\nI would app"}, {"id": "2
