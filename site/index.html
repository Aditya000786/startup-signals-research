*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

nav{margin-left:auto;display:flex;gap:4px}nav a{color:#fff;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:999px}nav a.here{background:rgba(255,255,255,.22)}
.meta{padding:10px 16px 0;color:var(--mute);font-size:13px}
.score.draft{background:var(--chip);color:var(--mute)}
.wrap{max-width:960px;margin:0 auto}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}

input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}

<script>
const IDEAS = [{"name": "Agent Deck", "one_liner": "A control plane for developers who run several AI coding agents at once: see who is stuck, resume crashed sessions, keep project memory.", "problem": "Developers who now run several coding agents in parallel lose track of which session needs input. Sessions crash and lose their transcripts. Agents ignore the codebase's conventions, and quotas and quality degradation are opaque.", "customer": "Professional developers and small teams already paying $100-200/month for coding agents, and running 3+ sessions daily.", "evidence": "The most recent cluster in the dataset (2022-2026, most mentions in the last 3 years). Comments describe concrete workflows: multiplexing many agents, phone hand-off, subagents and durable memory. The pay signal is strong in the adjacent cluster, where developers say they would pay as much as a human programmer for agents.", "solution": "A local daemon plus a web/mobile dashboard that wraps any CLI agent (Claude Code, Codex, Aider). It shows each session's status, which sessions are waiting on the user, and spend per session. It auto-saves transcripts and plans, restores crashed sessions, and injects a per-repo conventions file. Notifications go to the phone.", "mvp": "A tmux-based multiplexer with a status column (running / waiting for input / done / crashed), transcript persistence, and a push notification when a session waits for input. Ship as an open-source CLI with a paid hosted dashboard.", "business_model": "Free local CLI. $10-20 per user per month for the hosted dashboard, mobile app and team sharing.", "alternatives": "Agent vendors' own UIs (single-agent and vendor-locked), plain tmux/screen, and early tools such as Claude Squad and Conductor. Commenters complain they all treat sessions as disposable.", "why_now": "Parallel agent use only became common in 2025-2026. Vendors optimise for their own agent, which leaves a cross-agent layer open.", "risks": "Agent vendors can ship the same features natively. The market may consolidate on one agent. Developer tools have low willingness to pay unless they save measurable time.", "verdict_score": 7, "cluster": "coding, ai, ai coding, agent + ai, developers ai, developers, code", "category": "AI & ML tooling", "signal_score": 32.3, "authors": 83, "years": [2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 53.5, "avg_intensity": 2.93, "mentions": 84, "quotes": [{"id": "47310039", "author": "Beefin", "year": 2026, "thread": "Show HN: Amux – single-file agent multiplexer for headless Claude Code sessions", "text": "I built amux because running 5–10 Claude Code agents at once across different repos turned into an unmanageable mess of terminal tabs and forgotten sessions.\n\nThe core problem: Claude Code sessions crash at 3am from context compaction, agents silently block on permission prompts, and there's no good way to see which of your 8 running sessions actually needs attention. I was losing work and wasting money.\n\namux is a tmux-based multiplexer that gives you a single control plane for all your headless Claude Code sessions — from a web dashboard, your phone, or the CLI.\n\n*What it actually does:*\n\n- Registers Claude Code sessions as named tmux panes, each with its own conversation history and worki"}, {"id": "48733056", "author": "pigeonwarz", "year": 2026, "thread": "Beware, Claude Code deletes >30 day old transcripts. Anthropic won't fix it", "text": "The best mitigation I've found against this is training Claude to collate what it does within the project dir, specifically a CLAUDE.md vision file and .claude/changelog that documents the changes it makes. The biggest pain point though is remembering to force it to do that between sessions (man is that contextual memory unreliable sometimes)."}, {"id": "47678065", "author": "foofloobar", "year": 2026, "thread": "Issue: Claude Code is unusable for complex engineering tasks with Feb updates", "text": "Claude Code and Opus used to do a great job a few months ago. It seemed to get it right more often than not. It seemed to be far better at figuring out what has to be done and getting it right on the first attempt. This is likely model related since Claude Code has received some bug fixes since.\n\nThe list of bugs and performance problems appears to keep growing: reduced usage quotas, poor performance with numerous attempts at getting things right, cache invalidation bugs, background requests which have to be disabled explicitly to avoid consuming the quota too fast, Opus appears to be quantized even with high thinking mode, poor tool use with tool search disabled, broken tool search with too"}, {"id": "48634909", "author": "dluxem", "year": 2026, "thread": "GLM 5.2 vs. Opus", "text": "I think this (for me at least) is the biggest pain point. Use styles and practices from this existing code base, even if they aren't documented explicitly in AGENTS.md or something. If we're importing a library somewhere that does what the agent is doing, reuse that same library - don't chose another one. If we have a pattern for unit tests, follow the same style. Etc. etc.\n\nThat issue, and the issue of \"aesthetics\", are the biggest complaints I have today. I don't know exactly how to define aesthetics, but it's when AI is making decisions that no experienced developer or designer would. They may be functionally correct but \"ugly\" to another developer or and end user.\n\nAn example is an case "}], "key": "i0-Agent Deck"}, {"name": "Calmline", "one_liner": "An AI receptionist for your personal phone: known contacts ring through, everyone else talks to an agent that screens, summarises or wastes scammers' time.", "problem": "Scam and spam calls make people stop answering their phones. Carrier spam labels are unreliable. People also want something that can make tedious calls for them, such as bookings or stock checks.", "customer": "Older adults and their adult children, and professionals who get many unknown calls. The family plan is bought by the adult child.", "evidence": "Commenters describe getting a dozen spam calls a day and explicitly ask for a 'Daisy button' on their phone. Some would rather pay for a human screener than a heuristic. This cluster has the highest pain score among the consumer clusters.", "solution": "Call forwarding to a virtual number with a voice agent. Contacts pass straight through. Unknown callers are asked their purpose, and the user gets a transcript plus an accept/ignore prompt. Scam-likely callers are kept talking by an 'AI granny'. An outbound mode makes simple calls on the user's behalf.", "mvp": "US-only, conditional call forwarding to a Twilio number, an LLM screener, and an SMS/push summary. One persona, no outbound calls yet.", "business_model": "$6-10 per month per line, or $15 per month for a family plan covering up to 4 lines.", "alternatives": "Google Pixel Call Screen (Pixel only, basic), Apple's Live Voicemail, carrier spam filters, RoboKiller and Hiya. Commenters find these either inaccurate or limited to labelling.", "why_now": "Low-latency voice LLMs became cheap enough in 2024-2025 to keep a caller in a natural conversation at a few cents a minute.", "risks": "Platform owners (Apple, Google, carriers) are building this in. Call-recording consent laws vary by state and country. Voice-model costs grow with call minutes.", "verdict_score": 6, "cluster": "ai, scammers, scammers time, ai ad", "category": "security & privacy", "signal_score": 20.79, "authors": 11, "years": [2019, 2022, 2023, 2024, 2025, 2026], "pay_signals": 11.0, "avg_intensity": 3.27, "mentions": 11, "quotes": [{"id": "42160034", "author": "MR4D", "year": 2024, "thread": "Daisy, the 'AI Granny' Outwitting Scammers", "text": "This is fantastic.  As someone who gets roughly a dozen spam calls a day, I’d pay for this service.  Just add a “Daisy” button to my phone please!"}, {"id": "46046631", "author": "skvmb", "year": 2025, "thread": "Ask HN: Is There a Market for a \"Phone-Only\" VA Proxy?", "text": "I'd pay for something like this. Not for like talking to my attorneys or related, but I would definitely use this to call my ex and tell her that I'm taking her to court, scheduling appointments (which would need sensitive info), checking inventory of nearby distributors, ordering carryout, and more than what I can think of right now."}, {"id": "19035342", "author": "gwbas1c", "year": 2019, "thread": "Ask HN: Why can’t I block all incoming calls that aren’t in my contact list?", "text": "Honestly, I would pay for a feature where:\n\n- People in my contact list (or whitelist) automatically get through\n\n- Everyone else is forwarded to a real live human who screens my calls\n\n(The reason why I would pay is I'd rather just have a well-paid human handle this instead of some kind of AI or heuristic.)\n\nThe human could be paired with some data, like what phone network the call came from, and additional data about how likely caller ID is spoofed. If you want to get fancy, you could do some kind of machine learning where you tell the person, \"this call is xx% likely to be spam.\"\n\nTo keep things simple, I shouldn't be able to set many preferences. (This allows the human to react the same "}], "key": "i1-Calmline"}, {"name": "Homehand", "one_liner": "A home robot narrowly focused on laundry: takes dirty clothes, returns them folded.", "problem": "Laundry and dishes eat hours every week. Commenters say these are the chores they would pay most to eliminate, with quoted willingness of $3,000 up to 'car-level prices' of $20-30k.", "customer": "Dual-income households and people with disabilities or chronic illness, who will pay premium appliance prices.", "evidence": "Every mention has a high pain score (avg 3.5/5) and many state explicit prices. Several comments add a privacy requirement: an offline robot that shares data only when the owner chooses.", "solution": "A fixed-station folding appliance next to the washer and dryer rather than a mobile humanoid. It folds and stacks, it works offline, and remote assistance is opt-in.", "mvp": "A folding station for T-shirts and towels only, sold to 20 pilot households at $3k with human-in-the-loop correction for hard items.", "business_model": "Hardware at $2.5-4k, or a $99/month lease that includes maintenance.", "alternatives": "FoldiMate and Laundroid (both failed to ship) and humanoid startups such as Figure and 1X, which are years from home deployment. Fold-and-deliver laundry services are the current substitute.", "why_now": "Robot manipulation policies learned from demonstrations improved sharply in 2024-2026, and actuator costs keep falling.", "risks": "Very capital-intensive. A graveyard of failed folding robots. Reliability expectations for a home appliance are far above what is needed for a demo.", "verdict_score": 5, "cluster": "robot, households, laundry, home robot", "category": "hardware & IoT", "signal_score": 20.62, "authors": 11, "years": [2021, 2024, 2025, 2026], "pay_signals": 11.0, "avg_intensity": 3.55, "mentions": 11, "quotes": [{"id": "41360526", "author": "dinobones", "year": 2024, "thread": "Using $300 robot arms and a MacBook to fold a T-shirt", "text": "Put it on wheels. Give it a chute for dirty clothes.\n\nI'd happily pay 10x this ($3,000) to never do laundry again if it meant nicely folded clothes would always await me in my closet."}, {"id": "48602247", "author": "SoftTalker", "year": 2026, "thread": "Hyundai buys Boston Dynamics", "text": "Seems like a mistake. AI in its current form has limited usefulness for most people. Not something I would pay for to use outside of work. But a household robot that could clean, wash and fold the laundry, do the dishes, maybe even be a chauffeur... that would be huge. I think a lot of people would pay new-car money for something like that."}, {"id": "47720681", "author": "toss1", "year": 2026, "thread": "Robots eat cars", "text": "THIS!\n\nAn autonomous robot that I program, I update (or don't) as and when I see fit, and does not need to connect to the internet or to anything, for $20k that does dishes, or helps me lift things at the shop, and returning data to it's maker IF AND ONLY IF, AND WHEN, I CHOOSE (or dont)? Great - take my money!\n\nAn ambulatory machine with eyes, ears, touch sensors, continually watching, listening, observing, mapping, recording everything it encounters in my home and/or shop and sending all that data back to it's manufacturer \"for improved user experience\"?  HELL, NO!\n\nThe latter, supplied by Musk, even if he's paying me $1 million per year to 'host' it?  I'll buy the equipment to destroy it "}], "key": "i2-Homehand"}, {"name": "Signal Search", "one_liner": "A paid search engine for professionals that only ranks curated, authoritative sources and filters out SEO farms and AI slop.", "problem": "Commenters say general search results are buried in SEO content farms, recipe essays, affiliate 'reviews' and, increasingly, AI-generated pages. Professionals waste time digging for primary sources.", "customer": "Developers, researchers and analysts. Several say they would pay $10-50 a month, which no other cluster matches.", "evidence": "The largest cluster in the dataset: 44 distinct commenters across 2010-2026, almost all saying they would pay. Several name a price ($5, $10, $20, $50 per month), and the requests stay specific: curation, no ads, filters for authoritative sources.", "solution": "Search restricted to a curated index of authoritative domains (docs, papers, standards, reputable journalism, expert forums). Users can whitelist and blacklist domains and share filter lists, and an optional research-librarian service handles hard questions.", "mvp": "A vertical for software developers: an index of official docs, RFCs, GitHub issues, mailing lists and high-signal blogs, a browser bang, and a shareable lens system.", "business_model": "$8-15 per month per individual, team plans, and a paid librarian tier.", "alternatives": "Kagi (lenses, paid, mentioned approvingly), Perplexity and Phind (AI answers), and DuckDuckGo. Commenters say general engines can't get rid of spam because ad incentives work against it.", "why_now": "AI-generated content is flooding the open web, which makes a curated index more valuable. Cheap embeddings and LLM re-ranking make a small index usable.", "risks": "Kagi already serves much of this audience. Building and maintaining an index is expensive, and a narrow index produces visible misses.", "verdict_score": 5, "cluster": "search, search engine, engine, searchers", "category": "consumer & home", "signal_score": 27.52, "authors": 44, "years": [2012, 2016, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 41.0, "avg_intensity": 3.24, "mentions": 46, "quotes": [{"id": "22848670", "author": "luckylion", "year": 2020, "thread": "Moving Away from Gmail", "text": "> - like Google search in 2008. I'll happily turn off your adblocker for you and be glad to see simple, relevant text ads. Or pay up to USD5 monthly if thats better (more if necessary and if the quality is good enough, although at some point I'd probably need to expense it.)\n\nI'd happily pay significantly more if it's good. The amount of time I'd save with a good search engine will easily be calculated in hours per month. $50 a month to save me 5 hours and lots of mental energy not spent on skimming useless results? Where do I sign up?"}, {"id": "29350859", "author": "BoxOfRain", "year": 2021, "thread": "Googling for Software Development: What Developers Search for and What They Find", "text": "I’d pay a subscription for searches that effectively removed cruft and heavily SEO’d listings. The classic example is looking for a recipe and getting an essay of SEO bullshit about how these cabbage leaves were grown by the Mad Monks of Machynlleth and remind the author of the their childhood frolicking around the depths of Mordor or whatever, but also things like stackoverflow or GitHub cut-and-pastes, blog spam, empty posts with nothing but trigger words to get the ranking higher, literally any link to things like Pinterest, and other annoyances which push actually useful results down the page.\n\nEssentially I want a search engine that can differentiate results that exist to solve a proble"}, {"id": "31426279", "author": "wintermutestwin", "year": 2022, "thread": "The future of search is boutique", "text": "Here's what I want in a search engine (and I would pay for it!):\n\nA combo of curation and filtered google/bing results.\n\nFor curation, pay people who are into whatever niche topic and have a review process that spots and eliminates collusion and corruption.\n\nAnd where you don't provide curated links give me google/bing results with the crap sites filtered out. Also, upsell me on research librarian services that then feed the curation lists."}, {"id": "37604475", "author": "jwmcq", "year": 2023, "thread": "Unlimited Kagi searches for $10 per month", "text": "> How does search quality really change my life?\n\nAsk this to someone who remembers when Google first appeared.\n\nI am not a Kagi user, but am seriously considering it after a number of months having to dig through at least 8 results of paywalled or possibly AI-generated pages for almost every Google query; seriously, I just did a search for 'python concatenate list' on google and it was worse than I expected - the official docs weren't even on the first two pages and even the helpful Stack Overflow answers were the 5th result down - give it a go, the results are trash.\n\nI google things at least 20 times a day, and probably so do you. I would pay for something that can cut out the bollocks - "}], "key": "i3-Signal Search"}, {"name": "Patron Browser", "one_liner": "A browser funded only by its users, with a legally binding no-ads, no-telemetry pledge and a slow, stable feature cadence.", "problem": "Users distrust browsers funded by search deals and advertising: telemetry experiments, sponsored content and bundled services. Firefox users repeatedly ask to pay for Firefox directly and nothing else.", "customer": "Privacy-minded power users. Commenters quote $5-10 per month or $100 per year.", "evidence": "Two adjacent clusters total about 55 commenters, most of them recent (25 mentions in the last 3 years). They are explicit and consistent: users want to pay for the browser only, not for a parent organisation's side projects.", "solution": "An open-source Firefox or Chromium derivative under a member-funded structure. It ships only security fixes plus a curated feature track, with built-in blocking, containers and profile management, and its privacy promises are written into the terms of service.", "mvp": "Rebrand and maintain a hardened Firefox ESR fork (in the style of LibreWolf) with paid builds, sync and a support channel, and publish the governance charter.", "business_model": "$5 per month membership. Members get signed builds, sync and support, and the source stays free.", "alternatives": "Orion (Kagi), Vivaldi, Brave (distrusted for its crypto and ads), LibreWolf and Mullvad Browser (free, small teams). Several commenters say they would pay but 'nobody will take my money'.", "why_now": "Antitrust rulings against Google threaten browsers' search-deal funding. Manifest V3 pushed ad-block users away from Chromium.", "risks": "The classic 'I would pay' gap between stated and actual payment. Keeping up with web platform engines costs a lot, and forks drift behind security fixes.", "verdict_score": 4, "cluster": "browser, privacy, email, ad + firefox, development, paid firefox, directly", "category": "productivity & work", "signal_score": 31.28, "authors": 60, "years": [2017, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 67.0, "avg_intensity": 2.57, "mentions": 67, "quotes": [{"id": "45369141", "author": "GodelNumbering", "year": 2025, "thread": "Helium Browser", "text": "I have felt like a perennial browser refugee for a while. For about 20 years now (since OG Firefox was at peak and Chrome was not yet launched), every new browser promises the same things, gets popular enough, then does a full or partial 180.\n\nWhile I like the pitch of this browser, I find it a little difficult to take it at the face value, especially given there is no info on the founders, or whether it is run as a company or a non-profit etc.\n\nPerhaps someone in this thread could answer: which company/org structure provides best guarantees against gradual, slow, multi-year rot that seems to take over everything?\n\nI would happily pay a small monthly subscription fee for a browser if it has "}, {"id": "43211879", "author": "lurk2", "year": 2025, "thread": "Introducing a terms of use and updated privacy notice for Firefox", "text": "I am at the point where I would happily pay an annual subscription on the order of a few hundred dollars per year just to avoid the headaches of today's browsers. Don't add new features, don't change the look of anything, just give me security updates and bug fixes. The only problem with this model is what we saw happen to the streaming services; paying to avoid ads just means your data is worth that much more. Paying for a higher-tier plan is a signal that you have a greater level of disposable income, and are hence more valuable to advertisers.\n\nWhen this topic has been discussed on Hacker News in the past, it has also been pointed out that developing a browser with feature parity to Firef"}, {"id": "41170109", "author": "uhtred", "year": 2024, "thread": "Google loses antitrust suit over search deals on phones", "text": "> Most users will probably still use Google\n\nStupid them then. I don't and now I won't have to see Google defaulted to everywhere.\n\nThis is great news. If Mozilla can't afford to provide Firefox anymore then they could ask for donations or provide a paid product. I'd pay for firefox if they stripped out the google and pocket crap."}, {"id": "46300455", "author": "hsbauauvhabzb", "year": 2025, "thread": "Is Mozilla trying hard to kill itself?", "text": "I’d happily pay $100 a year for Firefox WITH an adblocker as long as part of the money is put towards ongoing internet freedom and preventing attestation"}], "key": "i4-Patron Browser"}, {"name": "QuietTube", "one_liner": "A focus client for YouTube Premium members: no Shorts, no recommendations, channel whitelists, transcript search, sponsor skipping.", "problem": "Viewers want YouTube without the attention machinery (Shorts, recommendations, AI slop channels) and without paying for bundled YouTube Music. Paying for Premium still doesn't give them those controls.", "customer": "People who use YouTube for learning, parents, and people trying to cut compulsive viewing.", "evidence": "40 commenters, 2012-2026, almost all with explicit pay intent. The asks are very specific: disable Shorts, opt out of the recommendation algorithm, whitelist channels, cap viewing at 10 hours a week for $5.", "solution": "A browser extension and TV/mobile app that runs on top of the user's own YouTube session. It hides Shorts and recommendations, adds whitelist-only mode for kids, builds a transcript search index, and skips sponsor segments using crowd-sourced data.", "mvp": "A desktop extension that strips Shorts and recommendations, adds whitelists and transcript search over the user's subscriptions, sold for $3 per month.", "business_model": "$3 per month or $25 per year, plus a family plan with parental whitelists.", "alternatives": "Unhook, SponsorBlock, DF Tube (free extensions), FreeTube and NewPipe (ToS grey zone), YouTube Kids. Gaps commenters mention: these don't work on TV apps, and they lack transcript search and parental controls.", "why_now": "Shorts were pushed into every surface, and YouTube is cracking down on ad blockers, which pushes people toward Premium plus customisation.", "risks": "Complete platform dependence: YouTube can break it or ban it. Free extensions anchor the price near zero. TV apps are hard to modify.", "verdict_score": 4, "cluster": "youtube, viewers, ad youtube, ad + shorts, youtube, viewers youtube, youtube premium", "category": "media & content", "signal_score": 28.84, "authors": 46, "years": [2012, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 47.5, "avg_intensity": 2.79, "mentions": 48, "quotes": [{"id": "47327704", "author": "wolttam", "year": 2026, "thread": "YouTube ads are about to get even longer and they'll be unskippable", "text": "I'd pay for YT premium in a heartbeat if they let me tune the platform to my needs: disable all recommends, disable all comments, allow only a whitelisted set of channels. That would be a \"take my money\" moment."}, {"id": "37947415", "author": "bazmattaz", "year": 2023, "thread": "Netflix is raising prices, again", "text": "I feel the exact same with YouTube. I would pay for it but I wouldn’t pay what it costs now because I simply only watch maybe 3-10hrs of content a week.\n\nI’d love to see them test a tier where you get something like 10hrs of ad free content a week for $5/month or something like that - it might get users like myself watching more and this upgrading to an unlimited tier. Audible do something similar and now Spotify are rolling out 20hrs of free audiobooks in their premium tier with the idea that people might upgrade."}, {"id": "48300313", "author": "epolanski", "year": 2026, "thread": "YouTube to automatically label AI-generated videos", "text": "No joke, I would pay for this more than i do for premium.\n\nHalf my feed or suggestions are AI crap.\n\nSadly I have lots of niche interests (various history topics, or engineering) and there's an endless amount of channels and videos that are entirely AI generated.\n\nAnd it takes you a while to catch them, because they are well done, even the narrator is fake. But then I realize I'm just watching an AI dramatized summary and I get mad at Youtube."}, {"id": "45366602", "author": "UltraSane", "year": 2025, "thread": "Yt-dlp: Upcoming new requirements for YouTube downloads", "text": "I would pay for YouTube if Google created the best possible search engine they could for it. I'm talking inverted and semantic indexing of every word of every video with speaker tagging and second level timestamping. I want to be able to runs queries like \"Give me the timestamps of every time Veritasium said math while wearing a blue shirt.\""}], "key": "i5-QuietTube"}, {"name": "One Pass News", "one_liner": "One wallet for journalism: read any participating outlet, pay per article or a capped monthly bundle, with revenue split by reading time.", "problem": "Readers hit a different paywall on every shared link. Nobody subscribes to 20 outlets, so they bounce or use bypass tools, even though many say they would pay 20-50 cents an article.", "customer": "Heavy news readers who follow links from aggregators and social media. Commenters quote $10-50 a month for unlimited access.", "evidence": "Three news clusters with about 65 commenters, the most persistent theme in the dataset (2012-2026). Prices are concrete: 25-50 cents an article, $10-20 a month for a Spotify-like bundle, $30-50 a month for unlimited access.", "solution": "A browser extension and publisher SDK. Each article unlocks with one click from a prepaid wallet. A monthly cap turns the wallet into a bundle, and readers can stay anonymous to publishers.", "mvp": "Sign 10-20 mid-size independent outlets and newsletters (not the NYT), launch an extension wallet with an article-unlock API, and set a $10 monthly cap.", "business_model": "Take 15-20% of reader spend. Publishers get the rest by reading time.", "alternatives": "Blendle and Scroll (both shut down), Apple News+, Inkl, Particle, Google Contributor (discontinued). Commenters say big publishers refuse to unbundle.", "why_now": "AI summaries are cutting search referrals to publishers, so they need new reader revenue. Stablecoin and Lightning payments lower the fees on small transactions.", "risks": "A two-sided cold start. Top publishers protect their subscription bundles. A long list of failed predecessors.", "verdict_score": 4, "cluster": "readers, news, article, content", "category": "media & content", "signal_score": 31.77, "authors": 73, "years": [2010, 2012, 2014, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 74.0, "avg_intensity": 2.97, "mentions": 75, "quotes": [{"id": "16571750", "author": "garyclarke27", "year": 2018, "thread": "Apple to acquire digital magazine service Texture", "text": "Hopefully Apple will turn Apple News into a News spotify.\nI would happily pay a subscription  - say 2 tiers light <2> heavy (hr pw) $10 / $20 pm - with the subs shared amoungst content providers based on time spent reading. I subscribe to several now such as FT, Economist, Times. Expensive and a real pain though, having multiple subs so I may drop them soon, an aggregated sub would be so much better. Apple News would be an excellent platform for this, I love it’s layout, quality and Font size controls. I tried Readly App it’s reader is truly awfull based on pdf version of paper mags so you have to pan and scan and scroll all the time."}, {"id": "14497266", "author": "dcosson", "year": 2017, "thread": "WSJ Ends Google Users' Free Ride, Then Fades in Search Results", "text": "Why doesn't this exist yet? It seems so obvious, so many people get news from Facebook, twitter, Reddit, (and to a lesser extent HN) on an article by article basis. But all news sites delude themselves into thinking they can make these people loyal customers of their content, to the tune of paying $10-30 per month. I would happily pay $0.50 or something per article (maybe price adjusted by word count, within reason) to be able to get news from a wide variety of sources and engage with comments on the social/aggregator sites.\n\nIs it just too big of a chicken and egg problem to coordinate a single broker for this across many sites? Unfortunately a broker is needed because I don't think there e"}, {"id": "37949516", "author": "Aqueous", "year": 2023, "thread": "Silicon Valley Ditches News, Shaking an Unstable Industry", "text": "I can only speak for myself, but here is what I would happily pay for: I would happily pay up to 20 cents to read a single article, ad free (or even, I suppose, not ad free), and for perpetual access to that article. And I would happily pay up to 50 bucks a month for all of the articles I read from all\npublications combined. What I will not do is purchase 20 subscriptions with recurring charges to 20 different media publications, none of which let me read articles from any other publication, and then remember to cancel them and reactivate them on a continuous basis so I can fly through paywalls. What I will also not do is hand over a bunch of personal contact information for the privilege of"}, {"id": "20569640", "author": "johncalvinyoung", "year": 2019, "thread": "Google unlocks 33% of publisher paywalls on July 30", "text": "I go the other direction. I am way too fast a reader and read too widely to handle per-article microtransactions well. I do have a subscription to a couple of my top magazines and news sources, but end up reading up to the free allotment on many, many more every month. I'd happily pay $30-50/mo for unlimited access to many sources, but it'd have to have 10+ of my favorites on board to make it worthwhile. I read 20-50 serious articles a day, across free and paywalled and subscription content. I'm unwilling to pay $10-25/mo for each source individually. But if the average could get down around $5/mo for each major source (that I'll read 15-50 articles/mo from, given the access), and leftover c"}], "key": "i6-One Pass News"}, {"name": "Ledger Brief", "one_liner": "A daily news brief that merges coverage across outlets, keeps only sourced claims, shows where outlets disagree, and hides clickbait and AI filler.", "problem": "Readers want facts without spin and clickbait. They want claims traced to sources, multiple viewpoints side by side, and only the stories that affect them.", "customer": "Professionals with little time and readers who use RSS. Commenters quote $5-20 a month.", "evidence": "Two clusters, about 38 commenters. They keep asking for the same features: fact extraction across sources, inline fact-checks, viewpoint clustering, relevance filters, full-text RSS and deduplication.", "solution": "An LLM pipeline over licensed and RSS sources. It clusters coverage per event, extracts claims with citations, flags where sources disagree, and personalises by declared interests. Delivery by email, RSS or Kindle.", "mvp": "Tech and business news only: a daily email of 10 stories, each with 'what's known / disputed / sources', plus RSS output.", "business_model": "$6 per month, plus team plans for analysts.", "alternatives": "Ground News (bias ratings), Particle, Techmeme, Feedly AI, Artifact (shut down). Commenters complain these still pass along clickbait and lack claim-level sourcing.", "why_now": "LLM claim extraction and clustering got cheap. Trust in single outlets is low.", "risks": "Licensing of source content, hallucinated or garbled claims, and churn once the novelty fades.", "verdict_score": 5, "cluster": "rss, feeds, rss feeds, readers", "category": "media & content", "signal_score": 24.44, "authors": 21, "years": [2013, 2015, 2016, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 18.0, "avg_intensity": 2.83, "mentions": 23, "quotes": [{"id": "18975447", "author": "heavenlyblue", "year": 2019, "thread": "Ontology Is Overrated: Categories, Links, and Tags (2005)", "text": "I must absolutely disagree with you: in my opinion the problem of fake news stems from compartmentalisation of news sources (lack of their diversity), rather than lack of actual facts in the news sources.\n\nThe fact that you can read about the same topic in several (more often opposing) ways is already a reason to red-flag the piece in the first place. This isn’t readily available through any of the current newspapers. Everyone has an opinion.\n\nI would happily pay for an aggregator that simply ejects facts (stated facts, not truths) from the stories. Then combines that with similar other pieces."}, {"id": "39133603", "author": "unshavedyak", "year": 2024, "thread": "Social Media, AI, and the Battle for Your Brain", "text": "The problem is they're _also_ guilty of spinning \"fake news\". Yea, it's far more subtle, but \"people left\" for a reason.\n\nI think there is opportunity here, but i don't think it's back to the old ways. I imagine it would be some hybrid. A news source which aggressively documents and details sources. All opinions backed by a paper trail, etcetc.\n\nI'd pay for that. Or something.. but i don't know what that looks like. These days it feels like everything has an agenda, and nothing (at least that i've seen) backs up claims/opinions/supposed-facts with the data fueling the statement."}, {"id": "35664976", "author": "echelon", "year": 2023, "thread": "NewsNotFound: An open-source, unbiased news company", "text": "Unbiased news algorithm:\n\n1. Identify all clusters of power and opinion, eg. Republicans, Democrats, Chinese Communist Party, UK Labour Party, Green Party, etc.\n\n2. Associate each cluster with news organizations that tightly align with their policies.\n\n3. Evaluate stories - headlines in only one cluster (under reported elsewhere) represent a view. Headlines that have different takes, likewise, give you a spectrum of thought on an issue or topic.\n\n4. Collect fine points and build a report. Bonus for providing contrasting opinions and associating them with the party/power responsible for that thinking.\n\nI want this tool. It'd be okay if it wasn't perfect. Just getting 80% of the way there woul"}, {"id": "12933006", "author": "hackuser", "year": 2016, "thread": "Winds – An Open Source Personalized RSS Reader", "text": "Does anyone know an RSS feed reader with these features?\n\n1) Deduplication\n\n2) Grouping of articles on the same topic. For example, grouping all articles on Angela Merkel's latest Brexit comments, so I can easily choose one and ignore the rest.\n\nGrouping would make me an order of magnitude more efficient when reading RSS. I'd happily pay $100 for that feature.\n\nAlso:\n\n3) Efficiently and automatically manage broken feeds: Automatically retry (over X hours or days), automatically look for a replacement feed, and then let me know which feeds need my attention."}], "key": "i7-Ledger Brief"}, {"name": "Linux Just Works", "one_liner": "A curated laptop plus Linux distro sold as one supported product, with the polished commercial apps people miss.", "problem": "People leaving macOS and Windows want Linux but hit jank: drivers, HiDPI, sleep, trackpads, and missing commercial apps (Lightroom, Excel, a good image editor). Commenters say their time is worth more than tinkering.", "customer": "Developers and Mac switchers who will pay $100-300 a year or a hardware premium for something that 'just works'.", "evidence": "About 43 commenters across two clusters, 2015-2026, with explicit prices ($15 a month, $100-300 a year) and a recurring 'take my money' tone. Paid Linux apps (a RAW editor, a Paint.NET equivalent) form a sub-cluster.", "solution": "One or two laptop models certified end to end: firmware, sleep, trackpad tuning, colour calibration. A maintained distro, a support subscription, and a store of paid native apps whose revenue is shared with developers.", "mvp": "Pick one Framework or ThinkPad model, ship a tuned image with a trackpad gesture stack and app store, and sell a $150 per year support plan.", "business_model": "Hardware margin plus a support subscription plus a 15% cut of app sales.", "alternatives": "System76, Tuxedo, Framework with Ubuntu, Dell XPS Developer Edition, Asahi on Macs. Commenters still report rough edges and missing pro apps.", "why_now": "Windows 11 ads and telemetry and Apple's lock-down are pushing developers away, and Proton showed compatibility work can pay off.", "risks": "Hardware margins are thin and support costs are high. App vendors may not port. The market of Linux users who actually pay is small.", "verdict_score": 4, "cluster": "linux, laptop, linux laptop, macbook + desktop, macos, linux, polished + linux, editor, image, image editor", "category": "hardware & IoT", "signal_score": 29.21, "authors": 43, "years": [2016, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 40.0, "avg_intensity": 2.94, "mentions": 47, "quotes": [{"id": "40609845", "author": "drdo", "year": 2024, "thread": "Desktop Linux is an Untapped Gold Mine", "text": "I used Linux on personal machines for decades but recently switched to Mac because I no longer have the patience to deal with the constant jank (and these M1/2/3 macbooks are so good).\n\nI would pay for nice vertically integrated Linux laptop where everything works well and I don't have to deal with numerous small problems that amount to a suboptimal experience."}, {"id": "28620783", "author": "qsort", "year": 2021, "thread": "Leaving the Apple ecosystem behind", "text": "I'd say the #1 reason is that most developers (myself included) want the intersection of:\n\n- Unix-like, developing on Windows is pure torture\n\n- Don't waste my time with configurations, drivers and other crap, I want a machine that I can be productive with out of the box. Take my money if you have to, but I don't want to edit Xorg.conf ever again.\n\nYou can talk about polish all day, but no machine that doesn't satisfy both is even close to appealing for a majority of developers in my experience.\n\nYou are right about the native app ecosystem being less of a blocker, but that's in line with my point."}, {"id": "35645854", "author": "eastbound", "year": 2023, "thread": "Canonical releases Ubuntu 23.04 Lunar Lobster", "text": "> It’s free\n\nI want to pay for my Linux.\n\nI’d write a wishlist but anyone could write another one, but I’d take any OS that convinces me to pay $300 a year.\n\nI’d pay for anything as nice as macOS (with the old control panel). I pay that price for my IDE and an OS is worth way more, open-source at that, which actually advances humanity. Linux is the VIIth wonder of the human civilization, a demonstration of human selflessness, as opposed to Windows, Linux will be here in 50 years becauE OSS is a donation of code to our children; Also no human construction has ever been so widespread across the world and even on other planets (Linux is powering the helicopter flying on Mars), of course I wish "}, {"id": "49098486", "author": "willbicks", "year": 2026, "thread": "Darktable", "text": "If Capture One or any other buy-once commercial offering worked at all under Wine (or, in a dream land, had a Linux build), I would happily pay for it. But unfortunately, I've had no luck getting either Capture One or DxO PhotoLab running on Linux.\n\nI struggle with Darktable's workflow, but it works without issue on Fedora with Wayland (including with my monitor's color calibration), so I'm sticking with it for now."}], "key": "i8-Linux Just Works"}, {"name": "Clean Windows Pro", "one_liner": "Managed, supported Windows configurations for small businesses and developers that remove ads, telemetry and forced updates.", "problem": "Windows users, especially developers and small-business owners, say they would pay several times the licence price for a Windows with no ads, telemetry, bundled crapware or forced updates. Microsoft doesn't sell that to individuals.", "customer": "Small dev shops and studios on Windows, and hobbyists who depend on legacy Windows-only software.", "evidence": "15 commenters, many saying they'd pay 'full price' or '5x'. Developers explicitly ask for a 'dev edition'. Some want paid security patches for older Windows versions their hobby software needs.", "solution": "A management agent plus policy pack applied to genuine Windows Pro or Enterprise licences. It enforces debloat, controls update windows, disables telemetry where policy allows, and is offered with support and rollback.", "mvp": "Signed configuration profiles plus an agent for Windows 11 Pro, sold to 10-50 seat businesses with MSP-style support.", "business_model": "$5 per device per month.", "alternatives": "Windows LTSC (licensing hard to obtain), free debloat scripts (O&O ShutUp10, Win11Debloat), and in-house IT. Commenters want something legal, simple and supported.", "why_now": "Windows 11 keeps adding ads and AI features (Recall, Copilot), and the end of Windows 10 support forces upgrades.", "risks": "Microsoft can undo the tweaks with updates. Licence-term risk. The market overlaps with existing MSP tooling.", "verdict_score": 3, "cluster": "windows, edition, windows edition, minimal + windows, windows telemetry, telemetry, windows versions", "category": "productivity & work", "signal_score": 23.98, "authors": 19, "years": [2015, 2016, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 20.5, "avg_intensity": 3.0, "mentions": 21, "quotes": [{"id": "38905134", "author": "rkagerer", "year": 2024, "thread": "Windows XP 2024 Edition is everything I want from a new OS", "text": "My god how I would happily pay 5X per copy for a Windows that had all the shitty new garbage culled out (like ALL the Telemetry and forced updates)."}, {"id": "40505239", "author": "_hao", "year": 2024, "thread": "Microsoft should accept and give up Windows 11, throw everything at Windows 12", "text": "If you un-fuck Win 11 (shout out to O&O ShutUp10++ which should be mandatory for any user), PowerToys and WSL it's _probably_ the best dev environment you can get. Even so, the trajectory is not great. I wonder where the point of resistance will be for the normal user, but then again probably it doesn't matter. Normal users won't go to Linux. It's either Mac or Windows.\n\nAs a Dev (and company owner) I would pay for a stripped out version of Windows Pro that contains only the stuff I need for dev and nothing else. No AI crap, no spyware and forced updates crap etc."}, {"id": "11459393", "author": "Silhouette", "year": 2016, "thread": "Subscription Pricing Is for Stagnating Products", "text": "As long as my app gains new users every day, new people will buy my app.\n\nThat works as long as there is plenty of market opportunity left for your app, which might be the case for a little business in a big market. It's not the case if you actually do have close to a 100% installed base in your target market, though, and that is what some of these huge software companies are facing.\n\nWhat I don't buy is the idea that going subscription-only is the only plausible alternative. I agree with the author here that trying to force subscription-only pricing is often a warning sign of stagnation, precisely because I disagree with this:\n\nPaid upgrades won’t help.\n\nWhy not? If you're providing useful "}], "key": "i9-Clean Windows Pro"}, {"name": "Inbox Pro", "one_liner": "A fast, native, keyboard-driven email client that works with any IMAP provider, sold as a paid upgrade rather than a subscription.", "problem": "Power users find desktop mail clients bloated, ugly or tied to one provider. Web clients keep changing against their wishes, and they want order and notification email grouped automatically.", "customer": "Heavy email users. Commenters quote $50-100 a year or $99 per major release.", "evidence": "14 commenters across 2012-2025 with explicit prices. They consistently want native performance, standard protocols, keyboard control, privacy and stable UX.", "solution": "A cross-platform native client (Rust or Swift) over IMAP and JMAP with local search, threading that bundles transactional mail, vim-style commands and optional on-device AI summaries.", "mvp": "Mac and Linux, IMAP plus Fastmail JMAP, keyboard-first triage, instant local search, $59 one-time.", "business_model": "A paid licence with paid major upgrades, in the style of Sublime Text or JetBrains.", "alternatives": "Superhuman ($30 a month, Gmail and Outlook only), Mimestream (Gmail only), Spark, Thunderbird, Apple Mail and mutt/aerc. Commenters list each one's gap.", "why_now": "Gmail and Outlook keep changing their UIs and adding AI. Fastmail and Proton users want good clients for the services they already pay for.", "risks": "A crowded field, plus the long tail of IMAP edge cases and email rendering bugs. Email clients have historically been hard to monetise.", "verdict_score": 5, "cluster": "email, email client, client, transactional email", "category": "communication & social", "signal_score": 23.47, "authors": 18, "years": [2012, 2016, 2017, 2018, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 16.5, "avg_intensity": 2.79, "mentions": 19, "quotes": [{"id": "16975239", "author": "SyneRyder", "year": 2018, "thread": "I've spent the last two years building a new email client", "text": "For some of us, email is so important that we are prepared to pay a LOT for a really great client.  I'm currently paying around $150/year for Photoshop - email is more important to me than Photoshop.  For the right program, I would happily pay $99 for a major release.  I think that's what I used to pay for Eudora many years ago.\n\nPostbox currently only charges $40 for a lifetime free-upgrades license.  In my case, they are definitely leaving money on the table, I would've paid a lot more."}, {"id": "11196066", "author": "SyneRyder", "year": 2016, "thread": "Ask HN: Favorite Email Client?", "text": "I've mostly been happy with Postbox since I moved from Eudora.  It's a commercial fork of Thunderbird with some extras.\n\nhttp://postbox-inc.com\n\nAlas I've been having problems with v4 (including frequent hanging related to their timeboxing \"Time Spent Writing\" timer), so I can't endorse it as much as I used to.  I'm also frustrated that the address book doesn't include Google Contacts integration.\n\nEmail is critical to me, and I'd happily pay $50 - $100 / year for the perfect cross-platform email client.  (Postbox is only $15, which is ridiculously cheap for the value I get from it.)"}, {"id": "23618467", "author": "cercatrova", "year": 2020, "thread": "Superhuman’s email app is overhyped and overpriced", "text": "Maybe the switching costs are high, or maybe not. Superhuman is designed such that every single interaction can be done on the keyboard, I'm not sure of another email client that has that level of control, so I'm not sure as to your point about memorizing keyboard shortcuts.\n\nIt's like an email version of vim (or emacs if you prefer), but more GUI-based and for non-technical people. Would you pay for vim, is I think the real question, given that one is an active vim user already. Since it saves me so much time and switching cost from keyboard to mouse, I would pay for it. That it is currently free and open source is nice, too, but I think some programmers would definitely pay if it weren't."}], "key": "i10-Inbox Pro"}, {"name": "Fair AI Chat", "one_liner": "A private AI chat plan with transparent usage meters, cheaper tiers for light users, cited answers and a contractual promise not to train on chats.", "problem": "AI chat plans are sized $0 or $20+. Heavy users hit opaque caps, light users overpay, and privacy-minded users don't trust training opt-outs.", "customer": "Professionals and privacy-sensitive knowledge workers, plus a price-sensitive $5-a-month tier.", "evidence": "13 commenters (2023-2026) with explicit pay intent. They ask for flat rates covering chat and API, predictable limits, a no-training guarantee, citations and less sycophancy.", "solution": "A model-agnostic chat front end that routes requests to API models, shows a live usage meter, offers $5, $15 and $40 tiers, keeps zero-retention routing with no training, and cites sources on every answer.", "mvp": "A web app with BYO or pooled API keys, a usage meter, zero-retention endpoints, and per-message cost shown.", "business_model": "Tiered subscriptions with a margin over API cost.", "alternatives": "ChatGPT, Claude, Gemini plans, Perplexity, OpenRouter chat, T3 Chat, Poe. Gaps commenters name: opaque limits, pricing that fits no one, and training concerns.", "why_now": "API prices for strong models keep falling. Privacy regulation and enterprise zero-retention terms make the guarantee feasible.", "risks": "Thin margins over the model labs, who can undercut on price. Little to differentiate the front end.", "verdict_score": 4, "cluster": "chat, ai chat, ai, tier + chat, ai chat, ai, responses", "category": "AI & ML tooling", "signal_score": 22.5, "authors": 19, "years": [2023, 2024, 2025, 2026], "pay_signals": 17.0, "avg_intensity": 2.68, "mentions": 19, "quotes": [{"id": "42330906", "author": "iagooar", "year": 2024, "thread": "ChatGPT Pro", "text": "I am using more Claude.ai these days, but the limitations for paying accounts do apply to ChatGPT as well.\n\nI find it a terrible business practice to be completely opaque and vague about limits. Even worse, the limits seem to be dynamic and change all the time.\n\nI understand that there is a lot of usage happening, but most likely it means that the $20 per month is too cheap anyway, if an average user like myself can so easily hit the limits.\n\nI use Claude for work, I really love the projects where I can throw in context and documentation and the fact that it can create artifacts like presentation slides. BUT because I rely on Claude for work, it is unacceptable for me to see occasional warni"}, {"id": "43165653", "author": "danw1979", "year": 2025, "thread": "Claude 3.7 Sonnet and Claude Code", "text": "What I really want (as a current Pro subscriber) is a subscription tier (\"Ultimate\" at ~$120/month ?) that gives me priority access to the usual chat interface, but _also_ a bunch of API credits that would ensure Claude and I can code together for most of the average working month (reasonable estimate would be 4 hours a day, 15 days a month).\n\ni.e I'd like my chat and API usage to be all included under a flat-rate subscription.\n\nCurrenty Pro doesn't give me any API credits to use with coding assistants (Claude Code included ?) which is completely disjointed.  And I need to be a business to use the API still ?\n\nHonestly, Claude is so good, just please take my money and make it easy to do the "}, {"id": "46646451", "author": "maqp", "year": 2026, "thread": "Confer – End to end encrypted AI chat", "text": "My issue is it claims to be end-to-end encrypted, which is really weird. Sure, TLS between you and your bank's server is end-to-end encrypted. But that puts your trust on the service provider.\n\nUsually in a context where a cypherpunk deploys E2EE it means only the intended parties have access to plaintexts. And when it's you having chat with a server it's like cloud backups, the data must be encrypted by the time it leaves your device, and decrypted only once it has reached your device again. For remote computing, that would require LLM handles ciphertexts only, basically, fully homomorphic encryption (FHE). If it's that, then sure, shut up and take my money, but AFAIK the science of FHE isn"}], "key": "i11-Fair AI Chat"}, {"name": "Plainnote", "one_liner": "A local-first notes app sold for a one-time licence, with reliable sync to your own storage and guaranteed backups.", "problem": "Note-takers want fast, simple, cross-platform notes they own, with no subscription, reliable sync and no data loss. Evernote refugees want painless migration and a good web clipper.", "customer": "Personal knowledge workers and people leaving Evernote.", "evidence": "13 commenters, mostly asking for a one-time licence, local-first storage, open formats and sync to a self-hosted server.", "solution": "Markdown files on disk, a CRDT sync engine that works over the user's own S3, WebDAV or Syncthing, versioned backups, an Evernote importer and a web clipper.", "mvp": "Mac and Android apps, an S3 sync target, an Evernote ENEX importer, $29 one-time.", "business_model": "A one-time licence plus optional paid hosted sync at $3 a month.", "alternatives": "Obsidian (dominant, paid sync), Bear, Joplin, Logseq, Apple Notes, Standard Notes. Commenters complain about subscriptions and sync reliability.", "why_now": "Evernote layoffs and price rises push users out, and local-first tooling has matured.", "risks": "Obsidian already owns much of this audience. Note apps have little lock-in on purchase and a very crowded market.", "verdict_score": 3, "cluster": "note, notes, time, local notes + multi, sync, device sync, multi device", "category": "productivity & work", "signal_score": 21.65, "authors": 17, "years": [2011, 2017, 2020, 2021, 2022, 2024, 2025], "pay_signals": 15.0, "avg_intensity": 2.65, "mentions": 17, "quotes": [{"id": "40258558", "author": "largbae", "year": 2024, "thread": "Lowercase – A simple way to take and share notes", "text": "Please charge something. In order to trust my notes somewhere, I need it to be in someone's best interest to keep my data and not grow bored or overburdened by costs.\n\nI desperately want a simple, cross-platform, online or offline, fast note taking app. Evernote was this maybe 10 years ago before the bloat. I beg them every feedback opportunity to get Team features, chat, AI, and never ending upgrades out of my face. When I open the app it is because I either have a quick thought to capture or I need to retrieve one. That is the worst time for a distraction.\n\nPlease charge a profitable amount and take my money."}, {"id": "28633670", "author": "jll29", "year": 2021, "thread": "Show HN: I wrote a local-first notes app for Mac, with data longevity in mind", "text": "> 1. Subscription. I'd pay for a one time license. I'd pay for upgrades, but I'd want to own it.\n\nI'd love to have this, but as latchkey says for a one-time\npurchase. Ideally, the app would be open source and available for Mac as well as Linux, so one could add bespoke extensions. Note the reason I say \"open source\" is not because I would want it for free, but because open source means I will still be able to use it in 20 years on whatever platform will be mine then.\n\nWish list:\n\n- plug-in for Emacs, Atom and Sublime.\n\n- versioning support (Git integration)"}, {"id": "33642573", "author": "lukewrites", "year": 2022, "thread": "Why Evernote failed to realize its potential (2021)", "text": "What got me hooked on Evernote was its web clipper. It did a great job of grabbing elements from webpages, retaining (or not!) their formatting. This made them easily searchable and nice to read, too. I used this to grab individual forum posts for things I cared about.\n\nI would happily pay for a subscription because of the amount of legacy data I have in there, but $90/year seems silly, my usage dropped way off once they restricted the number of devices, and at this point there are OSS options that are about as good. I probably should hire someone of fiverr for $90 or less to export/import my data."}], "key": "i12-Plainnote"}, {"name": "Gatekeeper Captcha Pass", "one_liner": "A paid, privacy-preserving way for VPN and Tor users to skip captchas, paying websites a fraction of a cent instead of solving puzzles.", "problem": "Users behind VPNs, Tor or CGNAT face endless captchas. They would rather pay a few cents than lose minutes.", "customer": "VPN and Tor users and privacy-minded professionals who say they'd pay $1 per 1,000 captchas or a monthly fee.", "evidence": "9 mentions with explicit prices (a tenth of a cent each, 15 cents per site, $1 per 1,000). The pain is concrete and recurring.", "solution": "A browser extension issuing blind-signed Privacy Pass tokens, paid for with a prepaid balance and redeemed with participating bot-protection providers, with no identity revealed.", "mvp": "Partner with one bot-protection vendor (Cloudflare Turnstile already supports Privacy Pass tokens), issue paid tokens, and ship a Firefox extension.", "business_model": "Users buy token packs, and the revenue is shared with providers.", "alternatives": "Apple Private Access Tokens (Apple devices only), Cloudflare's Privacy Pass extension, and captcha-solving farms (grey market). Commenters want something legitimate that works across browsers.", "why_now": "AI bots have made captchas more aggressive, and the Privacy Pass standards are finalised at the IETF.", "risks": "Needs buy-in from Cloudflare, Google and hCaptcha. The market may be small. The solver-farm stigma.", "verdict_score": 4, "cluster": "captchas, solves captchas, solves, bypass", "category": "consumer & home", "signal_score": 21.27, "authors": 11, "years": [2016, 2017, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 12.0, "avg_intensity": 3.0, "mentions": 14, "quotes": [{"id": "30883031", "author": "hedora", "year": 2022, "thread": "The end of the road for Cloudflare CAPTCHAs", "text": "I wish they'd stop using IP address as a signal.  My ISP is a carrier grade NAT.  Cloudflare captchas are the main problem with using Tor or a VPN.\n\nForcing sites to require JavaScript is even worse.\n\nTogether, captchas and the new replacement from the article mostly just undermine client side security, which opens sites to much jucier attacks than unauthenticated bots reading from CDN cache!\n\nOn top of that, I regularly fail Captchas.  I'd happily pay for a browser plugin or something that would have my computer complete them for me.  It's probably better at it then me!"}, {"id": "20615275", "author": "xur17", "year": 2019, "thread": "There is no evil like reCAPTCHA", "text": "Or if you are using tor, are blocking tracking, etc. I regularly have to solve 5 or 6 puzzle challenges in a row.\n\nI would happily pay a monthly fee to get around these ridiculous captchas, even though it's absurd to have to do so."}, {"id": "11455295", "author": "byuu", "year": 2016, "thread": "I’m not a human: Breaking the Google reCAPTCHA [pdf]", "text": "Someone should really make a web browser plugin that automatically solves CloudFlare, Google and Facebook captchas for people using ::gasp:: VPNs. I would happily pay $1 for every 1000 captchas served at me to be solved for me, even if it took the page a bit longer to load for me still. As long as the latency wasn't too much higher than it'd take me to solve it myself.\n\nJust like with DRM, captchas only seem to punish legitimate users and perhaps very small-time bad actors."}], "key": "i13-Gatekeeper Captcha Pass"}, {"name": "Pocket Flagship", "one_liner": "A small (4-4.7 inch) phone with flagship internals and good battery life, for the people who keep saying they'd pay flagship prices for one.", "problem": "Small-phone fans can't buy a current high-end phone that fits in one hand. The mini iPhones were discontinued.", "customer": "Small-phone enthusiasts and people with small hands. Commenters quote up to $1,200.", "evidence": "10 commenters (2014-2024) with explicit premium willingness to pay, which is unusually strong for hardware.", "solution": "A stock Android or GrapheneOS-compatible small phone, built with an ODM using flagship chips and a dense battery, sold direct in limited runs.", "mvp": "Crowdfund a 4.5-inch phone on a mid-high chip, with pre-orders to validate demand above 20k units.", "business_model": "Hardware margin on limited runs at $699-899.", "alternatives": "Unihertz Jelly (low-end), Asus Zenfone 9/10 (discontinued), the iPhone mini (discontinued). Apple's own sales data suggests the market is small.", "why_now": "Phones keep growing, and an ODM ecosystem plus crowdfunding lowers minimum order quantities.", "risks": "Mini iPhone sales were weak, so stated demand likely overstates real demand. Hardware capital, certification and multi-year update commitments.", "verdict_score": 3, "cluster": "small, phone, phones, small phone", "category": "hardware & IoT", "signal_score": 18.59, "authors": 11, "years": [2014, 2016, 2019, 2020, 2021, 2022, 2023, 2024], "pay_signals": 11.0, "avg_intensity": 2.73, "mentions": 11, "quotes": [{"id": "18841821", "author": "princeb", "year": 2019, "thread": "The Phone That’s Failing Apple: iPhone XR", "text": "i'd happily pay up to $1200 for a high spec 4\" phone.\n\ni'm on an SE. i got this phone fairly late into its life cycle and it was a deliberate choice. my biggest regret is probably not getting a second one before they discontinued it because when my current SE fails i have no idea where to get a replacement."}, {"id": "19481938", "author": "ddebernardy", "year": 2019, "thread": "Apple iPhone SE Available on Apple Store Again", "text": "Anecdotally, I'd happily pay what the iPhone 8 costs to get an iPhone SE-like form factor with updated hardware.\n\nThe recent generations of iPhones all look and feel too large to me. I'm like, maybe Apple should include tactical pants in their accessories:\n\nhttps://techcrunch.com/2011/05/02/carry-your-ipad-2-in-the-p..."}, {"id": "37767202", "author": "crossroadsguy", "year": 2023, "thread": "Pixel 8 Pro", "text": "If only 13 Mini battery wasn’t shit. I don’t need the 1000 mega pixel camera or M20 Apple cheap. Just give me a good battery and a non-crazy sized phone and I am good. And yeah take my money."}], "key": "i14-Pocket Flagship"}, {"name": "Local Voice", "one_liner": "Fully offline voice tools sold once: dictation in any text box, unlimited transcription, and podcast or stream audio cleanup.", "problem": "Writers and professionals want accurate dictation and transcription without sending audio to the cloud and without per-hour or per-minute subscriptions. Podcasters want automated offline editing.", "customer": "Writers, lawyers, clinicians and podcasters on Mac and Windows.", "evidence": "9 commenters (2021-2026) asking for offline processing and one-time pricing, and naming specific workflows (system-wide dictation, 24/7 transcription, podcast editing).", "solution": "A native app bundling local Whisper-class speech-to-text with system-wide insertion, local LLM cleanup, filler and silence removal, and noise suppression, all on-device.", "mvp": "Mac menubar dictation for any text field, plus a drop-a-file transcription mode, $49 one-time.", "business_model": "A one-time licence plus paid major upgrades, and team licences for clinics and law firms.", "alternatives": "superwhisper, MacWhisper, Aqua Voice, Wispr Flow, Descript (cloud), Apple dictation. Commenters object to cloud audio and subscriptions.", "why_now": "On-device speech models now match cloud accuracy on Apple Silicon and recent GPUs.", "risks": "Commoditising fast: the OS vendors are shipping it, and there are many indie competitors.", "verdict_score": 4, "cluster": "voice, audio, natural, cleanup + voice, offline voice, voice dictation, dictation", "category": "productivity & work", "signal_score": 21.77, "authors": 16, "years": [2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 12.5, "avg_intensity": 2.81, "mentions": 16, "quotes": [{"id": "37212401", "author": "nchudleigh", "year": 2023, "thread": "Show HN: superwhisper – AI powered offline voice to text for macOS", "text": "> However, if this is indeed a productivity enhancer, you should market to companies, not workers.\n\nThat's the plan. Gotta start somewhere.\n\n> You mention that I should pay an ongoing fee for features to be added over time. However, there is no guarantee of future feature development even if I do pay every month. And there is definitely no guarantee I will care about or like the new features either. If this transcription works well, that’s the only feature I need.\n\nFor a monthly subscription or annual subscription, the developer is incentivized to develop new features to retain the ongoing payments coming from the existing customer base.\n\nA one-time payment model actually incentivizes the de"}, {"id": "43642885", "author": "replete", "year": 2025, "thread": "Show HN: Aqua Voice 2 – Fast Voice Input for Mac and Windows", "text": "Product/UI looks good. Nice job. I would pay for a completely offline version of this, cloud voice data is non-starter for me though unfortunately"}, {"id": "37544667", "author": "tikkun", "year": 2023, "thread": "Ask HN: Looking for a 24-7 Real-Time Voice Transcription Tool", "text": "I'm interested in the same thing and have spent quite a bit of time looking.\n\nRewind.ai is ok (transcription accuracy is meh)\n\nVoice Memos.app is ok (though no native transcription, and requires stopping and starting)\n\nOtter.ai is ok (though there's a 4 hour limit on recordings, and there's no paid plan that allows for enough recording minutes to do 24/7)\n\nMy ideal solution would be that Otter comes out with a Pro 24/7 plan with 60,000 minutes per month and no max recording length, for $60-80/mo.\n\nI would pay for this and have paid for alternatives, though I'd prefer to use an existing company that I've used for a while and that has lots of users, due to privacy/trust, or perhaps a small sta"}], "key": "i15-Local Voice"}, {"name": "Genuine Check", "one_liner": "Independent verification that a marketplace product is genuine, plus affiliate-free test results for commodity goods.", "problem": "Shoppers can't tell genuine parts from counterfeits mixed into marketplace inventory, and review sites are affiliate farms. Commenters want honest tests of USB drives, groceries and similar goods.", "customer": "Online shoppers buying electronics, parts and consumables, and eventually brands that want proof of authenticity.", "evidence": "About 8 high-pain mentions (avg 3.5) with explicit pay intent for honest, affiliate-free reviews.", "solution": "A browser extension that flags risky marketplace listings (commingled inventory, seller history, review anomalies), backed by lab tests of commodity products and funded by subscriptions rather than affiliate links.", "mvp": "Flash storage and chargers only: buy samples from top listings, test them, and publish a subscriber dashboard plus extension warnings.", "business_model": "$4 a month consumer subscription, plus paid authenticity certification for brands.", "alternatives": "Consumer Reports (slow, broad), Fakespot (shut down in 2025), Wirecutter (affiliate-funded), RTINGS (narrow).", "why_now": "Fakespot's shutdown left a gap, and AI-generated fake reviews are surging.", "risks": "Testing costs a lot per SKU, marketplaces are adversarial, and willingness to pay for reviews is low.", "verdict_score": 4, "cluster": "counterfeit, shoppers, avoid, counterfeits", "category": "commerce & marketplaces", "signal_score": 17.99, "authors": 8, "years": [2018, 2019, 2020, 2021, 2023, 2024, 2026], "pay_signals": 6.5, "avg_intensity": 3.62, "mentions": 8, "quotes": [{"id": "46679798", "author": "TuringNYC", "year": 2026, "thread": "Amazon is ending all inventory commingling as of March 31, 2026", "text": ">> Amazon has them for $30, but has none of the legitimate item which are only sold through a dealer network and dealers charge the OEM price of $285 bucks plus shipping. It’s not quite the same part – cause dealers only sell a larger unit that includes the heater - you can’t buy the actual part number except via a knockoff.\n\nPossibly the reason the OEM price is so high is because it is backed by huge liability insurance (e.g., you get into a Jacuzzi and get electrocuted). I'd pay for that assurance. By assurance, not that I get a payout, but rather the company has sufficient QA to avoid a payout."}, {"id": "17328240", "author": "kylecordes", "year": 2018, "thread": "Amazon Is Complicit in Online Sales of Counterfeit Goods: Report", "text": "I've been an Amazon customer since 1998, and this problem has shifted my buying away from Amazon, for categories where counterfeiting seems likely.\n\nIf they offered an option to simply never see any items with that (idiotic) co-mingled counterfeit-prone inventory management scheme, I'd happily pay a bit more to get things which I am confident went directly from the real manufacture, to Amazon, to me. Which of course is exactly what I do... by not shopping for such items at Amazon.\n\nTruly the whole thing makes me wonder what kind of thinking could be going on. They have an amazing juggernaut of success going, all they have to do is not screw it up by doing anything especially stupid. Like thi"}, {"id": "35377565", "author": "kansface", "year": 2023, "thread": "There's something off about LED bulbs", "text": "Yeah, I'm back to wanting a curated shopping experience.  I don't want the cheapest thing.  I don't want multiple options- thats worse than nothing.  I don't want to worry about counterfeits or knockoffs.  I don't want to do research, consult the relevant /r and then look through comment history to see who is paid to say what.  I want a store to have an opinion and stock high quality stuff.  I would happily pay a premium to offload decision making."}], "key": "i16-Genuine Check"}, {"name": "Parent Mode", "one_liner": "Remote management for elderly parents' phones and computers: lock the home screen, block junk apps, approve updates, and get one-tap help from family.", "problem": "Adult children do tech support for elderly parents. Updates and junk apps confuse them, remote help is hard to set up, and simple phones lack the features they need, such as photo dialing and ride booking.", "customer": "Adult children (35-60) managing one or two parents' devices.", "evidence": "One of the highest-pain clusters (avg 4.25/5) across several adjacent comments. Commenters say they would pay good money for a phone with photo dialing and one-tap rides, and that walking a parent through things over the phone tests 'supernatural patience'.", "solution": "An Android launcher plus an MDM-lite profile and a family web console. It provides photo-contact dialing, blocks app installs, delays and approves updates, offers remote screen view with consent, and adds one-tap ride and call-family buttons.", "mvp": "An Android launcher with photo dialing, an install lock and remote view via a family console, $8 a month.", "business_model": "Per-family subscription, plus retail bundles with refurbished phones.", "alternatives": "GrandPad (tablets, expensive), Jitterbug and Lively (basic phones), Android's built-in simplified modes. Commenters say none combine family remote control with modern apps.", "why_now": "An aging population that already owns smartphones, the rise of scams targeting seniors, and mature remote-support APIs.", "risks": "iOS restrictions limit it to Android. Support load. Parents resist being 'managed'.", "verdict_score": 6, "cluster": "parents, elderly parents, elderly, adult children", "category": "consumer & home", "signal_score": 16.2, "authors": 6, "years": [2018, 2019, 2022, 2023, 2026], "pay_signals": 4.0, "avg_intensity": 4.0, "mentions": 6, "quotes": [{"id": "33316669", "author": "Sverigevader", "year": 2022, "thread": "I help seniors with technology issues", "text": "I'd like to weigh in here as well.\n\nMy father uses a Windows 10 laptop, and a Samsung Android phone.\n\nThe biggest pain point is that Windows sometimes decides to do an update, and upon restart, shows a splash screen with a wizard which wants you to make decisions and read/understand a few things. He has no idea what going on or if something will break, or if he actually did something wrong. I solve this via WhatsApp video calls \"quickly\", and then have to explain to him for 5-10 minutes how it's not his fault.\n\nWhen it comes to the phone, all he essentially uses it for is YouTube and WhatsApp. When I visited a while back an OTA update had showed up and I promptly started to install it. While"}, {"id": "35413168", "author": "jsolomon", "year": 2023, "thread": "Ask HN: How do I keep my elderly father safe on the internet?", "text": "What a great question and rich topic. Thanks for asking. I'm in the same boat with mom. She lives alone and is a very high trust person so she picks up every phone call and reads every email with uncritical optimism. I'm horrified every time I see what new apps she has installed and truly have no idea where she finds them - \"It just popped up!\"\n\nI've done a ton of things here but the latest that has actually given me some piece of mind is setting up a financial aggregator app with all her accounts + some basic notification rules for withdrawals >$X connected to my email. Obviously this requires a lot of trust from your parent, a lot of trust in Plaid (which I hate and worry about), and doesn"}, {"id": "50019407", "author": "lbreakjai", "year": 2026, "thread": "Show HN: Let your AI agents paint big arrows, boxes and text on your screen", "text": "I would pay good money for something like this on iPad. It wouldn't even need to be agent-driven, just a big \"I want to make a bank transfer\" button, that would launch the correct app and guide through the interface.\n\nThat would be a godsent for those of us with aging parents."}], "key": "i17-Parent Mode"}, {"name": "Open Source Tab", "one_liner": "One bill that funds every open-source dependency your company or you rely on, structured so procurement departments can approve it.", "problem": "Users and companies want to fund the open-source software they depend on, but internal procurement makes small payments to individual maintainers impossible, and individuals won't manage dozens of tiny donations.", "customer": "Engineering managers at companies with 50-5,000 developers, and individual developers.", "evidence": "9 commenters, including a detailed story of a company that lost a critical build tool because its manager couldn't get approval to pay the maintainer.", "solution": "Scan lockfiles to build a dependency graph, set a monthly budget, and generate one vendor invoice with an SLA-style contract. Payments go out to maintainers by usage weight.", "mvp": "A GitHub app that reads the org's lockfiles, sends one invoice per month, and pays out via GitHub Sponsors and Open Collective.", "business_model": "5-10% of the funds that pass through, plus a paid 'maintainer SLA' tier for critical packages.", "alternatives": "thanks.dev, GitHub Sponsors, Open Collective, Tidelift (enterprise), StackAid (shut down). Commenters cite friction and procurement as the blockers.", "why_now": "Supply-chain attacks (the xz backdoor) and EU Cyber Resilience Act obligations push companies to formalise support for their dependencies.", "risks": "Tidelift and thanks.dev already exist. Budgets get cut in downturns. Maintainers may not be able to meet SLA expectations.", "verdict_score": 5, "cluster": "open source, source, open, fund", "category": "developer tools", "signal_score": 17.81, "authors": 8, "years": [2021, 2022, 2023, 2024, 2025], "pay_signals": 7.0, "avg_intensity": 2.88, "mentions": 8, "quotes": [{"id": "42672291", "author": "Nezghul", "year": 2025, "thread": "Stop Trying to Schedule a Call with Me", "text": "Would never happen. I was working for a company which for C++ projects used open source CMake package manager called Hunter. Thousands of packages (ours and third-party) for multiple platforms were causing building and linking problems constantly. Literally every day devops would waste hours on those issues. Many of the problems come from our not-understanding of the build processes and some were Hunter bugs so we were happy to jump to every new release. And one day the Hunter maintainer make announcement that he will abandon the project if someone would not help him financially. I pointed this out to my manager. He said that it's very unfortunate but he would need to talk to his manager who"}, {"id": "45766973", "author": "Splizard", "year": 2025, "thread": "Free software scares normal people", "text": "If only there was an easy way to fund all the Open Source programs you like and use, so the projects who struggle with it, can put more focus into design.\n\nSeems like a win-win, take my money solution, for some reason the market (and I guess that means investors)
