5563661", "author": "tomatocracy", "year": 2020, "thread": "Ask HN: What are you surprised isn’t being worked on more?", "text": "Single subscription payment for news along the lines of the Spotify model. I'd happily pay a single subscription which gave me access to ALL the news websites, and divided payment up based on which articles people click on. Do that without tracking me between the different sites and I'm sold.\n\nPressreader gets close but it only gives you yesterday's print versions (not current online content), it has a few notable gaps which matter to me (the FT, The Times (of London), Bloomberg news among others) and it doesn't really collate different sources for the same story very well. Though I have to say it's great for magazines."}, {"id": "49258905", "author": "JohnFen", "year": 2026, "thread": "Why won't some people pay for news? (2022)", "text": "I'd happily pay for news if there were a way to do it without feeding the data collection machine. Physical newspapers have been effectively killed. Physical magazines have been effectively killed.\n\nThat means the only way to pay for news is to pay for an online service. But that means that my news-reading (and other habits) are being tracked. As long as that's the case, I'm out."}, {"id": "48402595", "author": "lostlogin", "year": 2026, "thread": "The desperation of NYTimes", "text": "> like what do you expect them to do?\n\nTake my money, show me content. No adverts. No spam. Let me unsubscribe if I want to."}], "key": "i36-News subscribers want ad"}, {"name": "Users want cheap private search subscriptions paid through privacy-preserving payment methods", "one_liner": "Draft: cluster not yet reviewed. Keywords: privacy, search, privacy search, tiers, respecting, privacy respecting", "draft": true, "verdict_score": null, "cluster": "privacy, search, privacy search, tiers", "category": "security & privacy", "signal_score": 22.7, "authors": 15, "years": [2015, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 14.5, "avg_intensity": 2.6, "mentions": 15, "problem": "Users would pay for privacy-respecting Google services with no tracking or email scanning; Privacy-minded users want one curated privacy pass that funds many privacy services and reroutes money from bad actors; Users want cheap private search subscriptions paid through privacy-preserving payment methods; Users want paid service tiers with legally enforceable privacy guarantees and data minimization; Users would pay for a privacy-respecting video platform not tied to Google; Users would pay a privacy-first search engine for an LLM summary layer", "quotes": [{"id": "25065736", "author": "mastazi", "year": 2020, "thread": "Google Photos will end its free unlimited storage in June 2021", "text": "I am what you would describe as a “privacy conscious person” so over time I’ve been moving out of Google products.\n\nInstead of making me pay for additional storage [1], I wish I could pay for the ability to use all of Google’s products with increased privacy (no tracking, no reading my emails, ability to turn off YouTube recommendations etc.). I would pay for that because the products themselves are great.\n\n[1] https://one.google.com/about"}, {"id": "49393407", "author": "__MatrixMan__", "year": 2026, "thread": "Kagi added a setting for removing paywalled links from search results", "text": "I wish there was some kind of EFF-curated \"privacy/internet freedom\" pass that I could buy.\n\nKagi is great, but it's not everything.  Brave is great, but it's not everything.  Signal, GrapheneOS, Tor... this is a battle with many fronts and it's kind of labor intensive to manage a whole bunch of subscriptions/recurring donations.\n\nI'd love to just buy the pass and rest assured that if one of the recipients of that money starts behaving badly, the curator is going to reroute money from them, to whatever the better-behaved alternative is.\n\nThe curator (doesn't have to be the EFF, they're just the first to come to mind) can host a https://datatracker.ietf.org/wg/privacypass/about/ token faucet "}, {"id": "49388579", "author": "Cider9986", "year": 2026, "thread": "Kagi added a setting for removing paywalled links from search results", "text": "I would pay for Brave or Kagi for like $2-3 per month if one of them supported private payments(actually that's exactly what Brave costs).\n\nPaying should get you more privacy not less.\n\nI'm not paying for Kagi because it's expensive and also doesn't support private payments and Brave has better UI for me.\n\nBrave blocks their own ads while not supporting private payments and it doesn't let you use the search premium in Vanadium, it seems, which makes me question whether my subscription would work cross device. Maybe it would but only in Brave browser.\n\n>Support private, independent search\n\n>See search results ad-free\n\n>Get a cleaner view on all results pages\n\n>Cancel any time\n\nBrave should al"}, {"id": "46265242", "author": "Jaygles", "year": 2025, "thread": "Europeans' health data sold to US firm run by ex-Israeli spies", "text": "If services offered a paid version that guaranteed privacy, such that I stay anonymous and only data points that are strictly necessary to provide the service are persisted in the company's servers, I would happily pay.\n\nAnd I mean guaranteed in a way that I would have legal recourse against the company if they go back on their word or screw up"}], "key": "i37-Users want cheap private"}, {"name": "Rust developers find building async actors a huge pain in existing frameworks", "one_liner": "Draft: cluster not yet reviewed. Keywords: rust, async, rust developers, developers, library, libraries", "draft": true, "verdict_score": null, "cluster": "rust, async, rust developers, developers", "category": "developer tools", "signal_score": 22.07, "authors": 19, "years": [2017, 2019, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 8.5, "avg_intensity": 2.58, "mentions": 19, "problem": "Large Rust codebases suffer from slow compile times; Large Rust codebases suffer from slow compile times; Rust software that builds on stable distro compilers without needing the latest rustc.; Embedded teams lack vendor libraries and tooling for Rust beyond a few hobby chips; Rust game developers lack a UI framework for the Bevy ECS that supports reusable widgets and text input; Rust developers lack a mature GUI library", "quotes": [{"id": "44398097", "author": "rtfeldman", "year": 2025, "thread": "Why is the Rust compiler so slow?", "text": "> Given Rust's numerous benefits, is having subpar compilation time really that big of a deal?\n\nAs someone who uses Rust as a daily driver at work at zed.dev (about 600K LoC of Rust), and Zig outside of work on roc-lang.org (which was about 300K LoC of Rust before we decided to rewrite it in Zig, in significant part because of Rust's compilation speed), yes - it is an absolutely huge deal.\n\nI like a lot of things about Rust, but its build times are my biggest pain point."}, {"id": "42938495", "author": "gregwebs", "year": 2025, "thread": "Roc rewrites the compiler in Zig", "text": "Go was built while waiting for C++ to compile- fast compilation was an implicit design goal.\n\nRust on the other hand didn’t prioritize compile times and ended up making design decisions that make faster compilation difficult to achieve. To me it’s the biggest pain point with Rust for a large code base and that seems to be the sentiment here as well."}, {"id": "45782067", "author": "superkuh", "year": 2025, "thread": "Hard Rust requirements from May onward", "text": "Rust is a great language for devs. They love it and how developer centric everything about it is.\n\nBut for end users on Debian trying to compile rust stuff is a nightmare. They do breaking changes in the compiler (rustc) every 3 months. This is not a joke or exaggeration. It's entirely inappropriate to use such a rapidly changing language in anything that matters because users on a non-rolling distro, LIKE DEBIAN, will NOT be able to compile software written for it's constantly moving bleeding edge.\n\nThis is an anti-user move to ease developer experience. Very par for the course for modern software."}, {"id": "41835579", "author": "myrmidon", "year": 2024, "thread": "Embedded Rust in Production?", "text": "A very important point that the article neglects is that for a lot of embedded platforms, you have to heavily rely on the hardware manufacturers libraries and tooling. All of that stuff is typically gonna be targeted at C.\n\nWithout this, using even very simple hardware interfaces (like an SPI/I2C bus) is gonna be a huge pain, because you'll have to comb through reference manuals and register descriptions for your processor and piece everything together yourself instead of just calling a few API functions (this is also very error-prone and using Rust is not really gonna help one bit).\n\nThe only chance to get even halfway decent rust integration is to pick one of the like 3 most popular hardwa"}], "key": "i38-Rust developers find bui"}, {"name": "Users would pay for an ad-free Google search", "one_liner": "Draft: cluster not yet reviewed. Keywords: ad, search, google, google search, ad google, versions", "draft": true, "verdict_score": null, "cluster": "ad, search, google, google search", "category": "consumer & home", "signal_score": 21.01, "authors": 15, "years": [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 15.0, "avg_intensity": 2.67, "mentions": 15, "problem": "Users happily pay about $108 a year for ad-free search; Users would pay for ad-free, no-tracking search that de-ranks ad-focused content; Users would pay for an ad-free premium Google subscription; Users would pay for a premium tier that removes clutter and ads across all Google products including Maps; Users would pay for an ad-free Google premium across services; Users would pay for a privacy-first premium that strips ads across the internet", "quotes": [{"id": "38567003", "author": "gregdoesit", "year": 2023, "thread": "Kagi Search – Paywalled articles indicator and improved weather widget", "text": "I've been using Kagi as my default search engine for about 2 months now. I love it, and feel so far that it's well worth the $108 per year: just by not having to spend mental energy to scroll through the first several sponsored results; and try and decide if a result is paid or not.\n\nI set Kagi to be my default search in my browser (Chrome). For specific searches like stocks, maps or restaurant reviews, I still use the \"!g\" bang to go to Google.\n\nNever thought I'd pay for search: but very happy with my choice so far. Great to see others agree on this page - as I hope they can maintain this as a viable business, and stick to the principles of users being their customers: and not advertisers.\n"}, {"id": "35079013", "author": "monero-xmr", "year": 2023, "thread": "Update to Kagi Search Pricing", "text": "The proper way to charge for search is free with ads with an optional premium model that promises not to data mine you or show ads. I would pay for Google search if they removed all the ads, and as a bonus aggressively de-ranked content that was primarily focused on ads rather than useful information.\n\nThere will be a company that dethrones Google in search, but it might take some time"}, {"id": "31380138", "author": "magusd", "year": 2022, "thread": "Ask HN: Why is Google Premium not a thing?", "text": "I'd pay for google premium, but since that's not offered I use ad blockers. Just like I used to torrent before streaming services came up."}, {"id": "31376916", "author": "bluenose69", "year": 2022, "thread": "Ask HN: Why is Google Premium not a thing?", "text": "I'd pay for this, if it also applied to other google products.  In particular, google maps has become unpleasant to use lately, with a lot of extra stuff drawn on top of the actual map. I've switched to apple maps, for this reason.  I wonder how ndling conflicts.  Target on the left, source on the right, and the combined result in the middle.\n\n...I really just like the way the Jetbrains IDEs do it, and I wish there were a TUI version that I could launch automatically from the git cli."}], "key": "i41-A git-backed documentati"}, {"name": "Linux users would pay for open-source apps", "one_liner": "Draft: cluster not yet reviewed. Keywords: linux, linux native, software, windows, source, native", "draft": true, "verdict_score": null, "cluster": "linux, linux native, software, windows", "category": "productivity & work", "signal_score": 20.14, "authors": 13, "years": [2018, 2019, 2020, 2021, 2023, 2024, 2025, 2026], "pay_signals": 13.0, "avg_intensity": 2.46, "mentions": 13, "problem": "Linux users would pay for a stable offline office suite to replace buggy LibreOffice; Linux users would pay for official, good Windows app support on Linux; Linux users would pay for a native Excel; Linux users would pay for an office suite that works well; Linux users would pay for a native Linux version of professional OCR software; Users would pay for a Microsoft-made Linux distro instead of Windows", "quotes": [{"id": "39936891", "author": "sega_sai", "year": 2024, "thread": "German state ditches Microsoft for Linux and LibreOffice", "text": "I have been using Libreoffice/OpenOffice continuously pretty much for last 20 years (mostly Impress/presentation part for teaching/presentations). And the number of bugs, crashes, issues with video  etc occasionally gets very annoying. I was hoping over the years things would improve, but I don't quite see that unfortunately. If I could get something to replace LibreOffice that is not online and works on Linux I would pay for it."}, {"id": "47446394", "author": "TobTobXX", "year": 2026, "thread": "An update on Steam / GOG changes for OpenTTD", "text": "Well IF Microsoft would also collaborate with Wine...\n\nI think I'd pay for a Windows License if it means I get official support for  you pay only for the content you want, with good curation.; Users would pay 2-3x for streaming content without DRM, ads, dark patterns and regional restrictions; Users would pay for a legal Plex-like service to buy and stream owned media; Viewers would pay for a streaming UX as clean as auto-downloaded torrents", "quotes": [{"id": "45614756", "author": "pmx", "year": 2025, "thread": "How I bypassed Amazon's Kindle web DRM", "text": "It isn't about the price. The level of service and the quality of the product you get by pirating is simply better. Streaming services break up shows and have s1-3 on one platform, 4-5 on another, and the rest on another still. You'll \"buy\" a movie on amazon prime video only for them to remove it so you can't watch it anymore. Prime video, a service you have to pay for now has ad breaks while watching shows. Even just FINDING stuff to watch is a nightmare, Netflix is the same stuff over and over again in different random made up categories."}, {"id": "30922035", "author": "joshstrange", "year": 2022, "thread": "Plex launches feature to discover content across streaming services", "text": "100% this. I pay for all the streaming services and I would happily pay for shows/movies on a per-title basis but getting a DRM free version (or sometimes even a high quality version, some stuff doesn't get released on Blu-ray) is like pulling teeth. I've said more times than I can count \"I'd pay 200+/mo for a fully legal version of Plex\" (in this case referencing a platform that had all my shows, one UI/UX, ability to watch offline/cache locally, etc), it just doesn't exist."}, {"id": "29285413", "author": "imiric", "year": 2021, "thread": "It's hard to say who's winning the streaming wars, but customers are losing", "text": "> If the streaming wars do too much damage to consumers, they'll just flip the playing board and go back to piracy.\n\nI think that's already happening among the tech literate. The difference now is that the majority of consumers are not technically inclined and don't mind paying for several streaming services to get easy access to their favorite content, so the industry generally doesn't care about losing a small fraction to piracy.\n\nPirating content is now more technically difficult than paying for a service, but the benefits are still there: DRM-free content that can be consumed on any device, accessed offline, safe against removal, licensing issues, region locks, easily shareable, etc.\n\nPa"}, {"id": "19114457", "author": "bicubic", "year": 2019, "thread": "Spotify will now suspend or terminate accounts it finds are using ad blockers", "text": "Between the dwindling Netflix catalog and increasingly hostile subscription service experience on Spotify, I have found myself flying the black flag again. I still have subscriptions to both, but I will be cancelling them this year. I don't want their shitty analytics payloads, I don't want their shitty anti-adblocker tech. I don't want their shitty tactics of deleting random songs off my playlists. I just want the content I paid for.\n\nIt's not because I don't want to pay for the content, I'd happily pay 2-3x under the right circumstances. It's because no one wants to take my money and provide the content I want without bundling it with drm, ads, dark patterns, insane region segmentation, an"}], "key": "i43-Streaming that lets you "}, {"name": "Non-programmers want a WYSIWYG document-spreadsheet hybrid with easy tables and column formulas", "one_liner": "Draft: cluster not yet reviewed. Keywords: spreadsheet, testing, excel, source control, database, style", "draft": true, "verdict_score": null, "cluster": "spreadsheet, testing, excel, source control", "category": "productivity & work", "signal_score": 19.54, "authors": 11, "years": [2020, 2021, 2023, 2024, 2025, 2026], "pay_signals": 6.0, "avg_intensity": 3.27, "mentions": 11, "problem": "A spreadsheet front end backed by a real database, usable without database training.; A bridge tool ivacy, but I don’t need it that badly.  If it had a chat history, I would pay for it to be honest.\n\nThe problem with Signal and Proton is they sacrifice usability for over the top security.  I don’t want to use Google or Zuckerberg products that are using you to sell ads, but I don’t want terrible usability either."}, {"id": "38292124", "author": "ruffrey", "year": 2023, "thread": "Privacy is priceless, but Signal is expensive", "text": "I would pay for a few signal features:\n1. encrypted backups or backup integration of my chats, photos and videos.\n2. business features (backup, directory integration, search)\n\nI have not used:\n1. voice and video\n\nIncredible that SMS costs so much. I wonder if it's worth it because it _saves_ so much in spam and other sorts of fraud or bad behavior?"}], "key": "i48-Users would pay for a pa"}, {"name": "Developers would pay for an open-source, much faster TypeScript type checker", "one_liner": "Draft: cluster not yet reviewed. Keywords: typescript, type, types, typescript type, definitions, faster", "draft": true, "verdict_score": null, "cluster": "typescript, type, types, typescript type", "category": "developer tools", "signal_score": 18.98, "authors": 15, "years": [2021, 2022, 2023, 2025], "pay_signals": 5.5, "avg_intensity": 2.8, "mentions": 15, "problem": "TypeScript developers find slow type checking the biggest pain in their daily cycle; TypeScript type checking is so slow in large monorepos that developers would pay for a much faster checker with upstream parity; TypeScript tool builders would pay for a 100x faster parser and compiler with full AST access; Developers would pay for an open-source, much faster TypeScript type checker; TypeScript library authors want reliable auto-generated docs like docs.rs; An IDE-like TypeScript starter pack that runs Node, TypeScript and ESM without configuration breakage.", "quotes": [{"id": "43340784", "author": "Timon3", "year": 2025, "thread": "A 10x Faster TypeScript", "text": " ckboxes bes"}, {"id": "29748942", "author": "raffraffraff", "year": 2021, "thread": "Music Library and MusicBrainz Picard", "text": "I would pay for a music metadata service that stored tags, ratings and playlists. It wouldn't even have to provide music streaming at all, as long as it could integrate with YouTube, Spotify, Apple, Dropbox or local files. Something that treated a playlist with the same respect as an album, capturing creation date, comments, tags, author.\n\nIf I lost my whole music collection tomorrow, I could recover the actual tracks from Bandcamp/7Digital/rip etc. But my custom tags and ratings that I use to generate playlists, and the history of saved playlists found back over 15 years, would be impossible to recover."}, {"id": "28354512", "author": "stavros", "year": 2021, "thread": "Music Composition with Deep Learning: A Review", "text": "I don't know, I'd pay for something that gave me music I loved, 100% of the time (or, hell, even 2% of the time). Beats sifting through the infinite trove of music just so I can stumble upon something I like by chance. My success rate there is more like 0.1%."}], "key": "i52-Listeners would pay for "}, {"name": "Simple cross-distro packaging of Linux apps without static linking and sandbox headaches.", "one_liner": "Draft: cluster not yet reviewed. Keywords: linux, packaging, cross, package, package manager, cross distro", "draft": true, "verdict_score": null, "cluster": "linux, packaging, cross, package", "category": "developer tools", "signal_score": 18.78, "authors": 12, "years": [2018, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 4.0, "avg_intensity": 3.08, "mentions": 12, "problem": "Simple cross-distro packaging of Linux apps without static linking and sandbox headaches.; A single simple way to build and distribute GUI apps across Linux distros.; Developers want reproducible dev environments that work with existing tools and package managers instead of all-or-nothing Nix; Developers want a simple evelopment environment, where anyone at my company could easily get set up to work on our code with a single (or concise set of) action(s). I also tried to use home-manager, which I have heard might have been a mistake.\n\nAnyway, Nix is really only designed to manage the entire world. I wasn’t able to use Nix to build a development environment where other developers and I could work in"}, {"id": "47706561", "author": "bikelang", "year": 2026, "thread": "Show HN: I built a Cargo-like build tool for C/C++", "text": "I don’t love this approach either (what a security nightmare…) - but it is easy to do for users and developers alike. Having to juggle a bunch of apt-like repositories for different distros is a huge time sink and adds a bunch of build complexity. Brew is annoying with its formulae vs tap vs cask vs cellar - and the associated ruby scripting… And then there’s windows - ugh.\n\nI wish there was a dead simple installer TUI that had a common API specification so that you could host your installer spec on your.domain.com/install.json - point this TUI at it and it would understand the fine grained permissions required, handle required binary signature validation, manifest/sbom validation, give the "}], "key": "i53-Simple cross-distro pack"}, {"name": "Viewers would pay for shows that are not released in their region", "one_liner": "Draft: cluster not yet reviewed. Keywords: viewers, region, legally, shows, streaming, access", "draft": true, "verdict_score": null, "cluster": "viewers, region, legally, shows", "category": "media & content", "signal_score": 18.56, "authors": 9, "years": [2012, 2018, 2019, 2020, 2021, 2022, 2025, 2026], "pay_signals": 9.0, "avg_intensity": 3.0, "mentions": 9, "problem": "International viewers would pay for legal fast access to US shows instead of torrents; Viewers would pay for films that are not available legally anywhere; Subscribers abroad would only keep streaming services if they could access the full catalog of other regions atures until this - the biggest pain point for Python across all expertise levels from newbies to experienced Python programmers - is officially solved. No pipenv, no poetry, no conda, etc from third party devs who sometimes get tired of the pressure [1]. It is immense. Combine all this virtualenv stuff with great dependency management into one tool. In the spirit of Python, there should be only one way to package, manage dependencies and virtual environments. It should be super clean (see Go).\n\nPython needs a BDFL to enforce the hive mind. It is a fucking mess and it's unacceptable."}, {"id": "50249767", "author": "brcmthrowaway", "year": 2026, "thread": "Type Server Protocol", "text": "The packaging is a nightmare thats for sure.\n\nVenvs, activate, deactivate, shitty scripts hacking on $PATH. How did this ever ship? Then there was poetry, `uv`, and maybe something in else in $CURRENT_YEAR.\n\nTry to set it up on a new macOS, go on. Install a package from pip, and there's a bunch of garbage that won't let you do it.\n\nIt's horrible. Python packaging engineer is now an FTE, maybe that's what they wanted."}, {"id": "44895007", "author": "jsmeaton", "year": 2025, "thread": "PYX: The next step in Python packaging", "text": "Astral folks that are around - there seems to be a bit of confusion in the product page that the blog post makes a little more clear.\n\n> The next step in Python packaging\n\nThe headline is the confusing bit I think - \"oh no, another tool already?\"\n\nIMO you should lean into stating this is going to be a paid product (answering how you plan to make money and become sustainable), and highlight that this will help solve private packaging problems.\n\nI'm excited by this announcement by the way. Setting up scalable private python registries is a huge pain. Looking forward to it!"}, {"id": "41236409", "author": "ryanjshaw", "year": 2024, "thread": "Go is my hammer, and everything is a nail", "text": "I started using Dagster a few days ago, which runs on Python.\n\nAs far as I can tell, I have to install the packages with pip. Wait - don't forget venv first. Oh but I'm not supposed to commit the venv, so how is anybody to know what I did? Okay I have to setup a requirements.txt... but now what did I install in the venv? Okay there's a way to dump the venv.. but it's giving me all the dependencies, not the root package I installed?!\n\nOkay there's something called pipenv that seems smart... Oh wait no this Dagster has a pyproject.toml, maybe I should use poetry? Wait poetry doesn't work, it seems like I'm supposed to use setup.py... so what's the point of pyproject.toml.\n\nOkay I put the packa"}], "key": "i55-ML hobbyists face messy,"}, {"name": "Music producers want AI in their DAW that generates variations and transitions from short ideas", "one_liner": "Draft: cluster not yet reviewed. Keywords: music, ai, musicians ai, musicians, unfinished, generates", "draft": true, "verdict_score": null, "cluster": "music, ai, musicians ai, musicians", "category": "media & content", "signal_score": 18.3, "authors": 10, "years": [2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 6.0, "avg_intensity": 2.5, "mentions": 10, "problem": "An AI tool that arranges unfinished loops into full song sections inside FL Studio.; Musicians want AI trained on their own unfinished project files to generate new material; Musicians would pay for AI tab, chord and lyric extraction with licensed output; Music producers want controllable AI sample generation whose parameters can be fine-tuned after generation; Musicians would pay for AI that generates harmonies they can reuse; Music producers want AI in their DAW that generates variations and transitions from short ideas", "quotes": [{"id": "48006718", "author": "tim-projects", "year": 2026, "thread": "Show HN: Ableton Live MCP", "text": "I wish there was something like this for flstudio.\n\nI've got 25 years of loops that basically to finish them need better arrangements. Using AI to ting my projects in VPS / bare metal for years now, using tools like portainer, easypanel, coolify, etc but there was still a lot of work to setup and maintain those. So, out of my own need, I decided to build Grua.\n\nThe PaaS is meant to feel like you're using off-shelf products from a big cloud provider (buckets, streams, database, etc) in the sense that it's easy to setup and to use without having to manage servers / containers / scripts.\n\nFor example, my biggest pain point was deploying postgres with Point-in-Time Recovery which now, in Grua, it's pretty much a one-click deployment.\n\nThere's still a lot to improve there, so feedback is much appreciated. If you wanna try "}, {"id": "47749765", "author": "bgdam", "year": 2026, "thread": "Ask HN: What Are You Working On? (April 2026)", "text": "I have come to believe that in the near future, software development is going to become a common skill, like driving. I myself have been vibe coding so many tiny apps/scripts/cron jobs that resolve tiny inconveniences in my life and the biggest pain point for me right now is making these available to my multiple devices over the internet.\n\nTo resolve this, I am currently fleshing out the idea for a \"shared hosting\" for vibe coded programs - something like a cross between an old school LAMP stack shared host and a parse like library for capabilities like push notifications.\n\nIt's all very half baked in my head at the moment - with the biggest problem being a safe way to deploy remote code wit"}, {"id": "45652730", "author": "crossroadsguy", "year": 2025, "thread": "What I Self Host", "text": "Something pikapods looked neat at first then soon I realised the costs add up and add up a lot. One day I was calculating it at pikapods at I realised I had crossed 27 USD/m and I wasn't even finished. Like those streaming services - everything on a new streaming service i.e a new pod and they cost separately. I wish there was a service which would take away the pain of installation and maintenance away from me but let me host a lot of absolutely single user (i.e. only I'd access that of course) and as light weight as it can get and as low in usage at it gets on one single \"pod\" or \"instance\" or \"box\" and charge for that. Also, it's not a pikapods or pikapods' problem, it's a general problem"}, {"id": "41587435", "author": "crossroadsguy", "year": 2024, "thread": "Gentle Guide to Self-Hosting", "text": "I loved the idea of PikaPods until I realised even if I use 10 small (no tiny) instances/services and that too just for me to be used really really rarely) I was getting into integral USD x 11 (or whatever the number is) cost. Can't blame them because it costs money to run things. But I would have rather preferred something that isn't that costly or doesn't go up in prices with number of services/apps used. I wish there was a cost effective solution for this self/web/app hosting."}], "key": "i58-Cheap hosting for many t"}, {"name": "Readers want a personal front-end that aggregates blogs and news", "one_liner": "Draft: cluster not yet reviewed. Keywords: readers, news, blog, aggregates, blogs, view", "draft": true, "verdict_score": null, "cluster": "readers, news, blog, aggregates", "category": "media & content", "signal_score": 18.0, "authors": 10, "years": [2019, 2020, 2022, 2023, 2024, 2026], "pay_signals": 6.0, "avg_intensity": 2.7, "mentions": 10, "problem": "A service that aggregates local events from papers, businesses and social feeds into one filterable view.; Readers want a hierarchical news digest by period, region and domain with quality sources across the spectrum; People want curated local news and event listings aggregated in digital feeds; Readers want article summarization services with a broad catalog and adequately detailed summaries; Readers want a service that summarizes long-form articles down to their key insight; Readers want a blog platform with quality recommendations and search with time filtering", "quotes": [{"id": "41296643", "author": "solardev", "year": 2024, "thread": "Ask HN: What is a simple paid app / webapp that you wish existed?", "text": "Just one random pain point for me: I often wish there was an easy way to find local events both in the city where I live and when I travel. Usually I have to try to find a local paper or two and then see if they have an event calendar, but it's not always successful, then it's also a matter of checking the visitor's center, chamber of commerce, etc. And of course there's social media, and lots of local businesses only post their events on their own feeds and not even their websites anymore :(\n\nI wish there was a service that could scrap all these local papers and such and present a simple events view, with good filtering, that also point back to the original sources. I'd be happy to pay $5-$"}, {"id": "23987926", "author": "the_duke", "year": 2020, "thread": "TheirTube – How do the recommended videos look on their Youtube home page?", "text": "With all our media resources and technology, it's crazy that there is no easy way to answer questions like \"what happened politically in France in the last month?\",  \"what were the economic developments in Africa in the last quarter?\" or \"what were the biggest battery technology advances in the last year?\".\n\nWith the barrage of news it is very easy to miss a lot, especially if you want to keep up with multiple domains and geographical regions.\n\nI would love some  hierarchical listing  that shows the most important news items for different time periods (week,  month, quarter, year), and filterable by domain (eg business, economy, politics, science, technology, ...).\n\nOne should be able to  co"}, {"id": "41964788", "author": "jll29", "year": 2024, "thread": "Inside the Transport for London cyberattack", "text": "Are people really no longer interested in what happens locally?\n\nI would pay for local news, even about places that I no longer live, but used to live and still have a passing interest in. But perhaps I would want to receive it as XML feed.\n\nEven events (concerts, readings, exhibitions, screenings etc.) are typically scattered across many smaller lists or mailing lists, depending on location. For example, there is way more going on in London than what is listed by Time Out:\nhttps://www.timeout.com/london/things-to-do/london-events-in...\nLocal communities may have their own sites or still rely on paper flyers.\n\nSome facts of communal interest are published in government outlets that are still"}, {"id": "33870704", "author": "jamager", "year": 2022, "thread": "Show HN: Chrome extension to summarize blogs and articles using ChatGPT", "text": "Yes there are a number of services, and I would happily pay for them.\nBut either they have a very small catalog, or their summaries are too short, or both."}], "key": "i59-Readers want a personal "}, {"name": "Readers would pay a premium for DRM-free ebooks", "one_liner": "Draft: cluster not yet reviewed. Keywords: readers, ebook, drm, books, ebooks, authors", "draft": true, "verdict_score": null, "cluster": "readers, ebook, drm, books", "category": "media & content", "signal_score": 17.85, "authors": 9, "years": [2010, 2011, 2012, 2022, 2023, 2025, 2026], "pay_signals": 10.0, "avg_intensity": 2.4, "mentions": 10, "problem": "Self-published authors would pay to convert manuscripts into both epub and print-ready trade PDFs; E-reader owners would pay for books if available as DRM-free ePubs; Readers would pay authors directly for cheap DRM-free PDFs instead of expensive locked ebooks; Self-published authors would happily pay for easy ebook and print-ready conversion; Readers would pay a premium for DRM-free ebooks; Readers would pay for reader-friendly formatted editions of free public domain great books", "quotes": [{"id": "3427141", "author": "halostatue", "year": 2012, "thread": "E-books Are Not That Easy", "text": "I'm sending you a note via email, but…how close to print-ready are the PDFs that are generated? My wife has been working on a novel (and 90%) of a sequel that we're getting ready to self-publish through Lulu and KDP and I'm tired from the formatting hoops.\n\nWe're using Ulysses (similar to Scrivener) and exporting to Word and importing to Pages (because the epub export was somewhat disappointing compared to the Pages epub export, and Pages layout tools are more powerful than Word's) because we need both epub and 6\"x9\" (US trade) print-ready PDF. She's got a cover and a back cover. She wants to have both ebook and hardcopy, and you guys don't offer hardcopy.\n\nI don't have the time to write the"}, {"id": "46327987", "author": "misterbishop", "year": 2025, "thread": "Amazon will allow ePub and PDF downloads for DRM-free eBooks", "text": "I love my Libra 2 reader, but I only use it to read epub files from questionable websites. I would pay for books if they were available as DRM-free epubs."}, {"id": "37531446", "author": "musicale", "year": 2023, "thread": "“Most notorious” illegal shadow library (LibGen) sued by textbook publishers", "text": "Pretty much this. I'd happily pay the author $7 for a PDF rather than $70 for a DRM-encumbered Kindle ebook (or $31 to \"rent\" it for a term.)"}, {"id": "3488533", "author": "halostatue", "year": 2012, "thread": "The Audacity of the iBooks Author EULA", "text": "iBooks 2 format is more or less ePub3, as I understand it. I could understand it incorrectly.\n\nI can also speak fairly highly of the leanpub team's process. My wife and I are finding it less than perfect for our needs in producing a fiction book with both ebook and print-ready book needs, but appreciate the directness and promptness with which both Scott & Peter have been responding to us when we are raising issues with what we're seeing.\n\nBetter yet, their conversion is free with no commitment to sell your book on leanpub required. I'd happily pay for what they're providing for free because it's so damned easy."}], "key": "i60-Readers would pay a prem"}, {"name": "Python developers struggle with environments and version compatibility on rarely touched projects", "one_liner": "Draft: cluster not yet reviewed. Keywords: python, python developers, developers, nightmare compared, compared, python environment", "draft": true, "verdict_score": null, "cluster": "python, python developers, developers, nightmare compared", "category": "developer tools", "signal_score": 17.85, "authors": 9, "years": [2021, 2022, 2023, 2024, 2025], "pay_signals": 4.5, "avg_intensity": 3.11, "mentions": 9, "problem": "Python developers find deploying web and desktop apps a nightmare compared to PHP or Visual Basic; Developers find Python environments make automated scripts and services a pain; Python developers struggle with environments and version compatibility on rarely touched projects; Python developers find the ecosystem of overlapping libraries and package managers a nightmare to navigate; Hobbyists find Linux and Python environment setup a huge pain; Developers find Python scripts fragile to keep working across machines and upgrades", "quotes": [{"id": "32943186", "author": "robomartin", "year": 2022, "thread": "Cinder: Meta's internal performance-oriented production version of CPython", "text": "The one thing that keeps bugging me about Python (ignoring speed for a moment) is the lack of attention to seamless pain-free deployment.\n\nThere are two types: Web and desktop.  Both are a mess.\n\nOn the web the \"easy button\" is to pay for a dedicated service that is setup to specifically deal with the fact that deploying a Python/Django app to a Linux server is a nightmare and a mess.  You can deploy a PHP application to any server you care to choose from any hosting company in the world.  Grab a cheap GoDaddy server and off you go.  It's that simple.  With Python?  Forget it.\n\nTo some extent I blame this on the simplistic integrated development server trick.  Sure, it's great, you install D"}, {"id": "45769226", "author": "zahlman", "year": 2025, "thread": "Uv is the best thing to happen to the Python ecosystem in a decade", "text": "> I don’t want a thing that hijacks my terminal and PATH, flips my world upside down and makes writing automated headless scripts and systemd services a huge pain.\n\npip and venv are not such things. The activation script is completely unnecessary, and provided as a convenience for those to whom that workflow makes more sense.\n\n> Every time I need to containerize or setup a Python project for some arbitrary task, there’s always an issue with “Your Linux distro doesn’t support that version of Python anymore“\n\nI can't fathom why. First off, surely your container image can just pin an older version of the distro? Second, right now I have Python versions 3.3 through 3.14 inclusive built from sour"}, {"id": "44584641", "author": "codazoda", "year": 2025, "thread": "I'm Switching to Python and Actually Liking It", "text": "I haven't tried uv but my biggest pain point with Python has been the way env works. I always find it painful and odd.\n\nBackward compatibility, which I suppose is closely related to needing to use env, is also a pain. In my experience you can't go forward or backward in many cases. It's especially painful on projects that don't change very often. I'm sure that an active codebase can probably be kept updated from version to version, but if you've waited a bunch of versions, it seems painful.\n\nBut, I'm not sure I've given it a fair shake because I haven't needed to. It's use in AI does make it an attractive option, now more than ever."}, {"id": "43033916", "author": "devjab", "year": 2025, "thread": "Python 3.14 Getting New Interpreter", "text": "I use Zig and C with Python regularily and I think the interoperability is excellent. It's one of the coolest part about Python in my opinion, but the ecosystem is a nightmare to navigate. It's easy to use C structs for more efficient \"classes\" with libraries like msgspec, but chances are you've never heard about msgspec because there are at least 10 other libraries which do something similar, and there is also __slots__.\n\nEven your package and project manager isn't straight forward. With Javascript you're basically going to use either Deno or Bun, but with Python you're going to use what? I'd argue that UV was the only \"real\" option (come at me!) but like 90% of the Python programmers I wor"}], "key": "i61-Python developers strugg"}, {"name": "An immutable Linux desktop that normal people can use, with easy Nvidia support.", "one_liner": "Draft: cluster not yet reviewed. Keywords: linux, desktop, immutable, linux desktop, illumos, port", "draft": true, "verdict_score": null, "cluster": "linux, desktop, immutable, linux desktop", "category": "consumer & home", "signal_score": 17.81, "authors": 13, "years": [2021, 2024, 2025, 2026], "pay_signals": 3.0, "avg_intensity": 2.07, "mentions": 14, "problem": "An official Claude desktop app for Linux.; A generic immutable, A/B-boot, declarative home server OS that runs Docker, Kubernetes or QEMU workloads.; A fast, open, ChromeOS-like immutable desktop OS.; A Linux distro that works out of the box with Nvidia cards.; An immutable Linux desktop that normal people can use, with easy Nvidia support.; Linux users want a Debian-based atomic, image-based desktop with broad hardware support", "quotes": [{"id": "48439377", "author": "nullpoint420", "year": 2026, "thread": "Anthropic, please ship an official Claude Desktop for Linux", "text": "I get it. I wish there were more great laptop makers.\n I had a maxed out 16in M2 Max MacBook Pro, now I have an 15in M3 MBA. I also have a maxed out HP G1A Ultra running Fedora. They’re all excellent."}, {"id": "47899331", "author": "micw", "year": 2026, "thread": "Show HN: I've built a nice home server OS", "text": "I wish there was something like this or talos or coreos but more generic:\n- immutable\n- a/b boot\n- declarative (like talos)\nBut with choice of workload, like docker, k8s, qemu"}, {"id": "47120066", "author": "faust201", "year": 2026, "thread": "A bug is a bug, but a patch is a policy: The case for bootable containers", "text": "I tried a lot to get this in reality - using fedora silverblue. But that thing sucks. It is slow. Really dogslow. Devs are blaming rpm-ostree or btrfs - no idea.  I wish there was something like ChromeOS but open.\n\nHint: Maybe firefox should pivot (re-do Firefox OS) to that."}, {"id": "46476411", "author": "throwaway777x", "year": 2026, "thread": "2026 will be my year of the Linux desktop", "text": "This was true in 2010. I use to have a USB wifi adapter that was specifically meant to make sure linux would always work. I lost that adapter years ago.\n\nI can't remember the last time I tried a distro that didn't just work on a random computer with a random wifi but it has been several years now.\n\nNvidia cards on the other hand...last year I had to try about 10 distros before I found something that wasn't a huge pain in the ass."}], "key": "i62-An immutable Linux deskt"}, {"name": "A Mac file browser with sane new-folder placement, sorting and Enter-to-open.", "one_liner": "Draft: cluster not yet reviewed. Keywords: file, finder, mac, folder, enter open, mac file", "draft": true, "verdict_score": null, "cluster": "file, finder, mac, folder", "category": "productivity & work", "signal_score": 17.58, "authors": 9, "years": [2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 4.0, "avg_intensity": 2.67, "mentions": 9, "problem": "Reliable, comprehensive file search in macOS Finder.; Mac users want Finder features like cut and delete keys, showing all folders, and disabling scroll acceleration; A Mac file browser with sane new-folder placement, sorting and Enter-to-open.; A plain file-browsing mode in Jellyfin instead of error-prone metadata auto-detection.; Mac users would pay for local CLIP semantic search over any folder of images; Mac users want a polished Finder replacement with smart column widths and window memory", "quotes": [{"id": "49691038", "author": "Suppafly", "year": 2026, "thread": "Finder is so frustrating and has been since day one", "text": "obviously there are folders there with files in them, but finding them using the built in tools is a huge pain in the ass and it's impossible to be confident you actually searched them all."}, {"id": "45594050", "author": "Sohcahtoa82", "year": 2025, "thread": "Apple M5 chip", "text": "> - Finder is very mediocre comparing to even File explorer in Windows\n\nIt really is awful.  Why the hell is there no key to delete a file?  Where's the \"cut\" option for moving a file?  Why is there no option for showing ALL folders (ie, /bin, /etc) without having to memorize some esoteric key combination?\n\nFor fuck's sake, even my home directory is hidden by default.\n\n> - Scrollbar and other UI issues\n\nDisappearing scrollbars make sense on mobile where screen real estate is at a premium and people don't typically interact with them.  It does not make sense on any screen that you'd use a mouse to navigate.\n\nFor years, you couldn't even disable mouse acceleration without either an esoteric co"}, {"id": "41497933", "author": "greatgib", "year": 2024, "thread": "Gnome Files: A detailed UI examination", "text": "In my opinion, OS X Finder is the most defective file browser of them all.\n\nIt always makes me laugh when some people believe the marketing of Apple saying that their OS is the most ergonomic when it is totally not the case.\n\nThings like creating a new folder is a nightmare, if you are in the kind of a tree view and try to create a folder or paste a file, it will end up in the top parent folder.\n\nWhen you sort by recent date it does not make any sense: you have files from the most recent to the oldest, but for a given day, like the last day or week, they are ordered in the opposite way (oldest to newest).\n\nThere are hundreds of other stupid decisions like that.\n\nIn the same way, who had this"}, {"id": "39939390", "author": "shiroiushi", "year": 2024, "thread": "Plex Asks GitHub to Take Down 'Reshare' Repository over Piracy Fears", "text": "I haven't tried Plex, and use Jellyfin, but I have to say, the UI on Jellyfin is absolutely atrocious.\n\nI wish there was simply a way to make it show me the files I have available, for instance.  There seems to be no way to do that.  Instead, it insists on auto-detecting everything and then showing some preview image for that, along with some info scraped from the internet somewhere.  It sounds nice, but instead when I want to watch \"Space: 1999\", it tells me I only have episodes of \"Space Jam\" or some other show I've never heard of.  Or, it tells me I have no shows at all, but the shows are instead in the \"Movies\" section, or somewhere else entirely in the UI.  It's bizarre.\n\nI can see why "}], "key": "i63-A Mac file browser with "}, {"name": "Online daters want a dating app with strong real-person verification free of scam and extortion profiles", "one_liner": "Draft: cluster not yet reviewed. Keywords: dating, daters, online daters, daters dating, dating platform, online", "draft": true, "verdict_score": null, "cluster": "dating, daters, online daters, daters dating", "category": "communication & social", "signal_score": 17.57, "authors": 8, "years": [2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 6.0, "avg_intensity": 2.88, "mentions": 8, "problem": "Online daters want a dating app with strong real-person verification free of scam and extortion profiles; A dating app built around evidence on which partner traits actually matter, not engagement.; Daters want a dating app that pushes quick in-person meetings rather than AI-mediated chatting; Online daters want a dating platform with real identity verification; Dating app users struggle with compulsive use and want built-in tools to limit it; A thoughtful, profile-focused dating platform like early OkCupid.", "quotes": [{"id": "40228157", "author": "8f2ab37a-ed6c", "year": 2024, "thread": "Cheating Site Ashley Madison Is Overflowing with Sextortionists", "text": "This feels like a market opportunity: an online dating website that extensively confirms that you are a real person, somehow. I would happily pay for that. With gen AI images getting really good, it feels like we're only a few months to years away from being incapable of telling these profiles apart. For now, you can still spot them.\n\nHow you would kickstart this high-security two sided marketplace is anybody's guess though, not sure there would be enough interest.\n\nI have had to give up on Tinder which at least in my city has become entirely overrun by fake extortion or pig butchering profiles. Bumble is half-way there. Hinge is somehow resisting for now, but I've successfully reported real"}, {"id": "43853766", "author": "stevage", "year": 2025, "thread": "The Fantasy of a Nonprofit Dating App", "text": "I like the idea of scientist-run dating apps, although it does create its own potential conflicts of interest: the purity of the experiment and publishibility of experiments vs the needs of the participants.\n\nI do think overall part of the reason dating experiences are so bad is that people aren't that good at identifying what traits are actually important in a partner for them, nor determining whether an individual has those traits.\n\nDefinitely seems like a space ripe for disruption in any case."}, {"id": "43301446", "author": "haswell", "year": 2025, "thread": "AI 'wingmen' bots to write profiles and flirt on dating apps", "text": "I found myself single in my late 30s after a long relationship ended.\n\nDipping my toe in the water with the apps was not an experience that I enjoyed. I met my ex online at a time when people didn’t admit they met online. That was a far better time for online dating.\n\nWhat I know with absolute certainty is that adding AI to the pre-meeting process is exactly the opposite of what I want, especially if that means I’m not interacting with the real person.\n\nI already have a strongly stated “if we’re both interested based on our profiles, let’s just meet for coffee ASAP” preference, and the best dates have been with people who felt the same way. Anything else (aside from maybe a video call) just "}, {"id": "40228863", "author": "gwbas1c", "year": 2024, "thread": "Cheating Site Ashley Madison Is Overflowing with Sextortionists", "text": "> somehow, I would happily pay for that\n\nWhen I was in my 20s, I found all of the \"pay\" dating services to be rip-offs.\n\nEveryone who was on (pay dating site that I can't remember) was also on OkCupid, so it didn't make any sense to pay for a smaller net.\n\nTable For Six (advertised on the radio) turned out to be a scam when I went to the interview. I should have known to walk out, instead of haggling, as soon as \"twenty nine, ninety nine\" was $2999.00. (I later met a fool who signed up for the service, turned out they had so few suckers that only a few people showed up at the events.)"}], "key": "i64-Online daters want a dat"}, {"name": "Developers would pay for a git GUI to split commits by dragging files and hunks between commits", "one_liner": "Draft: cluster not yet reviewed. Keywords: git, git gui, gui, developers, commits, time", "draft": true, "verdict_score": null, "cluster": "git, git gui, gui, developers", "category": "developer tools", "signal_score": 17.5, "authors": 8, "years": [2013, 2020, 2022, 2023, 2024, 2026], "pay_signals": 7.5, "avg_intensity": 2.75, "mentions": 8, "problem": "Developers would pay for a fast standalone git GUI with a diff view as good as IntelliJ's; Developers would pay for a git GUI to split commits by dragging files and hunks between commits; VS Code users would pay for a Magit-quality git interface; Developers would pay for an IDE-integrated GitHub explorer that jumps from diffs to changed lines; Companies would pay for visual file-version comparison that integrates with git; Developers want a decent git GUI that handles submodules, multiple remotes and sync failures", "quotes": [{"id": "46506305", "author": "__jonas", "year": 2026, "thread": "I switched from VSCode to Zed", "text": "I agree with that comment chain about the intelliJ diff view so much\n\nhttps://github.com/zed-industries/zed/discussions/26770#disc...\n\nI don't even need that to be built into the editor – I would pay for a fast, standalone git UI that is as good as the IntelliJ one. I use Sublime Merge right now and it's kind of ok but definitely not on the same level"}, {"id": "42310864", "author": "Pet_Ant", "year": 2024, "thread": "Rewrite Git history via drag-and-drop", "text": "I want to be able to split a single commit into multiple commits. I sometimes mix clean-up changes with core logic changes in a single commit. That is something I'd pay for. To be able to just drag'n'drop the files from commit to commit. Especially if I could split changes within a file between commits. Something more powerful than the partial commits of Intellij."}, {"id": "36967235", "author": "harrygeez", "year": 2023, "thread": "Emacs is my new window manager", "text": "I'm fairly quick with Emacs... But these days VS Code is so good I don't really miss it. Command palette kind of feels like M-x\n\nSometimes I feel like I'm too quick that Emacs is trying to catch up, that's the problem. Emacs native compilation made things a lot faster, but I reckon VS Code out of the box plus some extensions makes it a much better value proposition. It's difficult to go back to grepping when VSCode let's you see your regex results _on the fly_\n\nI still use Emacs for Magit. I would pay for a Magit for VSCode implementation"}, {"id": "23750818", "author": "Pick-A-Hill2019", "year": 2020, "thread": "Putting the I Back in IDE: Towards a GitHub Explorer", "text": "For me the killer feature of this is the \" you get diffs that can take you, in a single keystroke, to the very lines that were changed – loaded right there in your editor.\" Combined with branches being sandboxed had me extremely interested. Both of these have been a personal pain point/pinch point.\nWith that said, the mere mention of keybindings had me running for the hills (muscle memory, user training, etc.) In fairness they do end with \"One hopes the idea is intriguing enough to encourage development elsewhere\". While I'm not going to be the one picking up on that one, it has made me realize that the things I growl at about Github are experienced by others so yes, there is a market for so"}], "key": "i65-Developers would pay for"}, {"name": "Viewers would pay for YouTube Premium if creators' sponsor segments were also removed", "one_liner": "Draft: cluster not yet reviewed. Keywords: sponsor, viewers, segments, skipping, sponsor segments, premium", "draft": true, "verdict_score": null, "cluster": "sponsor, viewers, segments, skipping", "category": "media & content", "signal_score": 17.46, "authors": 11, "years": [2021, 2022, 2023, 2026], "pay_signals": 10.0, "avg_intensity": 2.36, "mentions": 11, "problem": "Viewers would pay for auto-skipping sponsor segments with creators compensated; YouTube users would pay for Premium if it allowed sponsor-skipping in the official Android app; Viewers would pay to remove ads from shows that are only offered with ads; YouTube Premium subscribers want sponsored segments removed too; Apple TV viewers lack a good way to skip sponsor segments on YouTube; Viewers would pay for YouTube Premium if creators' sponsor segments were also removed", "quotes": [{"id": "31173234", "author": "jhallenworld", "year": 2022, "thread": "Alphabet Announces First Quarter 2022 Results", "text": "I pay this to get rid of Google's inserted ads, but it's getting hurt by too many in-video sponsorship ads.  I would pay for a mode where the content creator gets more money in exchange for automatically skipping their sponsorship ad.\n\nThe like/subscribe/become a Patreon is also annoying, but not as bad as actual ads."}, {"id": "30753403", "author": "alickz", "year": 2022, "thread": "Vanced Discontinuation", "text": "I'd pay for Youtube Premium if they'd let me use SponsorBlock with their Android app."}, {"id": "28675280", "author": "mikestew", "year": 2021, "thread": "What if there were no ad blockers?", "text": "What annoys me is that for some of those shows (most? all?), you either watch ads or you don't watch it. Had that happen with Alex Rider. Looks like a decent show when there's nothing else of better quality on. IIRC, the \"first one's free\", then it's ads after that.\n\n\"Take my money and turn off the ads!\"\n\n\"We don't want your money, we want you to watch ads.\"\n\nThere's nothing I need to watch that badly, thanks. But thanks to COVID, I haven't been in a hotel room for a while, so thanks for reminding me how hideous ad-supported television is."}, {"id": "27550596", "author": "orangepanda", "year": 2021, "thread": "Brave, the false sensation of privacy", "text": "> Many seem to argue that \"They'll pay to have ads removed\", but that doesn't seem to hold true when services offers that exact option.\n\nI would pay for ad free Youtube, if it was an option. Even with Youtube Premium, included promotions continue to be shown"}], "key": "i66-Viewers would pay for Yo"}, {"name": "Desktop developers find building native UIs across macOS, Windows and Linux a nightmare", "one_liner": "Draft: cluster not yet reviewed. Keywords: desktop, native, native desktop, cross platform, cross, net", "draft": true, "verdict_score": null, "cluster": "desktop, native, native desktop, cross platform", "category": "developer tools", "signal_score": 17.32, "authors": 8, "years": [2020, 2021, 2023, 2024, 2025, 2026], "pay_signals": 3.5, "avg_intensity": 3.0, "mentions": 9, "problem": ".NET developers find desktop and cross-platform UI frameworks like MAUI and WPF a nightmare to style, debug and compile; .NET developers want a good unified UI story across desktop, mobile and web; AI-assisted porting of one app to native UIs on Mac, Windows and Linux.; Desktop developers find building native UIs across macOS, Windows and Linux a nightmare; Desktop developers find Linux packaging for webview apps like Tauri a nightmare; A better cross-platform native desktop app development environment.", "quotes": [{"id": "45358496", "author": "____mr____", "year": 2025, "thread": "Xcode Is the Worst Piece of Professional Software I Have Ever Used", "text": "This has been my experience as well. All code that doesn't need a UI feels good to write, but as soon as you try to make anything that doesn't run in the console you are met with so much boilerplate and bad tooling that I start dreading waking up.\n\nI've had to make a couple of side projects for my company and I've tried WPF, Blazor, MAUI, and Winforms.\n\nBlazor is the best out of all of these but even it has tedious boilerplate and unintuitive state handling.\n\nMVVM makes WPF and Winforms a hassle, and customizing the looks of components is a nightmare, where some seemingly universal attributes will either get misapplied or outright ignored.\n\nMAUI is a nightmare to work with. Cross compilation"}, {"id": "48257500", "author": "noveltyaccount", "year": 2026, "thread": ".NET (OK, C#) finally gets union types", "text": "Same. I wish there was a good story for .NET UI on desktop, mobile, and web. I find Maui Blazor Hybrid to be pretty close. The desktop and mobile variants compile to a webview bound to native code (no WASM, no JS), and the Web variant compiled to WASM. Much leaner than Electron. Pretty clunky though last time I tried though that was three years ago."}, {"id": "47242110", "author": "rayiner", "year": 2026, "thread": "Claude is an Electron App because we've lost native", "text": "> I think that developing (in case of desktop) for 3 different platforms all with own complication of what is native UI is a nightmare. macos has swiftui (incomplete), uikit and appkit, linux in practice gtk/qt, windows winui 3 (fundamentally broken) with WPF and WinForms still hanging around .\n\nWouldn’t it be a good use of AI to port the same app to several native platforms?"}, {"id": "47242061", "author": "YmiYugy", "year": 2026, "thread": "Claude is an Electron App because we've lost native", "text": "This might be a \"the grass is greener on the other side\" situation because I do a lot more web than native dev, but in my experience native while just as quirky as web will usually give you low level APIs to work around design flaws.\nOn web it too often feels like you can either accept a slightly janky result or throw everything away and use canvas or webgl.\nHere are some recent examples I stumbled across:\n- try putting a semi transparent element on part of an image with rounded corners and you will observe unfixable anti-alias issues in those corners\n- try animating together an input with the on screen keyboard\n- try doing a JS driven animation in a real app (never the main thread feels hop"}], "key": "i67-Desktop developers find "}, {"name": "Mac users want consistent window tiling, a snappy Settings app and the ability to uninstall default apps", "one_liner": "Draft: cluster not yet reviewed. Keywords: window, mac, macos, tiling, windows, tiling window", "draft": true, "verdict_score": null, "cluster": "window, mac, macos, tiling", "category": "productivity & work", "signal_score": 17.29, "authors": 10, "years": [2012, 2022, 2023, 2025, 2026], "pay_signals": 4.5, "avg_intensity": 2.5, "mentions": 10, "problem": "Mac users find macOS Spaces handles multiple windows of one app badly; Mac users find window and desktop management a huge pain with many apps open; Coherent, flexible window snapping and management built into macOS.; Mac users cannot easily switch between two specific windows of different apps; New Mac users need third-party tools for window snapping and mouse control and find app switching awkward; A true tiling window manager for macOS.", "quotes": [{"id": "42985976", "author": "matanrubin", "year": 2025, "thread": "Show HN: FlashSpace – fast, open-source, macOS Spaces replacement", "text": "The biggest pain point with macOS spaces is how it handles multiple windows of the same app. It drives me crazy. \nWhat is FlashSpace’s approach for solving this?"}, {"id": "37455868", "author": "bstar77", "year": 2023, "thread": "On Desktop GUI Minimalism", "text": "I have a Mac and a Linux box for work.  I have been using my Macbook for some AI work I'm doing, but my workflow has been a mess.  I had 4 desktops going, 2 projects opened w/debugging, many browser tabs opened to various docs, MS Teams, Outlook, etc.  I don't even run Apple music anymore because it makes my laptop too hot.\n\nOn my mac the desktops constantly change position for unknown reasons.  Managing windows is a huge pain on each desktop because it's very easy to obscure them... there is also a ton of wasted space with so much gui noise.  CMD tabbing through apps is tedious and inflexible.\n\nI posted some screenshots of my Linux setup in a different comment.  My Linux workflow is night a"}, {"id": "36374427", "author": "SebastianKra", "year": 2023, "thread": "Ask HN: Why does Apple refuse to add window snapping to macOS?", "text": "I always feel like Apple must have some grand 1000IQ concept for window management and I just don't get it. Stage Manager, Spaces, Mission Control, Expose, Window Zooming, Hiding, Minimizing (which is different from Hiding), Fullscreen/Splitscreen... yet the first thing I do is install a third-party window manager.\n\nI tried for months to go vanilla and get my head around the features. But why, why do fullscreen windows create their own space when I want them to exist within a space? Why can't I briefly bring up Finder on top of my fullscreen window? Why are there lengthy animations to switch between spaces? Why do CMD+Tab and CMD+` have a million special rules for which windows they select? "}, {"id": "31331916", "author": "billyhoffman", "year": 2022, "thread": "AltTab – Windows alt-tab on macOS", "text": "I switched to the Mac about 10 years ago. The biggest pain point I haven't really been able to solve (before this app) is switching between 2 specific windows in 2 different applications. On Windows this was as easy as ALT+tab\n\nPerfect example, I'm looking in Safari, and entering some numbers in Excel. I have multiple windows open for each app. I'm in Excel, and CMD+tab to switch to Safari, and all the Safari windows come forward, coving up my Excel window. CMD +` only cycles the windows of the current app. There is no easy way to bounce back and forth between a specific Excel window and a specific Safari window. Instead I have to Hide or rearrange my windows so that switch apps doesn't comp"}], "key": "i68-Mac users want consisten"}, {"name": "Smart home owners want control over surprising device integrations and firmware updates that brick appliances", "one_liner": "Draft: cluster not yet reviewed. Keywords: smart home, smart, home, homeowners, home owners, owners", "draft": true, "verdict_score": null, "cluster": "smart home, smart, home, homeowners", "category": "hardware & IoT", "signal_score": 17.29, "authors": 7, "years": [2017, 2018, 2020, 2023, 2025, 2026], "pay_signals": 5.5, "avg_intensity": 3.43, "mentions": 7, "problem": "Smart home owners want control over surprising device integrations and firmware updates that brick appliances; Smart home owners are angry that devices lose support and must be replaced; Homeowners lack a universal smart home standard that works across appliances for decades; Smart home owners find consumer WiFi and Zigbee devices randomly reset or drop and want robust local systems; Smart thermostat owners want local APIs and open firmware for home automation integration; Homeowners want API access to their communicating HVAC thermostats", "quotes": [{"id": "49831218", "author": "steveBK123", "year": 2026, "thread": "Owners mourn cluster recipes for orchestrators other than Kubernetes", "quotes": [{"id": "39281408", "author": "0xbadcafebee", "year": 2024, "thread": "Learnings from our years of Kubernetes in production", "text": "You aren't a real K8s admin until your self-managed cluster crashes hard and you have to spend 3 days trying to recover/rebuild it. Just dealing with the certs once they start expiring is a nightmare.\n\nTo avoid chicken-and-egg, your critical services (Drone, Vault, Bind) need to live outside of K8s in something stupid simple, like an ASG or a hot/cold EC2 pair.\n\nI've mostly come to think of K8s as a development tool. It makes it quick and easy for devs to mock up a software architecture and run it anywhere, compared to trying to adopt a single cloud vendor's SaaS tools, and giving devs all the Cloud access needed to control it. Give them access to a semi-locked-down K8s cluster instead and t"}, {"id": "27976953", "author": "jrockway", "year": 2021, "thread": "Docker in Production: A History of Failure (2016)", "text": "The biggest pain point is having to manually use cloudformation to create node pools.  This is especially irritating when you just need to roll the Linux version on nodes -- takes half a day to do right.  In GKE, it's just a button in the UI (or better, an easy-to-use API), and you can schedule maintenance windows for security updates (which are typically zero downtime anyway, assuming you have the right PodDisruptionBudgets).  I think AWS fixed that.  I remember when I used it, they said they had some new tool that would handle that, but you had to re-create the cluster from scratch.  This was a couple years ago, and is probably decent nowadays.\n\nThere are other warts, like certain storage "}, {"id": "49928177", "author": "danudey", "year": 2026, "thread": "Red Hat being phased out of existence?", "text": "Their goal is to create a system that's easy to run and manage even if you don't really know much about k8s - which I guess is a common thing, since k8s is a nightmare to manage directly until you learn everything about everything.\n\nMore importantly, they want to build an ecosystem around their ecosystem around k8s. They want people publishing their software to work on OpenShift (e.g. in the operator catalog), they have certification processes for software compatibility (e.g. CNI certification), and now that they've come as far as they have they're going after VMWare's lunch, madly scooping up every customer they can get their hands on to try to offer them a user-friendly kubevirt implementa"}, {"id": "33811814", "author": "atonse", "year": 2022, "thread": "How We Built Fly Postgres", "text": "I did love the simplicity of nomad.\n\nAnd in general, nomad worked pretty well for us but our consul cluster kept mysteriously failing. I think that caused our nomad cluster to fail because it was backed by Consul.\n\nThe one complaint I did have about nomad (same as consul) was that the recovery process was manual where you had to manually generate a peers.json.\n\nI was shocked when I saw that. Truly one of the \"finding how the sausage is made\" moments even though I've managed linux servers for two decades – I always assumed it would use zeroconf/bonjour/multicast DNS (remember cloud auto-join?) or something similarly elegant to auto discover other nodes in the network and just reconnect and re"}], "key": "i70-Teams find recovering se"}, {"name": "Developers want a fast, embeddable scripting language with static typing, big integers and good tooling", "one_liner": "Draft: cluster not yet reviewed. Keywords: scripting, scripting language, language, scripts, embeddable, run scripts", "draft": true, "verdict_score": null, "cluster": "scripting, scripting language, language, scripts", "category": "developer tools", "signal_score": 17.1, "authors": 10, "years": [2021, 2022, 2025, 2026], "pay_signals": 3.0, "avg_intensity": 2.64, "mentions": 11, "problem": "A CI tool built to just run your own scripts, rather than
