"My impression is that many of these \"open source developers\" overestimate the value of their code. There are many amazing projects for which I would pay considerable price, but the long tail of 99% of projects just aren't worth anything in my opinion. It is an interesting exercise though - to imagine how much I would pay for my window manager, gcc or even Vim.\n\nMaybe easier transactions of tiny sums is the real solution? Even if every user paid something trivial like 10 cents a month, it would be a huge revenue stream for popular projects which lack maintenance. Of course, adding monetary incentives opens a whole new can of worms, so maybe the current situation is the best we can do after al"}], "key": "i18-Open Source Tab"}, {"name": "Account Lifeline", "one_liner": "Insurance for your digital life: continuous export of your Google, Apple and Microsoft accounts, plus human-assisted recovery when you get locked out.", "problem": "People get locked out of Google, Microsoft or game accounts with no human to talk to and lose decades of photos, email and purchases. They say they would pay for real support.", "customer": "Families and freelancers whose digital lives live in one big-tech account.", "evidence": "Recurring high-pain stories (intensity 4-5): lost accounts, kids' game worlds gone, failed recovery with the recovery email. Commenters explicitly would pay for human support or automatic outside backups.", "solution": "A scheduled Takeout-style export of mail, photos, drive and contacts to the user's own storage, a recovery-readiness checklist (backup codes, recovery devices), and concierge help with recovery forms and escalation.", "mvp": "Automated Google account backup to the user's S3 or Backblaze, a readiness score, and a $5 a month plan.", "business_model": "$5 a month individual, $10 a month family.", "alternatives": "Google Takeout (manual, one-off), Spanning and Afi (business only), Apple and Google recovery flows. No consumer human-escalation service exists.", "why_now": "AI moderation bans are rising, and passkeys concentrate identity in a few providers.", "risks": "Can't actually force providers to restore accounts. API access to export data can be restricted.", "verdict_score": 5, "cluster": "recover, accounts, human, fee human", "category": "security & privacy", "signal_score": 16.76, "authors": 6, "years": [2021, 2022, 2023, 2024], "pay_signals": 5.5, "avg_intensity": 4.33, "mentions": 6, "quotes": [{"id": "34863983", "author": "valdiorn", "year": 2023, "thread": "Facebook Announces Meta Verified", "text": "tbh, I'd prefer the option of paying for support over literally no support at all, ala. Google.\n\nIf my Gmail account is compromised, I'd be pretty fucked, despite doing my best to make backup arrangements - it's still the skeleton key to the rest of my digital life and my primary point of contact for everyone who interacts with me.\n\nI'd happily pay some small fee to have an actual human help me resolve the issue. But right now, that's not even an option."}, {"id": "40434147", "author": "muppetman", "year": 2024, "thread": "Show HN: Pls Fix – Hire big tech employees to appeal account suspensions", "text": "On the flip side I'd pay for this.\nMy Twitter account was suspended last year for no reason I can fathom. I wasn't abusive, I wasn't hacking/abusing the platform etc.  Just one day I posted a comment and was then told \"Your account is blocked\"\nI'd really love to get it back as it's a 3 letter handle.  Alas, despite submitting upwards of 100 appeals I hear nothing back (I guess since Elon took over there's no support staff anymore)\nAnyway, I can see there would be a market for this, however unethical/risky it would be for employees to participate in."}, {"id": "31391783", "author": "tqkxzugoaupvwqr", "year": 2022, "thread": "Google Account has been disabled because of a Python code", "text": "> My photos since I was a baby till nowadays (23 years of images), my niece's photos since she was in  true, "verdict_score": null, "cluster": "viewers, streaming, viewers streaming, content", "category": "media & content", "signal_score": 24.16, "authors": 22, "years": [2016, 2017, 2019, 2020, 2021, 2022, 2023, 2024, 2025], "pay_signals": 22.0, "avg_intensity": 3.09, "mentions": 22, "problem": "Viewers would pay for streaming if everything were in one place and worked seamlessly across devices; Viewers would pay $50-100 a month for one streaming service with a unified UI and content that never disappears; Viewers would pay for individual shows instead of whole streaming services; Viewers would pay for one service with all movies, music and TV, DRM-free and ad-free; Viewers would pay more for a Spotify-like all-in-one service for TV, movies and sports; Viewers would pay $30-50 a month for one global service with access to everything", "quotes": [{"id": "45919304", "author": "NaomiLehman", "year": 2025, "thread": "You will own nothing and be (un)happy", "text": "I would pay for a streaming service if everything was in one place and working seamlessly with all my devices like my torrent/AirPlay setup.\n\nI play for a TON of services. Just not streaming.\n\nI also couldn't care less about copyright and all that stuff."}, {"id": "38437103", "author": "hotnfresh", "year": 2023, "thread": "Several piracy-related arrests spark fears of high-level crackdown", "text": "I’d happily pay $50/m for a streaming service with a single UI that had all the shit my piracy server does, and a guarantee that things won’t disappear (or at least a track record of that rarely happening). Hell, I might pay as much as $100/m. Maintaining the server and pirating stuff takes time, and hard drives cost real money.\n\nIt’s only the combo of money savings, higher quality (most steams are shit), unavailability of what I want (the best versions of several TV shows and movies are piracy exclusives, for one thing), and unified UI that make it worth it. Start chipping away at those, and it gets not-worth-it pretty fast. Apple tried with their unified streaming service UI on Apple TV, b"}, {"id": "32427758", "author": "IceMetalPunk", "year": 2022, "thread": "Disney Plus to Raise Prices by $3 a Month as It Launches Tier with Ads", "text": "ShowRSS + uTorrent has worked for me. I know, I know, \"but illegal/the moneys\". I watch like... 1 show on Netflix (2 now with Sandman), 1 show on the CW (soon to be 0, as it's the Flash), 1 show on HBO Max (Harley Quinn), etc. Paying for an entire service (or cable) just because I like one show they offer is ridiculous. The closest I'd come to doing it is Disney+ because of all the Marvel content, but even then I'm paying for access to a shit-ton of Disney content I couldn't care any less about. (I currently do pay for Netflix, mostly because I subbed to support their pickup of Lucifer and then decided to stay subbed until Umbrella Academy dies.)\n\nBasically, what I'm saying is, as long as ev"}, {"id": "29352150", "author": "ryandrake", "year": 2021, "thread": "Piracy release group EVO ‘blames’ movie industry for its popularity", "text": "Exactly. Here are my product requirements:\n\nUnrestricted access to all movies, music and TV shows ever made. Not 90%. Not 98%. Not \"all except a few we couldn't work out licensing agreements over\". All.\n\nHighest resolution/quality available at the time of release (DVD quality for 90s movies: OK. DVD quality for 2010 movies: NO)\n\nNo arbitrary device/OS limitations.\n\nCan watch/listen/download from any location on earth with sufficient bandwidth.\n\nNo ads embedded in the middle of the content.\n\nThat's it! Piracy offers all of the above for free, but I'd be willing to pay for this. Just release this product and take my money. The best part is, technology-wise, all of the above are solved problems"}], "key": "i21-Viewers would pay for in"}, {"name": "Users would pay for a social network with quality content and API access", "one_liner": "Draft: cluster not yet reviewed. Keywords: soci e using real names / validated and so on."}, {"id": "37854234", "author": "qup", "year": 2023, "thread": "Ask HN: If you paid for social media what would you expect in return?", "text": "Don't game the algorithm, just make it relevant & in order\n\nDon't show me ads\n\nDon't autoplay videos for any reason\n\nDon't try to capture my attention\n\nProtect my data. Never have a breach\n\nExpire my data\n\nDon't track me\n\nI'm not gonna pay, though. I would pay for a place like this--a smaller community. I'm not paying a company like Meta."}, {"id": "37755606", "author": "darth_avocado", "year": 2023, "thread": "Meta wants to charge EU users $14/month if they don't agree to personalized ads", "text": "I would pay for it if on top of removing ads, I do not see cringe “suggested for you content”. I mean there are only so many DIY hacks, people nodding to a video running in the background, dancing people who can’t dance, people lip syncing an unoriginal audio etc. I can watch."}], "key": "i22-Users would pay for a so"}, {"name": "Users would pay about $10 a month for an ad-free social network", "one_liner": "Draft: cluster not yet reviewed. Keywords: ad, social, ad social, 10, remove ads, remove", "draft": true, "verdict_score": null, "cluster": "ad, social, ad social, 10", "category": "communication & social", "signal_score": 21.26, "authors": 18, "years": [2013, 2015, 2016, 2017, 2018, 2019, 2020, 2022, 2023, 2026], "pay_signals": 18.0, "avg_intensity": 2.5, "mentions": 18, "problem": "Users would pay $50 a month for ad-free search with sane results; Users would pay $50 a month flat for ad-free web where creators get paid per page visit; Users would pay €10-15 a month for ad-free services via a safe, anonymous payment method; Users would pay $1 a month per person for an ad-free social network for close friends; Users would pay about $50 a year for a subscription cost tracker; Users would pay $10 a month for a pro social media tier with no ads, more privacy and open APIs" d I mean guaranteed in a way that I would have legal recourse against the company if they go back on their word or screw up"}, {"id": "38967026", "author": "bamboozled", "year": 2024, "thread": "YouTube strikes again, it seems", "text": "Maybe they'd have to offer a normal paid for service and stop being a strange predatory company.\n\nI pay for search now, I'd pay for a service like YT that had nothing to do with Google so long as my privacy was respected."}, {"id": "36899489", "author": "worik", "year": 2023, "thread": "Techdirt has been deleted from Bing and DuckDuckGo [fixed]", "text": "I have been using DDG as my main search for years and years.\n\nBut I have found the LLM powered Bing, using Skype (!!) as the user interface really compelling\n\nI have played around myself with getting LLMs to summerise and evaluate text for me, and it seemed that an automated way would be very cool.\n\nThen Microsoft implemented it.\n\nWow. It is very very good\n\nSo DDG is still good. Very good. And privacy, a very strong selling point\n\nBut wading through click bait websites looking for a website that is not just straining for eyeballs: Bing's LLM based machine is  a dogsend!\n\nI would pay for a service like that from DDG. I already pay real money for an OpenAI API key.\n\nSell me yours.   I would mu"}], "key": "i25-Users want trustworthy p"}, {"name": "Users would pay for a legal Plex-like service to buy and stream owned media", "one_liner": "Draft: cluster not yet reviewed. Keywords: streaming, media, piracy, legal, convenient, viewers", "draft": true, "verdict_score": null, "cluster": "streaming, media, piracy, legal", "category": "media & content", "signal_score": 18.59, "authors": 9, "years": [2012, 2014, 2019, 2021, 2022, 2023, 2025], "pay_signals": 9.0, "avg_intensity": 3.33, "mentions": 9, "problem": "Viewers would pay for an expensive aggregator of major streaming services with good Linux support; Viewers would pay $200+ a month for a legal Plex-like service with ant the content I paid for.\n\nIt's not because I don't want to pay for the content, I'd happily pay 2-3x under the right circumstances. It's because no one wants to take my money and provide the content I want without bundling it with drm, ads, dark patterns, insane region segmentation, an"}, {"id": "43143961", "author": "shepherdjerred", "year": 2025, "thread": "Amazon now discloses you're buying a license to view Kindle eBooks", "text": "Oh what I’d pay for a 100% legal version of Plex (e.g. allows me to easily buy and stream my media)"}], "key": "i26-Users would pay for a le"}, {"name": "Readers would pay a premium for DRM-free ebooks", "one_liner": "Draft: cluster not yet reviewed. Keywords: ebook, readers, drm, books, authors, ebooks", "draft": true, "verdict_score": null, "cluster": "ebook, readers, drm, books", "category": "media & content", "signal_score": 17.85, "authors": 9, "years": [2010, 2011, 2012, 2022, 2023, 2025, 2026], "pay_signals": 10.0, "avg_intensity": 2.4, "mentions": 10, "problem": "Self-published authors would pay to convert manuscripts into both epub and print-ready trade PDFs; E-reader owners would pay for books if available as DRM-free ePubs; Readers would pay authors directly for cheap DRM-free PDFs instead of expensive locked ebooks; Self-published authors would happily pay for easy ebook and print-ready conversion; Readers would pay a premium for DRM-free ebooks; Readers would pay for reader-friendly formatted editions of free public domain great books", "quotes": [{"id": "3427141", "author": "halostatue", "year": 2012, "thread": "E-books Are Not That Easy", "text": "I'm sending you a note via email, but…how close to print-ready are the PDFs that are generated? My wife has been working on a novel (and 90%) of a sequel that we're getting ready to self-publish through Lulu and KDP and I'm tired from the formatting hoops.\n\nWe're using Ulysses (similar to Scrivener) and exporting to Word and importing to Pages (because the epub export was somewhat disappointing compared to the Pages epub export, and Pages layout tools are more powerful than Word's) because we need both epub and 6\"x9\" (US trade) print-ready PDF. She's got a cover and a back cover. She wants to have both ebook and hardcopy, and you guys don't offer hardcopy.\n\nI don't have the time to write the"}, {"id": "46327987", "author": "misterbishop", "year": 2025, "thread": "Amazon will allow ePub and PDF downloads for DRM-free eBooks", "text": "I love my Libra 2 reader, but I only use it to read epub files from questionable websites. I would pay for books if they were available as DRM-free epubs."}, {"id": "37531446", "author": "musicale", "year": 2023, "thread": "“Most notorious” illegal shadow library (LibGen) sued by textbook publishers", "text": "Pretty much this. I'd happily pay the author $7 for a PDF rather than $70 for a DRM-encumbered Kindle ebook (or $31 to \"rent\" it for a term.)"}, {"id": "3488533", "author": "halostatue", "year": 2012, "thread": "The Audacity of the iBooks Author EULA", "text": "iBooks 2 format is more or less ePub3, as I understand it. I could understand it incorrectly.\n\nI can also speak fairly highly of the leanpub team's process. My wife and I are finding it less than perfect for our needs in producing a fiction book with both ebook and print-ready book needs, but appreciate the directness and promptness with which both Scott & Peter have been responding to us when we are raising issues with what we're seeing.\n\nBetter yet, their conversion is free with no commitment to sell your book on leanpub required. I'd happily pay for what they're providing for free because it's so damned easy."}], "key": "i27-Readers would pay a prem"}, {"name": "Expats would pay for legal streaming of US and UK TV shows abroad", "one_liner": "Draft: cluster not yet reviewed. Keywords: uk, viewers, bbc, access, tv, streaming", "draft": true, "verdict_score": null, "cluster": "uk, viewers, bbc, access", "category": "media & content", "signal_score": 17.69, "authors": 11, "years": [2012, 2013, 2018, 2019, 2021, 2022, 2023], "pay_signals": 11.5, "avg_intensity": 3.08, "mentions": 12, "problem": "UK viewers would pay for same-day legal access to US shows; International viewers would pay for legal fast access to US shows instead of torrents; Expats would pay for legal streaming of US and UK TV shows abroad; Viewers abroad would pay a TV license to legally stream BBC iPlayer; US viewers would pay a UK TV license to stream British TV legally; British expats want to pay for legal streaming of live UK free-to-air TV abroad", "quotes": [{"id": "5292504", "author": "celticninja", "year": 2013, "thread": "Piracy Doesn’t Hurt Game of Thrones, Director Says", "text": "Geographic location plays a part too. I would happily pay for GoT but I am in the UK and cannot get HBO. If I want to watch it legally i have to wait 3-6 months, alternatively I can download a copy 5 minutes after the episode ends in the US.\n\nThis delay actually impacts on the UK broadcaster as they pay for the rights to show a programme but by the time it is shown many of their target audience will have downloaded the episodes. Same thing applies to movies. Works in reverse too with things like Doctor Who.\n\nThere really doesnt appear to be a good reason for these delays between national markets other than \"that is how it has always been done\"."}, {"id": "4753776", "author": "bobsy", "year": 2012, "thread": "This service lets you use Netflix, Pandora, Hulu, and Rdio from any country", "text": "Its a shame that this will almost certainly be shut down quickly. Just browsed Hulu and they have shows on there which I download on a weekly basis.\n\nI do not watch much TV. I do not want to pay an extra £20/mo to get the hundred or so channels I need to watch the handful of shows I enjoy.\n\nInstead to get access to shows I like reasonably quickly I need to frequent some ad-infested torrent crap hole to find the file. The alternative is wait for it to come on DVD which can be up to or beyond 9 months after the show has finished airing in the states.\n\nI would happily pay for hulu. I would happily buy advanced access for individual series. Maybe this advanced access fee could then become a vouc"}, {"id": "3479182", "author": "junto", "year": 2012, "thread": "Why I'm a Pirate", "text": "The regional licensing is the biggest barrier in my opinion. Germany is even worse than the UK and access to English speaking media is very difficult here. There are no legal outlets.\n\nFrustratingly I would happily pay to access US and UK TV shows in the same way that I pay for music via Spotify, but the media companies aren't interested in taking my money. They are too busy trying to sue us and censor the internet instead.\n\nBBC iPlayer Global is a joke. I have to navigate the Germany Apple Store (in German), sign up for a German iTunes account and my UK issued credit card is refused, even though the billing address held with the credit card company is correctly registered to my German addre"}, {"id": "35432480", "author": "Bluecobra", "year": 2023, "thread": "The Mullvad Browser", "text": "I also used some UK shell provider (via SOCKS proxy + Putty) in the past and it worked really well.  My guess is that there’s some there’s kind of threshold/concurrent connection that iPlayer looks at per IP address.\n\nIt’s pretty silly though, I would absolutely pay for a TV license if given the opportunity. Dear BBC: Shut up and take my money!"}], "key": "i28-Expats would pay for leg"}, {"name": "Musicians would pay for AI that generates harmonies they can reuse", "one_liner": "Draft: cluster not yet reviewed. Keywords: ai, musicians ai, musicians, music, generates, controllable", "draft": true, "verdict_score": null, "cluster": "ai, musicians ai, musicians, music", "category": "media & content", "signal_score": 17.62, "authors": 8, "years": [2022, 2023, 2024, 2026], "pay_signals": 7.5, "avg_intensity": 2.62, "mentions": 8, "problem": "Musicians want AI trained on their own unfinished project files to generate new material; Musicians would pay for AI tab, chord and lyric extraction with licensed output; Game and media makers want cheap AI voice acting with controllable emotion and custom voices; Music producers want controllable AI sample generation whose parameters can be fine-tuned after generation; Musicians would pay for AI that generates harmonies they can reuse; Music producers want AI in their DAW that generates variations and transitions from short ideas", "quotes": [{"id": "46606524", "author": "BrokrnAlgorithm", "year": 2026, "thread": "AI generated music barred from Bandcamp", "text": "I'm a musician, but am also pretty amused by this anti ai wave.\n\nThere was recently a post referencing aphex twin and old school idm and electronic music stuff and i can't help bein reminded how every new tech kit got always demonized until some group of artists came along and made it there own. Even if its just creative prompting, or perhaps custom trained models, someday someone will come along and make a genuine artistic viable piece of work using ai.\n\nI'd pay for some app which allows be to dump all my ableton files into, train some transformer on it, just to synthesize new stuff out of my unfinished body of work. It will happen and all lines will get blurred again, as usual."}, {"id": "41256012", "author": "tomcam", "year": 2024, "thread": "Show HN: Free Tools for Tabs, Chords, Lyrics Use 8 A100 GPUs", "text": "Mad props! So well executed. I would pay for this, especially if it were licensing the output (I think only lyrics would apply)."}, {"id": "41218155", "author": "Jensson", "year": 2024, "thread": "ChatGPT unexpectedly began speaking in a user's cloned voice during testing", "text": "> a voice assistant that starts making up its own prompts instead of listening to you is not a useful product\n\nThat would be way more useful than a voice assistant, with that you can replace voice actors for cheap! Many would pay good money for that product.\n\nThe important part is that you can ask it to do specific voice lines with specific feelings and voices. If it then starts to copy your voice lines afterwards that wont take from the fact that it generated the voice lines you wanted first. The censor that prevents it from using other voices prevents this use case."}, {"id": "39783429", "author": "chaosprint", "year": 2024, "thread": "Launch HN: Soundry AI (YC W24) – Music sample generator for music creators", "text": "Congratulations on your launch!\n\nI started music DRL (https://github.com/chaosprint/RaveForce) a few years ago. At that time, SOTA was still the \"traditional\" method of GANSynth.\n\nLater, I mainly turned to Glicol (https://glicol.org) and tried to combine it with RaveForce.\n\nThere are many kinds of music generation nowadays, such as Suno AI, but I think the biggest pain point is the lack of controllability. I mean, after generation, if you can't fine-tune the parameters, it's going to be really painful. As for pro, most of the generated results are still unusable. This is why I wanted to try DRL in the first place. Also worth checking\n\nhttps://forum.ircam.fr/projects/detail/rave-vst/\n\nIf this"}], "key": "i29-Musicians would pay for "}, {"name": "Listeners would pay for a music platform that guarantees human-made music", "one_liner": "Draft: cluster not yet reviewed. Keywords: listeners, music, listeners music, streaming, music streaming, music platform", "draft": true, "verdict_score": null, "cluster": "listeners, music, listeners music, streaming", "category": "media & content", "signal_score": 17.45, "authors": 9, "years": [2017, 2019, 2021, 2023, 2024, 2026], "pay_signals": 10.0, "avg_intensity": 2.3, "mentions": 10, "problem": "Listeners would pay for a music platform that guarantees human-made music; Listeners would pay for a cross-service metadata and playlist service with structured mood and instrument tags; Music collectors would pay for a metadata service that preserves tags, ratings and playlist history across sources; Listeners want an ad-free radio-style streaming service with real DJs curating live mixes; Listeners would pay for a music streaming service with a fast native desktop client; Listeners want a Spotify-like service for Creative Commons music that splits payment among artists", "quotes": [{"id": "47837579", "author": "devindotcom", "year": 2026, "thread": "Deezer says 44% of songs uploaded to its platform daily are AI-generated", "text": ">But that doesn't sound like something I'd want imposed on all music on a platform.\n\nthat's fine. there's room for multiple platforms. personally I would pay for the thing I describe, sounds like you wouldn't. but the question is not whether you or i would, but whether enough people would to make it a viable business - whether it's the platform, or the method, or a label that licenses its music in a certain way, or what."}, {"id": "34647355", "author": "raffraffraff", "year": 2023, "thread": "Show HN: I trained an AI model on 120M+ songs from iTunes", "text": "This is very true. I'd pay for a metadata-only / playlist service that works with Spotify/Tidal/Apple/local music.\n\nAnd don't allow free-text tags. Instead you give a list of available tags - the lowest number needed to describe most tracks. I mean, let people add their own if they want, but you should ignore those while training the model.\n\nI actually think that instead of trying to tag some specific mood (eg \"happy\") some sounds be a sliding scale between two opposites:\n\nhappy<-------|--->sad\n\nInstrument tags are easier to understand. Give a list of instruments (or instrument types, because the user might not know precisely which woodwind or percussion instrument it is) with checkboxes bes"}, {"id": "29748942", "author": "raffraffraff", "year": 2021, "thread": "Music Library and MusicBrainz Picard", "text": "I would pay for a music metadata service that stored tags, ratings and playlists. It wouldn't even have to provide music streaming at all, as long as it could integrate with YouTube, Spotify, Apple, Dropbox or local files. Something that treated a playlist with the same respect as an album, capturing creation date, comments, tags, author.\n\nIf I lost my whole music collection tomorrow, I could recover the actual tracks from Bandcamp/7Digital/rip etc. But my custom tags and ratings that I use to generate playlists, and the history of saved playlists found back over 15 years, would be impossible to recover."}, {"id": "41038392", "author": "tracker1", "year": 2024, "thread": "So you think you know box shadows?", "text": "I feel very similarly... I have YTM mostly because I don't like ads on Youtube and found out creators get more from YT subscribers than from the ads.\n\nI have the UX of the player though... the android TV experience is even worse, it's nearly impossible to use effectively now.\n\nI miss DJs, at least I miss good DJs... there are a few stations locally that I like what the DJs will mix and play, but there's sooo many commercials now.  I'd happily pay $10/month for an ad-free DJ run experience.  I mean, why the likes of XM, etc don't just have 50-100 DJs actually curate the music for the live experience."}], "key": "i30-Listeners would pay for "}, {"name": "Large Rust codebases suffer from slow compile times", "one_liner": "Draft: cluster not yet reviewed. Keywords: rust, rust developers, async, library, times, rust teams", "draft": true, "verdict_score": null, "cluster": "rust, rust developers, async, library", "category": "developer tools", "signal_score": 17.37, "authors": 11, "years": [2017, 2019, 2021, 2022, 2023, 2025], "pay_signals": 5.5, "avg_intensity": 2.73, "mentions": 11, "problem": "Large Rust codebases suffer from slow compile times; Large Rust codebases suffer from slow compile times; Rust developers lack a mature GUI library; Rust teams have huge rebuild times and target directories and want reusable cross-platform components; Rust startups struggle with async and threading ergonomics; Rust developers struggle with mixing async and blocking library code", "quotes": [{"id": "44398097", "author": "rtfeldman", "year": 2025, "thread": "Why is the Rust compiler so slow?", "text": "> Given Rust's numerous benefits, is having subpar compilation time really that big of a deal?\n\nAs someone who uses Rust as a daily driver at work at zed.dev (about 600K LoC of Rust), and Zig outside of work on roc-lang.org (which was about 300K LoC of Rust before we decided to rewrite it in Zig, in significant part because of Rust's compilation speed), yes - it is an absolutely huge deal.\n\nI like a lot of things about Rust, but its build times are my biggest pain point."}, {"id": "42938495", "author": "gregwebs", "year": 2025, "thread": "Roc rewrites the compiler in Zig", "text": "Go was built while waiting for C++ to compile- fast compilation was an implicit design goal.\n\nRust on the other hand didn’t prioritize compile times and ended up making design decisions that make faster compilation difficult to achieve. To me it’s the biggest pain point with Rust for a large code base and that seems to be the sentiment here as well."}, {"id": "37697388", "author": "raincole", "year": 2023, "thread": "Crux: Cross-platform app development in Rust", "text": "> UI libraries aside\n\nI mean the rest of your comment may be 100% correct but we could stop reading at this point. Obviously the biggest pain point of Rust GUI app development is UI library."}, {"id": "37058707", "author": "jeffparsons", "year": 2023, "thread": "PackagingCon – A conference only for software package management", "text": "I'm sure we can all agree that Cargo is the best thing since sliced arrays, but I've finally reached the point where we have enough different Rust projects at work that rebuilding the world from scratch all the time and having ~40 GiB `target/` directories scattered around the place is getting old.\n\nI'm not meaning to criticize Rust or Cargo here; they're both doing their jobs just fine. But I do find myself craving a different compromise for much of what I/we use Rust for today. And I'm really hoping that Wasm Components (and WASI) will be that different compromise — e.g.:\n\n- Don't rebuild an entire HTTP stack from scratch for every tool that happens to use HTTP.\n- Therefore most projects w"}], "key": "i31-Large Rust codebases suf"}, {"name": "Viewers would pay for DRM-free downloadable content they can keep", "one_liner": "Draft: cluster not yet reviewed. Keywords: drm, downloads, viewers, music, movie, drm music", "draft": true, "verdict_score": null, "cluster": "drm, downloads, viewers, music", "category": "media & content", "signal_score": 17.2, "authors": 8, "years": [2011, 2012, 2019, 2021, 2022, 2024], "pay_signals": 8.0, "avg_intensity": 3.38, "mentions": 8, "problem": "Music collectors would pay for legal, lossless, DRM-free music downloads; Viewers would pay a recurring fee to legally download DRM-free files of old and obscure movies and TV; Listeners would pay £30-40 a month for all-you-can-eat DRM-free downloads of all recorded music; Movie fans want to buy DRM-free high-quality movie downloads; Viewers would pay $5-10 per movie for DRM-free high-quality files; Viewers would pay for unencumbered DRM-free MKV downloads of shows", "quotes": [{"id": "26913845", "author": "lrvick", "year": 2021, "thread": "Apple is sued for telling you that you're “buying” movies", "text": "I literally bought many hundreds of used CDs and had them shipped to https://murfie.com/ to rip for me and give me FLACs automatically, because that was the only way to get lossless drm-free music I wanted legally.\n\nI even wrote a python library to automate the process since I had so much music I wanted to obtain legally that I needed bulk access.\n\nI spent thousands of dollars and many hours trying to play by the rules on this project.\n\nA: The artist got nothing. CDs were mostly used, and the artists are often no longer alive.\n\nB: Murfie went out of business and can't even afford to sort and return my discs to me. I can't prove I own my own music if challenged. It is all unsorted in a wareho"}, {"id": "3478957", "author": "yason", "year": 2012, "thread": "Why I'm a Pirate", "text": "I'm pretty much down to the same conclusion, personally.\n\nI'd happily pay a recurrent, if modest, sum of money for the ability to legally and easily download not only newer but, more importantly, older and more obscure movies and television series to my computer in the form of convenient unencumbered .avi|.mkv|.mp4 files, from a catalog whose selection and quality matches the level of service of the 2010's.\n\nIf MAFIAA offered that, with a credible promise that the material will be there ten years from now, I would not only pay for the content but not bother to stash a single file onto my external hard disk. Because of the high level of sophistication when it comes to the selection, quality, "}, {"id": "2446626", "author": "swombat", "year": 2011, "thread": "Crunch Time for Spotify", "text": "I don't find that a service for simply listening to the radio is worth paying for on a monthly basis. If I can't download it and listen to it whenever I want and wherever I want, it's not mine, and it's worth paying for.\n\nI would happily pay a significant amount of money every month (say about £30-40) for an all-you-can-eat buffet of DRM-free downloads covering all the released music (since the beginning of recorded music) by all the major labels.\n\nThis would translate into some £480 of income from me for the recording industry, versus £0 at the moment. I'm pretty sure I'm not alone. I wonder how much money they're leaving on the table by offering inadequate products like Spotify."}, {"id": "42538296", "author": "orobinson", "year": 2024, "thread": "Piracy in the UK: the failed war on illegal content", "text": "When will the movie industry learn from the success of services like Spotify or DRM free music services like Bandcamp? I want media I can own, or consume from a single subscription. I would happily pay a few quid for a movie if I could download a high quality DRM free file. Piracy is not only free but provides a better product, a file you can do whatever you want with and watch anywhere.\n\nPersonally I don’t pirate, I prefer getting second hand physical media (funnily enough the movie studios miss out on any money there as well)."}], "key": "i32-Viewers would pay for DR"}, {"name": "Teams struggle to maintain AI-heavy codebases manually because AI output is churny and hard to read", "one_liner": "Draft: cluster not yet reviewed. Keywords: ai, teams, teams ai, output, tests, surface", "draft": true, "verdict_score": null, "cluster": "ai, teams, teams ai, output", "category": "developer tools", "signal_score": 17.08, "authors": 7, "years": [2025, 2026], "pay_signals": 4.5, "avg_intensity": 3.71, "mentions": 7, "problem": "Teams struggle to maintain AI-heavy codebases manually because AI output is churny and hard to read; Reviewing AI-written tests is a bottleneck; teams need hermetic environments that record browser and API interactions for visual verification; SRE teams need AI incident agents that surface competing hypotheses rather than confident wrong diagnoses; Team coordination meetings produce noisy, unactionable output; teams need async AI interviews that surface blockers and decisions privately; Teams want AI-generated integration tests that verify real database and external system effects, not mocked unit tests; Teams want AI writing output that sounds like normal English instead of recognizable AI phrasing in tickets and PRs", "quotes": [{"id": "50087458", "author": "jackling", "year": 2026, "thread": "Recreational Programming", "text": "It's actually worse than that. In a repo where there is a heavy amount of AI code, it becomes impossible to manually write code. The AI code favors obtuse, unmaintainable mess (from the standpoint of a non-AI dev). Constantly overwriting your changes, large comments, hacky logic, overly-defensive programming, misunderstandings that the LLM made that cause you to waste hours debugging.\n\nI've come to the realization that AI code bases are effectively AI-only code bases, unless one is using AI as just a code-autocomplete, then that seems mostly fine. But most devs are using it as an end2end implementation tool, having it 1-shot full features, and then iterating on them with the agent afterwards"}, {"id": "49394427", "author": "fabianlindfors", "year": 2026, "thread": "Building an (almost) fully self-hosted, sandboxed, agentic software factory", "text": "Agreed, we had agents writing standard integration/unit/e2e tests but turned out to be a ton of work reviewing just that and hard to wrap one’s head around as a developer.\n\nWe ended up building our own test platform to reduce the human bottleneck in the verification loop.\n\nTakes the form of a hermetic test environment that run all our code and infra in a way that matches production. Our tests interact with it from the ”outside”, e.g. by driving a browser, a terminal or making API calls.\n\nWe still have coding agents writing those tests but the big difference is that we record the browser and the API calls and can review and verify through a UI without having to do any manual testing. It also "}, {"id": "49192345", "author": "IgorVoytyuk", "year": 2026, "thread": "Launch HN: HyperProbe (YC S26) – Agents that do read-only debugging in prod", "text": "Read-only in prod is the right constraint. The failure mode I'd most want to hear how you handle isn't a missing signal — it's a confident wrong diagnosis.\n\nRunning an autonomous pipeline for eight months, the three incidents that cost me the most days all had the surface error naming the wrong subsystem:\n\n- \"x264: malloc of size N failed / incorrect parameters\" — I read it as a codec or bad-args bug and went looking there. It was RAM exhaustion. The encoder was the victim, not the cause.\n\n- A 22x slowdown in an LLM step that was indistinguishable from a hang. It was swap: the model no longer fit in RAM, and the page file did the rest.\n\n- A 27-minute \"freeze\" in a background job. The process"}, {"id": "48221856", "author": "elliot952", "year": 2026, "thread": "Show HN: AI that interviews participants instead of holding another meeting", "text": "While working on another startup, the coordination meetings were killing us. The information coming out of them was disjointed, nothing was actionable, and the same topics resurfaced every week.\n\nWe realized group meetings create the same distortions every time:\n• Loudest voices dominate the conversation.\n• Team members often self-censor.\n• There’s internal pressure to align.\n• Critical blockers stay private because surfacing them feels uncomfortable.\n\nThe current batch of AI tools treat these issues as a transcription problem. But a bad meeting with lots of noise just produces a bad transcript with lots of noise, and there’s nothing AI can do about that.\n\nSo, we built an internal tool for o"}], "key": "i33-Teams struggle to mainta"}, {"name": "Developers would pay for a git GUI to split commits by dragging files and hunks between commits", "one_liner": "Draft: cluster not yet reviewed. Keywords: git, git gui, gui, commits, developers, time", "draft": true, "verdict_score": null, "cluster": "git, git gui, gui, commits", "category": "developer tools", "signal_score": 16.86, "authors": 7, "years": [2013, 2020, 2022, 2023, 2024, 2026], "pay_signals": 6.5, "avg_intensity": 2.71, "mentions": 7, "problem": "Developers would pay for a fast standalone git GUI with a diff view as good as IntelliJ's; Developers would pay for a git GUI to split commits by dragging files and hunks between commits; VS Code users would pay for a Magit-quality git interface; Companies would pay for visual file-version comparison that integrates with git; eed chargers, it shouldn't cost much since basically there's a good power source right the"}, {"id": "12605876", "author": "chadgeidel", "year": 2016, "thread": "It May Not Cost You More to Drive Home in a Climate-Friendly Car", "text": "This is the biggest issue for me. I would happily pay for any metered electricity to a parking spot in my apartment complex, but the managers aren't interested. And my building was built in 2014!"}, {"id": "41584090", "author": "LargeWu", "year": 2024, "thread": "GM electric vehicles can now access Tesla Superchargers", "text": "As a non-Tesla EV owner, I would happily pay surcharges for charging on Tesla's network if it meant I could reliably use my vehicle on extended trips out of town. Tesla charging network has a very good reputation for reliability, which is a primary concern if I'm traveling on the highway. It's not something I do often, so paying a premium once in a while to use my EV instead of my ICE vehicle seems like a decent tradeoff."}, {"id": "38956275", "author": "ado__dev", "year": 2024, "thread": "Hertz to sell 20k EVs in shift back to gas-powered cars", "text": "I have had an EV since 2018, love it to death, but would absolutley never rent one. The biggest pain point with EVs imo is charging infrastructure. My personal car, I can charge at home so it becomes a non-issue.\n\nBut if I'm traveling to a new city that I'm not super familiar with, I do not have any desire to plot out where charging stations are, is the hotel going to have charging, is it going to be operational, etc. Too much headache and cost of public chargers on top of premium cost to rent an EV just doesn't make much sense."}], "key": "i39-Apartment EV owners woul"}, {"name": "Privacy users would pay for affordable private email that accepts anonymous payment", "one_liner": "Draft: cluster not yet reviewed. Keywords: email, privacy, domain, privacy focused, focused, private", "draft": true, "verdict_score": null, "cluster": "email, privacy, domain, privacy focused", "category": "communication & social", "signal_score": 16.42, "authors": 7, "years": [2012, 2020, 2022, 2024, 2026], "pay_signals": 6.5, "avg_intensity": 2.57, "mentions": 7, "problem": "Users would pay for a privacy-focused branded email provider; Privacy users would pay for affordable private email that accepts anonymous payment; Individuals want cheap email on their own domain without paying for business plans; Users would pay $50 a year for private, convenient email on custom domains; Low-income users want affordable privacy-focused email; Users would pay for temp email bundled with a throwaway domain", "quotes": [{"id": "39304147", "author": "AdmiralAsshat", "year": 2024, "thread": "Mozilla names new CEO as it pivots to data privacy", "text": "Still waiting for a Mozilla-branded email domain/provider. They've already got their Mozilla-branded partnerships with the VPN and now the data scrubber. Not sure why they're sleeping on email. That seems like an obvious thing that I would pay for."}, {"id": "31523376", "author": "cowtools", "year": 2022, "thread": "Proton is trying to become Google without your data", "text": "I mean, they are legally obligated to. At least they are not selling my data to advertisers or arbitrarily locking me out of my account like google. Hell, i'd pay for their premium service if wasn't so expensive and they accepted anonymous payments through monero or something.\n\nI mean, this is what email has basically come to. I've tried to host my own email server, all my outbound mail ends up in spam. If you want privacy, use PGP\n\nEdit: please don't downvote this parent comment, I think it is still a pretty reasonable concern"}, {"id": "4885903", "author": "bad_user", "year": 2012, "thread": "Google Apps stops accepting free sign-ups", "text": "I use Google Apps because I want to use GMail, but with my own domain. That's it.\n\nI'm not an enterprise. I don't need more support than regular GMail users. I don't have special need liances; Smart home owners are angry that devices lose support and must be replaced; Homeowners lack a universal smart home standard that works across appliances for decades; Smart thermostat owners want local APIs and open firmware for home automation integration; Homeowners want API access to their communicating HVAC thermostats; Homeowners would pay for help choosing smart home devices compatible with their existing setup", "quotes": [{"id": "49831218", "author": "steveBK123", "year": 2026, "thread": "Owners mourn spoiled food after firmware update bricks Samsung smart fridges", "text": "There is SO much of this in IoT / smart / 2010s-2020s tech.\n\nRecent household BS:  music playing out of my thermostat.\n\nWife tried playing music out of Sonos, but the clunky app was laggy and had also signed her out of Spotify.  No problem, you can also just play direct from Spotify app into Sonos speakers.  She opens Spotify, selects \"Living Room\" and next thing you know our THERMOSTAT was playing music.\n\nNeither of us know this was possible, neither of us enabled it, apparently it's existed for years but for some reason Saturday was the day that \"Living Room\" thermostat beat out \"Living Room\" Sonos in the Spotify sort order.\n\nThere were product managers on both sides of that decision to pr"}, {"id": "45146097", "author": "xutopia", "year": 2025, "thread": "Nest 1st gen and 2nd gen thermostats no longer supported from Oct 25", "text": "This pisses me off to no end.  I paid a lot... I expected my Nest gear to work for as long as I own my house.  I paid extra to get someone to install it with my home system.  Now I see that my Nest Protect is saying it needs to be changed... not some small module... the whole thing.  Next will be my thermostats... I can't understand why I'd pay for them again."}, {"id": "18052618", "author": "GuB-42", "year": 2018, "thread": "Amazon pulled an Apple on the smart home", "text": "They didn't address the biggest \"pain point\" of \"smart  payment that removes ads everywhere they browse; Users want to pay for an ad-free internet, with revenue split to sites as ads do now; Users would pay for a premium tier that removes clutter and ads across all Google products including Maps; Users would pay for an ad-free Google premium across services; Viewers would pay to remove ads from shows that are only offered with ads; Users would pay for a privacy-first premium that strips ads across the internet", "quotes": [{"id": "37282177", "author": "danbruc", "year": 2023, "thread": "Block YouTube ads on AppleTV by decrypting and stripping ads from Profobuf", "text": "Watching ads pays for nothing, buying stuff where the price includes a fraction of the ad budget of the company pays. Even when I am blocking ads, I still buy stuff, I still contribute to ad budgets, my money still gets spend on some ad campaign and ends up in the hands of some creator or whatever. At worst I will somewhat skew the way the money gets distribute by blocking ads, but that is something I am willing to accept in order to not get distracted, annoyed and tracked.\n\nIf possible, I would happily pay a reasonable amount every month to get rid of all ads everywhere even though I would essentially be paying twice, ones with the monthly payment and I would still pay for part of the ad bu"}, {"id": "35100969", "author": "sliken", "year": 2023, "thread": "GPT 4 coming next week", "text": "I've always wished I could have an ad free internet experience, I'd happily pay whatever revenue the ads would have generated.\n\nWould it be terrible is GPT replaced ads with subscriptions?  Of course they'd have to split the income with the sites they get the info from.  Much how ads on a website make the ad network and the site owner money."}, {"id": "31376916", "author": "bluenose69", "year": 2022, "thread": "Ask HN: Why is Google Premium not a thing?", "text": "I'd pay for this, if it also applied to other google products.  In particular, google maps has become unpleasant to use lately, with a lot of extra stuff drawn on top of the actual map. I've switched to apple maps, for this reason.  I wonder how many others have done the same."}, {"id": "30922993", "author": "superasn", "year": 2022, "thread": "The next Google", "text": "I know your comment is tongue-in-cheek but I happily pay for Youtube premium and it's truly an amazing experience compared to the ad-ridden non-usable free Youtube. If Google created a similar Google premium where it had such features and no pesky ads I'd pay for it in a heartbeat."}], "key": "i42-Users would pay for a pr"}, {"name": "Users would pay for a password manager to ensure it stays around", "one_liner": "Draft: cluster not yet reviewed. Keywords: password, password manager, manager, 24, ensure, stays", "draft": true, "verdict_score": null, "cluster": "password, password manager, manager, 24", "category": "security & privacy", "signal_score": 16.09, "authors": 7, "years": [2010, 2015, 2018, 2022, 2023, 2026], "pay_signals": 7.0, "avg_intensity": 2.86, "mentions": 7, "problem": "Password manager users want a simple, stable product without feature bloat and price hikes; Users would pay a password manager that warrants and indemnifies against breaches; Password manager users want easy self-hosting to reduce central breach risk while still paying the vendor; Users would pay $5 a month for a password manager that keeps local vaults without forced cloud; Users would pay $24 a year for a password manager with sharing; Users would pay $5 a month for secure password and bookmark sync across browsers", "quotes": [{"id": "47141375", "author": "aed", "year": 2026, "thread": "1Password pricing increasing up to 33% in March", "text": "I'm a 15+ year user of 1password and have been telling myself to move off of it for like 5 years now. It ain't the price... $72 is really fine for good software that just works.\n\nBut as mentioned throughout the thread it's really just too much. My goodness they really could have a nice, profitable, business with simple software. I'd happily pay $10/month for the version of 1password from 15 years ago! It's just all too much."}, {"id": "37448515", "author": "jrm4", "year": 2023, "thread": "Experts fear crooks are cracking keys stolen in LastPass breach", "text": "Right, and instead of companies promising safety they can't deliver, it would be better to just be honest about the fact that it is hard.\n\nAnd again, to take it a level further -- I would absolutely use a company's software under one, and only one condition -- indemnity/warranty.\n\nAny company that is willing to go \"If you get breached, we will pay for the harm\" can absolutely take my money."}, {"id": "34151106", "author": "hcurtiss", "year": 2022, "thread": "What’s in a PR statement: LastPass breach explained", "text": "Yeah, I’m definitely not trained in security like the password manager engineers are. But I keep wondering if being distributed offsets that risk. That is, I can spin up Bitwarden in my Unraid machine  in like five minutes and behind a reverse proxy, nobody even knows it’s there to attack. Maybe I have some security vulnerability, but it seems significantly less likely to be tested than a centralized commercial service. Curious if others have thoughts. I’d happily pay Bitwarden for whatever."}, {"id": "16052666", "author": "nucleardog", "year": 2018, "thread": "Ask HN: Does anyone use an alternative to a password manager?", "text": "I totally understand why they need/want to change their pricing model, and support it even. I don't understand why they've bundled a change in the product along with it and that's what I take issue with.\n\nI'd happily pay them $5/mo to continue using their product as I've been using it - with local vaults, not with their cloud product.\n\nI won't take their product for free if it comes with a forced \"upgrade\" to the cloud service."}], "key": "i43-Users would pay for a pa"}, {"name": "Users want an all-in-one desktop with high-end chips and lots of RAM for home AI compute", "one_liner": "Draft: cluster not yet reviewed. Keywords: hardware, switching, desktop, gpu, home, fast", "draft": true, "verdict_score": null, "cluster": "hardware, switching, desktop, gpu", "category": "hardware & IoT", "signal_score": 15.8, "authors": 6, "years": [2018, 2023, 2024, 2026], "pay_signals": 5.5, "avg_intensity": 2.33, "mentions": 6, "problem": "Developers want an out-of-the-box local ML/AI workstation without GPU hassle; Homelab users want a low-idle-power home server that switches a GPU on for gaming and has AV1 encoding; Users want an all-in-one desktop with high-end chips and lots of RAM for home AI compute; Multi-computer users want a hardware device for fast switching of keyboard and mouse between desktops; Buyers want preassembled hardware for fast desktop switching; Home lab users want open-hardware rackmount PCs designed for living-room AV cabinets", "quotes": [{"id": "47538201", "author": "ks2048", "year": 2026, "thread": "Apple discontinues the Mac Pro", "text": "With the popularity of mac mini (and macbooks for that matter) for doing ML/AI work, I would have thought Apple could make a Mac Pro that could make for a good workstation for doing in-house ML/AI stuff.\n\nI bought a GPU maybe a decade ago for this, and it's not worth the hassle (for me at least), but a nice out-of-the box solution, I would pay for."}, {"id": "41886650", "author": "wernerb", "year": 2024, "thread": "4K Gaming on Raspberry Pi [video]", "text": "I am looking for a low power at idle (5-10 watts) server that could activate/deactivate gpu at will as a GPU takes a lot of extra watts at idle. The use case is that the server keeps running for NAS/home server stuff and can activate a gui environment at will (Wayland seat) for gaming. Bonus points for the software able to handle multiple people (seats) for small desktop use cases. \nA small ARM SBC makes sense. Give me hardware encoding for AV1 and take my money."}, {"id": "50262077", "author": "stego-tech", "year": 2026, "thread": "New iMac with M6", "text": "The iMac continues to be an aesthetically pleasing machine I sorely want for my space, yet one I cannot justify because of its anemic innards relative to my desired use cases.\n\nIt’s just a really good looking computer, especially with the accessories. Give me one with an M6 Pro and a 128GB memory cap, and they can take my money as I move my homelab and AI compute onto it."}, {"id": "38789426", "author": "55555", "year": 2023, "thread": "DeskHop – Fast Desktop Switching", "text": "If anyone wants to team up to commercialize this, I would pay for and handle the plastic injection molding and marketing and at-scale assembly and other things as needed. Email in bio."}], "key": "i44-Users want an all-in-one"}, {"name": "Viewers would pay for shows that are not released in their region", "one_liner": "Draft: cluster not yet reviewed. Keywords: viewers, shows, cable, episode, released, films", "draft": true, "verdict_score": null, "cluster": "viewers, shows, cable, episode", "category": "media & content", "signal_score": 15.57, "authors": 6, "years": [2010, 2013, 2014, 2019, 2022, 2026], "pay_signals": 6.0, "avg_intensity": 3.0, "mentions": 6, "problem": "Viewers would pay for films that are not available legally anywhere; Viewers would pay for access to film back catalogs locked away by streaming monopolies; Viewers would pay for shows that are not released in their region; Viewers would pay for individual channels or shows on release day without cable bundles; Viewers would pay a reasonable price for standalone HBO-style shows without cable; Viewers would pay a pound or two per TV episode without ads", "quotes": [{"id": "48359161", "author": "blablabla123", "year": 2026, "thread": "The Pirate Bay Remains Resilient, 20 Years After the Raid", "text": "It's very strange to think about this in the current context. Anything P2P used to be the Anti Christ of the Software Industry. The lengths Microsoft and game vendors went to prevent copying is insane. Installing Windows as well as various Higher End software is a huge pain because of this.\n\nOn the other hand Microsoft is very much leading with OpenAI in vacuuming any content, stripping effectively copyright claims.\n\nThat being said, nowadays the only use case for me to use Pirate Bay is when I cannot get a movie elsewhere. I'd pay for it but it's not possible - because of copyright..."}, {"id": "32554850", "author": "hedora", "year": 2022, "thread": "Why does everything on Netflix look like that?", "text": "Yeah; it took about 5 minutes for me to go from initial sign up, to realizing the Miramax catalog is completely missing from Disney+, to deciding to cancel it ASAP.\n\nThe Mandalorian was OK, I guess, but meh.  Also, they're censoring the back catalog in offensive ways (Daryl Hannah's disturbing case of carpet butt comes to mind.)\n\nAnyway, I'd pay for access to the back catalog they bought monopoly rights to.  Since it's not for sale, my money is going elsewhere.\n\n(Edit: had the wrong actress...)"}, {"id": "21682351", "author": "v7p1Qbt1im", "year": 2019, "thread": "It’s not a zero-sum game for Apple TV+, Netflix, and Disney+", "text": "I can only speak for myself. But I, and I believe many others, actually prefer a subscription. To be fair. I probably watch more content than the average person. So for me it‘s absolutely worth it. I know and used pretty much every modern pirating technique known to man. While you can get incredibly sophisticated with automation and ease of use. It‘s still not as easy or convenient as Netflix for example.\n\nAlso, no Dolby Vision in piracy atm.\n\nObviously cost is a factor. But more important for me is ease of access and best possible quality. Let‘s take Disney+. In my market it‘s not available yet. I will absolutely pirate The Mandalorian. The fact that it would surprise anyone that it would b"}, {"id": "7663003", "author": "the_watcher", "year": 2014, "thread": "Netflix and Hulu are Not Killing Cable", "text": "Like I said, I'd prefer to pay for what I consume.  I'm not ok with paying cable companies extortionate fees simply because they were able to develop a semi-monopoly on content distribution while they provide painfully poor service and actively work to avoid adapting to the fact that the internet has drastically reduced distribution costs.  Shows that are available one day later on Amazon/Hulu or the like, I wait a day and purchase, so it's actually a lot more uncommon than you think that I pirate shows (that said, I'd pay more in some cases to be able to purchase the show when it airs - for events like Breaking Bad).  HBOGo, WatchESPN, Showtime anywhere - they built a system that allows sha"}], "key": "i45-Viewers would pay for sh"}, {"name": "Readers want a personal front-end that aggregates blogs and news", "one_liner": "Draft: cluster not yet reviewed. Keywords: news, readers, blogs, feed, quality, aggregates", "draft": true, "verdict_score": null, "cluster": "news, readers, blogs, feed", "category": "media & content", "signal_score": 15.51, "authors": 7, "years": [2019, 2020, 2023, 2024], "pay_signals": 6.5, "avg_intensity": 3.0, "mentions": 7, "problem": "Readers want a hierarchical news digest by period, region and domain with quality sources across the spectrum; People want curated local news and event listings aggregated in digital feeds; Readers want news sites automatically parsed and delivered to their Kindle without writing scrapers; Readers want a factual, non-sensational, personalized news feed; Users want a feed of witty, intelligent blogs and sceptical news, like the early web; Readers want a blog platform with quality recommendations and search with time filtering", "quotes": [{"id": "23987926", "author": "the_duke", "year": 2020, "thread": "TheirTube – How do the recommended videos look on their Youtube home page?", "text": "With all our media resources and technology, it's crazy that there is no easy way to answer questions like \"what happened politically in France in the last month?\",  \"what were the economic developments in Africa in the last quarter?\" or \"what were the biggest battery technology advances in the last year?\".\n\nWith the barrage of news it is very easy to miss a lot, especially if you want to keep up with multiple domains and geographical regions.\n\nI would love some  hierarchical listing  that shows the most important news items for different time periods (week,  month, quarter, year), and filterable by domain (eg business, economy, politics, science, technology, ...).\n\nOne should be able to  co"}, {"id": "41964788", "author": "jll29", "year": 2024, "thread": "Inside the Transport for London cyberattack", "text": "Are people really no longer interested in what happens locally?\n\nI would pay for local news, even about places that I no longer live, but used to live and still have a passing interest in. But perhaps I would want to receive it as XML feed.\n\nEven events (concerts, readings, exhibitions, screenings etc.) are typically scattered across many smaller lists or mailing lists, depending on location. For example, there is way more going on in London than what is listed by Time Out:\nhttps://www.timeout.com/london/things-to-do/london-events-in...\nLocal communities may have their own sites or still rely on paper flyers.\n\nSome facts of communal interest are published in government outlets that are still"}, {"id": "23749341", "author": "foofoo4u", "year": 2020, "thread": "I Got My Attention Back (2017)", "text": "This looks terrific. It seems to be exactly the service I have been looking for. I too found myself easily distracted and addicted to my phone when browsing the news. To help combat my addiction, I wrote a script that'll parse my favorite news websites and email them to my Kindle. It's been \"life transforming\". I can now read my news addiction and distraction free. Plus, I have always preferred reading walls of text on an e-ink display, especially before going to bed. The only downside of my approach is that it takes a lot of time to write my scripts. Every website is different and some websites don't provide APIs. For example, the WSJ provides no APIs to consume their content even as a payi"}, {"id": "21680485", "author": "mikedilger", "year": 2019, "thread": "Sham news sites make big bucks from fake views", "text": "I'm sorry to hear about your situation. But the issue in journalism that I hear most often isn't about the quality of writing, it's about the editorial decisions, the choice of what to write about and how to spin it, and the lack of sufficient fact checking and investigation.  I think the writing skills are fine.  In fact I'd prefer that the writing skills went down a notch: I'd rather have someone just give me a dull list of facts.\n\nI'd happily pay for a newsfeed that had only stories that I found relevant, factual and matter-of-fact rather than vapid, sensational, emotional and/or manipulative.  One more story about something Trump tweeted or something about a Kardashian and I swear I'm go"}], "key": "i46-Readers want a personal "}, {"name": "People would pay $2-3 a month for an app that reliably makes their photos look great", "one_liner": "Draft: cluster not yet reviewed. Keywords: photos, art, organization, look, cameras, smartphone", "draft": true, "verdict_score": null, "cluster": "photos, art, organization, look", "category": "media & content", "signal_score": 15.51, "authors": 6, "years": [2016, 2017, 2020, 2022, 2024, 2025], "pay_signals": 6.0, "avg_intensity": 2.33, "mentions": 6, "problem": "Photographers would pay for an app that applies accurate depth-based bokeh to existing photos; Camera owners want good smartphone apps for their cameras and would pay a subscription; Users would pay good money to upload images, label some, and have ML classify the rest; People would pay $2-3 a month for an app that reliably makes their photos look great; Users would pay a few dollars a month for photo organization and reminiscing features; Users would pay for a phone app that makes geometric art wallpapers from photos", "quotes": [{"id": "44185065", "author": "willseth", "year": 2025, "thread": "The iPhone 15 Pro’s Depth Maps", "text": "If it's all done in post anyway, then it might be a lot simpler to skip building a whole camera app and just give people a way to apply more accurate bokeh to existing photos. I would pay for that."}, {"id": "30796128", "author": "lowbloodsugar", "year": 2022, "thread": "Using FujiFilm SDK on a Camera Voids Its Warranty", "text": "I would happily pay a subscription for an iOS app. The usual argument against this is being commodified, but for the vast majority of the market, Canon has already been commodified in the shape of Apple and Samsung phones. They have to compete now on how good their hardware is, but their \"stupid\" hardware doesn't cut it without smart software. Their time in the broader marketplace is gone. They can get a small amount of marketshare back if they can make their hardware work with iPhones and Galaxies. Possibly just iPhones.\n\nI've got the cash for a great canon camera. I used to carry one around with me all the time. The size isn't what's stopping me. It's the UX."}, {"id": "15338780", "author": "Kiro", "year": 2017, "thread": "TensorFlow Examples for Beginners with Latest APIs", "text": "I would pay good money for a service where I upload a folder of images, gets an interface where I can classify each image one by one and then let ML classify the rest. Does this exist?"}, {"id": "41260235", "author": "uptownfunk", "year": 2024, "thread": "Ask HN: Do you struggle taking good pics?", "text": "Like if it really worked and made my wife go wow that’s a good photo, I would pay for it, probably 1.99-2.99 a month, or maybe 19.99 one time."}], "key": "i47-People would pay $2-3 a "}, {"name": "Users would pay for tools that block AI agents from contacting them and filter AI slop", "one_liner": "Draft: cluster not yet reviewed. Keywords: ai, content, slop, generation, exclude, text", "draft": true, "verdict_score": null, "cluster": "ai, content, slop, generation", "category": "AI & ML tooling", "signal_score": 15.41, "authors": 6, "years": [2023, 2026], "pay_signals": 6.0, "avg_intensity": 2.67, "mentions": 6, "problem": "Scrapers and AI crawlers want to pay sites directly for content access instead of fighting captchas; Users would pay for a tool that filters AI-generated slop from their feeds; Users would pay for tools that block AI agents from contacting them and filter AI slop; Users would pay for web browsing and forums that exclude all AI content; Users would pay for an offline Wikipedia snapshot from before AI-written content; Users would pay for AI text generation without watermarking", "quotes": [{"id": "48751187", "author": "xur17", "year": 2026, "thread": "Monetization Gateway: Charge for any resource behind Cloudflare via x402", "text": "Agreed. To me this feels like the perfect solution for websites and ai crawlers. Instead of having crawlers paying proxy services and captcha solvers, they can pay the website itself. As a web scraper, I'd happily pay the website provider to get access if it meant easy access to the content. Heck, as a human, I'd pay to avoid the dumb captchas."}, {"id": "48628604", "author": "scotty79", "year": 2026, "thread": "Don’t use AI to write things that you present as your own work", "text": "Oh no. Comfort. How will we ever suffer it!\n\nI don't like lies. So I won't be optimizing for lies. But I also don't like garbage. So I'll be optimizing for filtering it out. Even if the source of garbage are genuine humans.\n\nI had a suspicion some time ago that this craving for genuine has masochistic foundations. You just provided me with another point in the pointcloud, I'm trying to infer the shape of reality out of.\n\n> Hell I would pay for a tool right now to filter ai slop from the leted a $125B pension fund's account", "text": "there needs to be some automated backup option to periodically dump your whole G.suite data to some non-Google service... I'd pay for it."}, {"id": "40476019", "author": "yalok", "year": 2024, "thread": "Sharing details on a recent incident impacting one of our customers", "text": "I would add one more -\n\n4. Add an option to auto-backup all the data from the account to the outside backup service of users choice.\n\nThis would help not just with these kind of accidents, but also any kind of data corruption/availability issues.\n\nI would pay for this even for my personal gmail account."}, {"id": "37244425", "author": "dave_walko", "year": 2023, "thread": "Backblaze Product and Pricing Updates", "text": "Not me.... This is a 30+% increase for my 2 year plan.  I have no need for the \"extra\" things.  If I wanted them, I would pay for them.  I now have til April to find another solution for 1 pc and about 7tb.  Worst case, I will just buy an external and ship the drive to my parents.  Use my Synology for local backup, and then the offsite drive.  Not ideal but better than this increase.\n\nNot to mention how BB is handling the pushback of the price increase by gaslighting their users."}, {"id": "9160803", "author": "ricardobeat", "year": 2015, "thread": "Backblaze Storage Pod 4.5 – Tweaking a Proven Design", "text": "I really enjoy these posts, and would be a happy Backblaze customer if they didn't have this (unpublicized) policy of deleting external hard-drive backups after 30 days:\n\n    Backblaze works best if you leave the external hard drive attached to\n    your computer all the time. [...] If the drive is detached for more\n    than 30 days, Backblaze interprets this as data that has been\n    permanently deleted and securely deletes the copy from the\n    Backblaze datacenter.\n\nThis probably reduces the total amount of storage used, making the $5/month economically viable. I'd happily pay more if it weren't for this though, currently paying ~$12/month for Bitcasa."}], "key": "i49-Users would pay more for"}, {"name": "Users would pay for search as good as old Google", "one_liner": "Draft: cluster not yet reviewed. Keywords: search, google, search engine, engine, 2010, researchers search", "draft": true, "verdict_score": null, "cluster": "search, google, search engine, engine", "category": "consumer & home", "signal_score": 15.27, "authors": 6, "years": [2020, 2021, 2022, 2023, 2024], "pay_signals": 6.0, "avg_intensity": 3.0, "mentions": 6, "problem": "Searchers want a search engine that works as well as Google did around 2010; Users would pay for search as good as old Google; Researchers would pay for search with Google-circa-2010 result quality; Users would pay for a search engine like Google a decade ago; Researchers would pay for a search engine that filters out big names and explores the long tail by date; Search engine builders would pay for modern in-depth write-ups on building search indexes", "quotes": [{"id": "34712376", "author": "vanilla_nut", "year": 2023, "thread": "Google stock tumbles 8% after its Bard AI ad shows inaccurate answer", "text": "Ironically Google's search engine was fine up until 2015 or so, when they started to prioritize AI in their search algos. Now, of course, it's a sea of useless SEO spam. It's hard to say if their priorities are wrong, or if they're just losing the arms race against spam. Still, I would pay good money for a search engine as functional as Google in say, 2010."}, {"id": "42339753", "author": "newsclues", "year": 2024, "thread": "Kagi Teams", "text": "google was better years ago.  Google search quality regressed.  id pay for the old google search."}, {"id": "34568560", "author": "marymkearney", "year": 2023, "thread": "Ask HN: Do you use “next-gen” search engines?", "text": "Neeva FTW.\n\nResult quality: high to excellent, including image search. Feels like searching on Google circa 2010, in a good way. I haven't \"personalized\" it, and it still works fine.\n\nCost: Zero so far. Figured I'd hit my search limit early and have to pay, but that hasn't happened. On a heavy research day I can easily do 50 to 150 searches. Neeva seems fine with that. At this point I like it so much, I'd pay for it.\n\nProduct choice: Saw it on HN. :) HTH"}, {"id": "26115498", "author": "Nextgrid", "year": 2021, "thread": "EU privacy agency urges more safeguards to curb U.S. tech giants", "text": "I'd happily pay that for a search engine equivalent to what Google was a decade ago."}], "key": "i50-Users would pay for sear"}, {"name": "Riders would pay a premium to avoid drivers who refuse, cancel or get lost", "one_liner": "Draft: cluster not yet reviewed. Keywords: riders, ride, riders premium, reliable, drivers, premium", "draft": true, "verdict_score": null, "cluster": "riders, ride, riders premium, reliable", "category": "travel & local", "signal_score": 15.24, "authors": 6, "years": [2016, 2021, 2023, 2025], "pay_signals": 6.0, "avg_intensity": 2.67, "mentions": 6, "problem": "Riders in outlying areas suffer repeated driver cancellations and would pay more for guaranteed pickups; Riders would pay a premium to avoid drivers who refuse, cancel or get lost; Riders would pay 2x for a ride service with vetted, reliable employee drivers; Riders would pay extra for rides without tipping and rating pressure; Riders would pay a premium for a reliable black-car ride service; Riders would pay a little more for fairly compensated ride-hailing", "quotes": [{"id": "27268804", "author": "xiphias2", "year": 2021, "thread": "Uber's crazy YOLO app rewrite, from the front seat", "text": "Sure, I understand, it's a relationship that is still quite good, so if you are young, healthy and can manage the stress, it's probably not a problem.\n\nI have another question though that's somewhat unrelated: I use Uber quite often in latin america when I'm travelling, and my main issue is driver cancellations after 10-30 minutes of olumn, software, readers reader", "draft": true, "verdict_score": null, "cluster": "readers, pdfs, reader, column", "category": "media & content", "signal_score": 15.2, "authors": 6, "years": [2012, 2013, 2020, 2022, 2023, 2026], "pay_signals": 5.5, "avg_intensity": 2.17, "mentions": 6, "problem": "Readers want a large tabloid-size or folding dual e-ink reader for documents; Researchers would pay for software that converts two-column PDFs to single-column for e-readers; Readers want e-reader software that handles scanned PDFs well; Readers would pay for e-reading that generates illustrations from the text on the fly; Readers would pay for a local tool that compiles saved pages and PDFs into printed books by category; Readers would pay to have papers re-rendered in modern readable fonts", "quotes": [{"id": "38778545", "author": "User23", "year": 2023, "thread": "The Invisible Screen – An E-Paper Smart Display", "text": "I would pay good money for a tabloid eink reader, so 17x11 inches. Ideally it would fold. A folding pair of 8.5x11 screens designed to work together would fit my use case too. So far as I know, nobody makes such a thing. Ideally it would be color but I’d settle for monochrome."}, {"id": "5829256", "author": "MichaelGG", "year": 2013, "thread": "Amazon's full size PDF reader, the Kindle DX, is back", "text": "There may be things the DX is good for. PDFs are not one of them. The DX is heavy, and the Amazon PDF software was pretty terrible. The biggest problem is that most PDFs worth reading are the print-layout 2-column format, which is hard to cram into a small screen like the DX's.\n\nI found a Nexus 7, which weighs less and has about the same resolution, to be far superior, because at least you can scroll around easily.\n\nIn most cases, I end up actually printing out any long papers I want to read, because I've found no good way to view them electronically. It's idiotically backwards, considering all the advances in tech.\n\nI'd love to use e-ink to
