<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker Ideas</title>
<style>
:root{--bg:#f6f6ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6b63;--line:#e4e4da;--acc:#ff6600;--acc-soft:#fff1e6;--chip:#efefe6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#1f1f25;--ink:#ececec;--mute:#9a9aa3;--line:#2e2e36;--acc:#ff7a24;--acc-soft:#33241a;--chip:#2a2a31}}
:root[data-theme="dark"]{--bg:#16161a;--card:#1f1f25;--ink:#ececec;--mute:#9a9aa3;--line:#2e2e36;--acc:#ff7a24;--acc-soft:#33241a;--chip:#2a2a31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:14px 16px}
header .wrap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;letter-spacing:-.01em}
header p{margin:0;opacity:.9;font-size:13px}
.wrap{max-width:960px;margin:0 auto}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input{flex:1 1 220px;min-width:0}
button{cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:16px}
.count{color:var(--mute);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.top{display:flex;gap:14px;align-items:flex-start}
.score{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--acc-soft);color:var(--acc);padding:6px 0}
.score b{display:block;font-size:22px;line-height:1.1}
.score span{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.title{flex:1;min-width:0}
.title h2{margin:0;font-size:17px}
.title .one{margin:2px 0 8px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mute)}
.chip.pay{color:var(--acc)}
.acts{flex:none;display:flex;gap:6px}
.acts button{padding:4px 9px;font-size:13px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:12px 0}
dt{color:var(--mute);font-size:13px}
dd{margin:0}
blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-line}
blockquote a{color:var(--mute);font-size:12px;display:block;margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.dim{opacity:.45}
@media (max-width:560px){.top{flex-wrap:wrap}.acts{width:100%}dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Hacker Ideas</h1><p>Startup ideas mined from problems Hacker News commenters keep describing.</p></div></header>
<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Search ideas, problems, products…" aria-label="Search">
  <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  <select id="sort" aria-label="Sort">
    <option value="signal">Sort: signal strength</option>
    <option value="verdict">Sort: analyst score</option>
    <option value="recent">Sort: most recent</option>
    <option value="pay">Sort: willingness to pay</option>
  </select>
  <button id="starred">★ Starred</button>
  <button id="hidden">Show hidden</button>
</div></div>
<main class="wrap"><p class="count" id="count"></p><div id="list"></div></main>
<script>
const IDEAS = /*IDEAS*/[];
const store = (() => { try { return JSON.parse(localStorage.getItem("hi-state") || "{}"); } catch { return {}; } })();
store.star = store.star || {}; store.hide = store.hide || {};
const save = () => { try { localStorage.setItem("hi-state", JSON.stringify(store)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let onlyStar = false, showHidden = false;

[...new Set(IDEAS.map(i => i.category))].sort().forEach(c => $("#cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));

function render() {
  const q = $("#q").value.toLowerCase(), cat = $("#cat").value, sort = $("#sort").value;
  let xs = IDEAS.filter(i => (!cat || i.category === cat)
    && (!onlyStar || store.star[i.key]) && (showHidden || !store.hide[i.key])
    && (!q || JSON.stringify(i).toLowerCase().includes(q)));
  const k = {signal: i => i.signal_score, verdict: i => i.verdict_score, recent: i => Math.max(...i.years), pay: i => i.pay_signals}[sort];
  xs.sort((a, b) => k(b) - k(a));
  $("#count").textContent = `${xs.length} of ${IDEAS.length} ideas`;
  $("#list").innerHTML = xs.length ? xs.map(card).join("") : `<p class="empty">No ideas match.</p>`;
}

function card(i) {
  const yrs = i.years.length ? `${i.years[0]}–${i.years[i.years.length - 1]}` : "";
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="card ${store.hide[i.key] ? "dim" : ""}">
    <div class="top">
      <div class="score" title="Analyst score out of 10"><b>${i.verdict_score}</b><span>/ 10</span></div>
      <div class="title"><h2>${esc(i.name)}</h2><p class="one">${esc(i.one_liner)}</p>
        <div class="chips"><span class="chip">${esc(i.category)}</span>
          <span class="chip">${i.authors} commenters</span><span class="chip">${i.mentions} mentions</span>
          <span class="chip">${yrs}</span>${i.pay_signals ? `<span class="chip pay">💰 ${i.pay_signals} pay signals</span>` : ""}
          <span class="chip">pain ${i.avg_intensity}/5</span></div></div>
      <div class="acts"><button data-star="${esc(i.key)}" aria-label="Star">${store.star[i.key] ? "★" : "☆"}</button>
        <button data-hide="${esc(i.key)}">${store.hide[i.key] ? "Unhide" : "Hide"}</button></div>
    </div>
    <details><summary>Full idea card & evidence</summary><dl>
      ${row("Problem", i.problem)}${row("Customer", i.customer)}${row("Evidence", i.evidence)}
      ${row("Solution", i.solution)}${row("First version", i.mvp)}${row("Business model", i.business_model)}
      ${row("Alternatives", i.alternatives)}${row("Why now", i.why_now)}${row("Risks", i.risks)}</dl>
      ${i.quotes.map(q => `<blockquote>${esc(q.text)}<a href="https://news.ycombinator.com/item?id=${esc(q.id)}" target="_blank" rel="noopener">${esc(q.author)}, ${q.year}${q.thread ? " · " + esc(q.thread) : ""} ↗</a></blockquote>`).join("")}
    </details></article>`;
}

document.addEventListener("click", e => {
  const s = e.target.dataset.star, h = e.target.dataset.hide;
  if (s) { store.star[s] ? delete store.star[s] : store.star[s] = 1; save(); render(); }
  if (h) { store.hide[h] ? delete store.hide[h] : store.hide[h] = 1; save(); render(); }
});
$("#starred").onclick = () => { onlyStar = !onlyStar; $("#starred").classList.toggle("on", onlyStar); render(); };
$("#hidden").onclick = () => { showHidden = !showHidden; $("#hidden").classList.toggle("on", showHidden); render(); };
["#q", "#cat", "#sort"].forEach(s => $(s).addEventListener("input", render));
render();
</script>
</body>
</html>
