d LatinIME).  LatinIME is open source, Apache licensed.\n\n3.  The source code is here:  https://gitlab.futo.org/alex/latinime/\n\nI'm not an open source purist, but the more central/fundamental the project is to my life/workflow, the more important that becomes to me.  A keyboard is pretty fundamental.  I'd love to have an open source keyboard that is good, especially with good speech to t"}, {"id": "35598487", "author": "viraptor", "year": 2023, "thread": "Microsoft deleted the public support forums for SwiftKey", "text": "I'm really surprised there are no quality swipe keyboard options out there. Gboard is ok. I liked SwiftKey better a few years ago, but it degraded. But I'd pay for a swipe keyboard which solves a few issues I run into all the time: like not being great at detecting the space swipe, not showing the word alternatives consistently, not getting stuck in password entry mode, etc.\n\nI tried a few of the available options and it seems like gboard and SwiftKey on top, then a huge chasm, then every other option, few of them likely low quality data stealers.\n\nPlease, do it well and take my money!"}], "key": "i55-Users would pay for a go"}, {"name": "Premium viewers want sponsor-segment skipping built in", "one_liner": "Draft: cluster not yet reviewed. Keywords: segments, sponsor, sponsor segments, viewers, skipping, premium", "draft": true, "verdict_score": null, "cluster": "segments, sponsor, sponsor segments, viewers", "category": "media & content", "signal_score": 14.96, "authors": 7, "years": [2022, 2023, 2026], "pay_signals": 6.0, "avg_intensity": 2.29, "mentions": 7, "problem": "Viewers would pay for auto-skipping sponsor segments with creators compensated; Viewers would pay good money for TV ad skipping and podcast players with crowd-marked ad segments; Apple TV viewers lack a good way to skip sponsor segments on YouTube; Viewers would pay for YouTube Premium if creators' sponsor segments were also removed; Premium viewers want sponsor-segment skipping built in; Premium viewers still see in-video sponsor segments and want them marked and skippable", "quotes": [{"id": "31173234", "author": "jhallenworld", "year": 2022, "thread": "Alphabet Announces First Quarter 2022 Results", "text": "I pay this to get rid of Google's inserted ads, but it's getting hurt by too many in-video sponsorship ads.  I would pay for a mode where the content creator gets more money in exchange for automatically skipping their sponsorship ad.\n\nThe like/subscribe/become a Patreon is also annoying, but not as bad as actual ads."}, {"id": "30155069", "author": "xtracto", "year": 2022, "thread": "Adblocking people and non-adblocking people experience a different web", "text": "I have no idea why a successor to TiVo never came out. The idea of \"fast forwarding\" TV ads was way ahead of its time. I've got cable TV and would pay good money for a service like that. The same applies to Podcast ads: I would pay for a podcast player (like Podcast Republic) that could automatically skip ads, and say let people mark ad segments in a podcast so that others could skip them."}, {"id": "49860484", "author": "QGQBGdeZREunxLe", "year": 2026, "thread": "PipePipe: NewPipe hard fork implementing SponsorBlock", "text": "Still no good solution for Apple TV? Running SponsorBlock container, on the same network appears to be the best solution but that only mutes ads and skips them when permitted."}, {"id": "46521454", "author": "wolvoleo", "year": 2026, "thread": "Vietnam bans unskippable ads", "text": "No but if they weren't double dipping with the sponsors I'd pay for premium.\n\nIt's just that as it stands it makes no sense to do so. I still get ads so there's nothing in it for me. And if I use sponsorblock I might as well go the full way.\n\nIt's really on YouTube that they have let this situation be created. They should have stopped sponsor segments the moment they arrived."}], "key": "i56-Premium viewers want spo"}, {"name": "Users want desktop data tools sold as perpetual licenses rather than subscriptions", "one_liner": "Draft: cluster not yet reviewed. Keywords: perpetual, buy, utility, subscriptions, perpetual license, licenses", "draft": true, "verdict_score": null, "cluster": "perpetual, buy, utility, subscriptions", "category": "productivity & work", "signal_score": 14.93, "authors": 6, "years": [2020, 2022, 2023, 2024], "pay_signals": 5.5, "avg_intensity": 2.5, "mentions": 6, "problem": "Users want desktop data tools sold as perpetual licenses rather than subscriptions; Users want portable perpetual-license software instead of subscriptions; Occasional CAD users want buy-once licenses instead of monthly subscriptions; Developers want a perpetual-license container desktop tool instead of a subscription; Users want to buy finished utility apps outright instead of subscribing; Windows users want to buy utility add-ons once rather than subscribe", "quotes": [{"id": "38342051", "author": "devmor", "year": 2023, "thread": "Ultorg: A User Interface for Relational Data", "text": "Echoing the sentiment of other users here - I would happily pay a steep up front price for this software. I will not pay a monthly subscription for software that runs on my machines using data on my machines.\n\nPlease reconsider the rent-seeking price model, or at least move it somewhere appropriate like an enterprise support tier."}, {"id": "34051246", "author": "Ylpertnodi", "year": 2022, "thread": "Ask HN: Anyone tired of everything being a subscription now?", "text": ">I basically pirate everything that requires a subscription now or us a FOSS alternative, even though there was a period of time where I would pay for software between when I was poor and had to pirate everything and now when I can afford to pay for subscriptions but the situation with lack of control over SaaS is so fucking untenable that I just can't.\n\nSame and similar. I resurrected an old pc and re-installed som backed-up old software and it mostly worked...well ritten-beyond", "year": 2026, "thread": "Bunny Database", "text": "Backups are a PITA I wanted to go exactly this route but even though I had VMs and compute I can't let any production data hit it without bullet proof backups.\n\nI setup a cron job to store my backups to object storage but everything felt very fragile because if any detail in the chain was misconfigured I'd basically have a broken production database. I'd have to watch the database constantly or setup alerts and notifications.\n\nIf there is a ready to go OSS postgres with backups configured you can deploy I'd happily pay them for that."}, {"id": "45952735", "author": "matharmin", "year": 2025, "thread": "Listen to Database Changes Through the Postgres WAL", "text": "We're relying on logical replication heavily for PowerSync, and I've found it is a great tool, but it is also very low-level and under-documented. This article gives a great overview - I wish I had this when we started with our implementation.\n\nSome examples of difficulties we've ran into:\n1. LSNs for transactions (commits) are strictly increasing, but not for individual operations across transactions. You may not pick this up during basic testing, but it starts showing up when you have concurrent transactions.\n2. You cannot resume logical replication in the middle of a transaction (you have to restart the transaction), which becomes relevant when you have large transactions.\n3. In most case"}, {"id": "46339902", "author": "conradfr", "year": 2025, "thread": "Go ahead, self-host Postgres", "text": "I've been self hosting Postgresql for 12+ years at this point. Directly on bare metal then and now in a container with CapRover.\n\nI have a cron sh script to backup to S3 (used to be ftp).\n\nIt's not \"business grade\" but it has also actually NEVER failed. Well once, but I think it was more the container or a swarm thing. I just destroyed and recreated it and it picked up the same volume fine.\n\nThe biggest pain point is upgrading as Postgresql can't upgrade the data without the previous version installed or something. It's VERY annoying."}, {"id": "43936593", "author": "matt-p", "year": 2025, "thread": "Databricks in talks to acquire startup Neon for about $1B", "text": "I use neon quite a bit, profiling seems to show ~600-980ms of extra latency. This is in the AWS London region, on postgres 15/16.\n\nRegardless if I've got a website that's used a couple of times a hour every hour then the practical reality is almost all users have a extra second of latency or so.\n\nI'm not complaining, it's a great product that I'll continue to use, but it's the biggest pain point."}], "key": "i58-Postgres users struggle "}, {"name": "Buyers want premium-picture TVs without smart-TV software, tracking and network connections", "one_liner": "Draft: cluster not yet reviewed. Keywords: tv, buyers, tv buyers, buyers premium, smart tv, premium", "draft": true, "verdict_score": null, "cluster": "tv, buyers, tv buyers, buyers premium", "category": "hardware & IoT", "signal_score": 14.81, "authors": 5, "years": [2021, 2022, 2024, 2025], "pay_signals": 5.0, "avg_intensity": 3.0, "mentions": 5, "problem": "TV buyers want a premium TV without spyware and laggy software; TV buyers want large displays without smart-TV crapware or forced account setup; Buyers want premium-picture TVs without smart-TV software, tracking and network connections; TV buyers would pay a premium for an ad-free, analytics-free OLED TV; Buyers would pay for a brandless privacy-respecting TV display controlled entirely by their streaming box", "quotes": [{"id": "45257994", "author": "socalgal2", "year": 2025, "thread": "I feel Apple has lost its alignment with me and other long-time customers", "text": "> A TV is bulky, race to the bottom commodity that is only replaced every 5-8 years.\n\nTrue but, can't you kind of say the same about phones? My sister buys Moto-G's. They cost her $120. Apple charges more. They make their own market. I don't know how much I'd be willing the pay but I feel like I'd pay for an 65\" Apple TV. Sony, LG, Samsung, Roku, TCL, all make crap TVs that want to spy on you. They are almost universally underpowered for their apps and OS and are all jank AF. i have an AppleTV plugged into my Sony and a few times a month I bump the bad remote and it switched to Google TV and tries to get me to sign in so it can serve ads at me.\n\nThe market for an apple branded TV might not b"}, {"id": "40910058", "author": "xoxxala", "year": 2024, "thread": "Dear Roku, you ruined my TV", "text": "YMMV, but $900 for no crapware is a price I would happily pay. We don't watch TV in our house, so haven't updated it in over a decade, but our next \"TV\" will be a monitor.\n\nWe did purchase a Roku stick a couple years ago, but they wanted credit card info during the set up, which I thought was BS for something that I just wanted to use for our existing streaming apps -- so we never used it."}, {"id": "31040327", "author": "nerdjon", "year": 2022, "thread": "It’s Still Stupidly, Difficult to Buy a ‘Dumb’ TV", "text": "I cringe anytime I go to a friends place and their TV is connected to their network. I can't believe people have gotten to comfortable with the privacy implications of these devices being connected all the time.\n\nIt wasn't that long ago that I think it was Samsung was caught with the mic always on or something? I don't remember.\n\nI hate how TV's have gone. I don't really consider myself an audiophile (or the picture quality equilvent) but I am willing to spend money on good sound and picture. Not spend a ton but cleanly middle ground on sound and high ground on picture quality.\n\nI have a 75\" tv right now and eying an 85\" when I upgrade this thing. I play a lot of video games, watch a lot of "}, {"id": "29033260", "author": "darkteflon", "year": 2021, "thread": "Samsung UK admits you can’t disable ads on Samsung smart TV", "text": "I’d happily pay a several hundred dollar premium for an ad-free, analytics-free OLED option from LG."}], "key": "i59-Buyers want premium-pict"}, {"name": "Developers would pay for a standalone cross-platform debugger extracted from an IDE", "one_liner": "Draft: cluster not yet reviewed. Keywords: debugger, developers, vs, vs code, developers fast, ide", "draft": true, "verdict_score": null, "cluster": "debugger, developers, vs, vs code", "category": "developer tools", "signal_score": 14.81, "authors": 5, "years": [2020, 2021, 2023, 2025], "pay_signals": 5.0, "avg_intensity": 3.0, "mentions": 5, "problem": "Developers would pay for a standalone cross-platform debugger extracted from an IDE; Rust developers would pay for a fast Sublime Text debugger plugin as an alternative to VS Code; Linux C++ developers would pay for a fast, stable visual debugger like RemedyBG; Developers would pay for a VS Code with IntelliJ-level language plugins and remoting; Developers would pay for an IDE-integrated GitHub explorer that jumps from diffs to changed lines", "quotes": [{"id": "43915025", "author": "WhereIsTheTruth", "year": 2025, "thread": "CLion Is Now Free for Non-Commercial Use", "text": "I wish they'd extract the debugger and release it as a crossplatform standalone tool, i'd pay for it"}, {"id": "42863284", "author": "culebron21", "year": 2025, "thread": "I still like Sublime Text", "text": "I'm happy with the most of the features, bought v2, 3 & 4 over the last 13 years, but it lacks debugger, so for Rusti, I have to use VS Code -- which is awful, but there's no better alternative. I'd pay for a special plugin that will work faster than VS Code."}, {"id": "37013552", "author": "the-smug-one", "year": 2023, "thread": "Green vs. brown programming languages (2021)", "text": "I'm a C++ dev also, and I don't agree with you! I use clangd, gdb, dynamic analysis tools, no static analysis tools (other than compiler warnings). The help I've gotten from Rust analyzer compared to clangd is pretty large, imho. Rust restraining itself means that our tooling gets to be more free.\n\nAlso, gdb is... Not that great. Yes, it definitely does debug my app and in that sense it is great. It is however pretty unstable and gets into weird state I cannot get out of, gdb/mi is a mess, and the text interface (TUI) is not performant enough. I'm still very happy that I have it, but when I look at RemedyBG I get jealous. I'd pay for an equivalent to RemedyBG on Linux, if it was FOSS."}, {"id": "26618887", "author": "reader_mode", "year": 2021, "thread": "Developer tools can be magic but instead collect dust", "text": "Oh it's absolutely the dart/flutter plugin. Just as it was the C# plugin when I attempted to use it as a VS replacement, and it was down to Rust plugin when I tried that.\n\nSo in the end the only decent experience I had with it was Typescript and JS.\n\nCompare that to IntelliJ or Visual Studio. If I was mostly doing Web frontend or node I would 100% use vscode. Otherwise I just find it's too unreliable and I don't want to waste productivity energy on it. (I wish it was on IntelliJ level, I would pay for that with vscode remoting possibilities, more than I pay IntelliJ even)"}], "key": "i60-Developers would pay for"}];
const META = {"note": "28 of 256 chunks read (4,200 of 38,273 comments), 2,887 signals extracted. 21 idea cards, 40 draft clusters. Built 2026-11-18."};
const store = (() => { try { return JSON.parse(localStorage.getItem("hi-state") || "{}"); } catch { return {}; } })();
store.star = store.star || {}; store.hide = store.hide || {};
const save = () => { try { localStorage.setItem("hi-state", JSON.stringify(store)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let onlyStar = false, showHidden = false, showDrafts = false;
$("#meta").textContent = META.note || "";

[...new Set(IDEAS.map(i => i.category))].sort().forEach(c => $("#cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));

function render() {
  const q = $("#q").value.toLowerCase(), cat = $("#cat").value, sort = $("#sort").value;
  let xs = IDEAS.filter(i => (!cat || i.category === cat)
    && (!onlyStar || store.star[i.key]) && (showHidden || !store.hide[i.key]) && (showDrafts || !i.draft)
    && (!q || JSON.stringify(i).toLowerCase().includes(q)));
  const k = {signal: i => i.signal_score, verdict: i => i.verdict_score ?? -1, recent: i => Math.max(...i.years), pay: i => i.pay_signals}[sort];
  xs.sort((a, b) => k(b) - k(a));
  $("#count").textContent = `${xs.length} of ${IDEAS.length} ideas`;
  $("#list").innerHTML = xs.length ? xs.map(card).join("") : `<p class="empty">No ideas match.</p>`;
}

function card(i) {
  const yrs = i.years.length ? `${i.years[0]}–${i.years[i.years.length - 1]}` : "";
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="card ${store.hide[i.key] ? "dim" : ""}">
    <div class="top">
      ${i.draft ? `<div class="score draft" title="Cluster without an idea card yet"><b>–</b><span>draft</span></div>` : `<div class="score" title="Analyst score out of 10"><b>${i.verdict_score}</b><span>/ 10</span></div>`}
      <div class="title"><h2>${esc(i.name)}</h2><p class="one">${esc(i.one_liner)}</p>
        <div class="chips"><span class="chip">${esc(i.category)}</span>${i.draft ? `<span class="chip">draft</span>` : ""}
          <span class="chip">${i.authors} commenters</span><span class="chip">${i.mentions} mentions</span>
          <span class="chip">${yrs}</span>${i.pay_signals ? `<span class="chip pay">💰 ${i.pay_signals} pay signals</span>` : ""}
          <span class="chip">pain ${i.avg_intensity}/5</span></div></div>
      <div class="acts"><button data-star="${esc(i.key)}" aria-label="Star">${store.star[i.key] ? "★" : "☆"}</button>
        <button data-hide="${esc(i.key)}">${store.hide[i.key] ? "Unhide" : "Hide"}</button></div>
    </div>
    <details><summary>Full idea card & evidence</summary><dl>
      ${row("Problem", i.problem)}${row("Customer", i.customer)}${row("Evidence", i.evidence)}
      ${row("Solution", i.solution)}${row("First version", i.mvp)}${row("Business model", i.business_model)}
      ${row("Alternatives", i.alternatives)}${row("Why now", i.why_now)}${row("Risks", i.risks)}</dl>
      ${i.quotes.map(q => `<blockquote>${esc(q.text)}<a href="https://news.ycombinator.com/item?id=${esc(q.id)}" target="_blank" rel="noopener">${esc(q.author)}, ${q.year}${q.thread ? " · " + esc(q.thread) : ""} ↗</a></blockquote>`).join("")}
    </details></article>`;
}

document.addEventListener("click", e => {
  const s = e.target.dataset.star, h = e.target.dataset.hide;
  if (s) { store.star[s] ? delete store.star[s] : store.star[s] = 1; save(); render(); }
  if (h) { store.hide[h] ? delete store.hide[h] : store.hide[h] = 1; save(); render(); }
});
$("#starred").onclick = () => { onlyStar = !onlyStar; $("#starred").classList.toggle("on", onlyStar); render(); };
$("#drafts").onclick = () => { showDrafts = !showDrafts; $("#drafts").classList.toggle("on", showDrafts); render(); };
$("#hidden").onclick = () => { showHidden = !showHidden; $("#hidden").classList.toggle("on", showHidden); render(); };
["#q", "#cat", "#sort"].forEach(s => $(s).addEventListener("input", render));
render();
</script>
</body>
</html>
