a whole bunch of subscriptions/recurring donations.\n\nI'd love to just buy the pass and rest assured that if one of the recipients of that money starts behaving badly, the curator is going to reroute money from them, to whatever the better-behaved alternative is.\n\nThe curator (doesn't have to be the EFF, they're just the first to come to mind) can host a https://datatracker.ietf.org/wg/privacypass/about/ token faucet "}, {"id": "49388579", "author": "Cider9986", "year": 2026, "thread": "Kagi added a setting for removing paywalled links from search results", "text": "I would pay for Brave or Kagi for like $2-3 per month if one of them supported private payments(actually that's exactly what Brave costs).\n\nPaying should get you more privacy not less.\n\nI'm not paying for Kagi because it's expensive and also doesn't support private payments and Brave has better UI for me.\n\nBrave blocks their own ads while not supporting private payments and it doesn't let you use the search premium in Vanadium, it seems, which makes me question whether my subscription would work cross device. Maybe it would but only in Brave browser.\n\n>Support private, independent search\n\n>See search results ad-free\n\n>Get a cleaner view on all results pages\n\n>Cancel any time\n\nBrave should al"}, {"id": "46265242", "author": "Jaygles", "year": 2025, "thread": "Europeans' health data sold to US firm run by ex-Israeli spies", "text": "If services offered a paid version that guaranteed privacy, such that I stay anonymous and only data points that are strictly necessary to provide the service are persisted in the company's servers, I would happily pay.\n\nAnd I mean guaranteed in a way that I would have legal recourse against the company if they go back on their word or screw up"}], "key": "i36-Users would happily pay "}, {"name": "Python developers need one official tool for packaging, dependencies and virtual environments", "one_liner": "Draft: cluster not yet reviewed. Keywords: python, python developers, packaging, developers, environments, dependencies", "draft": true, "verdict_score": null, "cluster": "python, python developers, packaging, developers", "category": "developer tools", "signal_score": 22.12, "authors": 16, "years": [2018, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 8.0, "avg_intensity": 3.38, "mentions": 16, "problem": "Python developers need one official tool for packaging, dependencies and virtual environments; Python packaging and environments that work cleanly on a fresh machine.; A scalable hosted private Python package registry.; A simple Python dependency workflow like `dotnet add package` with clear root dependencies and project-scoped installs.; Python developers find deploying web and desktop apps a nightmare compared to PHP or Visual Basic; Developers find Python environments make automated scripts and services a pain", "quotes": [{"id": "22754250", "author": "fermienrico", "year": 2020, "thread": "What the Heck Is Pyproject.toml?", "text": "Python desperately needs a better packaging solution than pip from Python Software Foundation. Stop all new features until this - the biggest pain point for Python across all expertise levels from newbies to experienced Python programmers - is officially solved. No pipenv, no poetry, no conda, etc from third party devs who sometimes get tired of the pressure [1]. It is immense. Combine all this virtualenv stuff with great dependency management into one tool. In the spirit of Python, there should be only one way to package, manage dependencies and virtual environments. It should be super clean (see Go).\n\nPython needs a BDFL to enforce the hive mind. It is a fucking mess and it's unacceptable."}, {"id": "50249767", "author": "brcmthrowaway", "year": 2026, "thread": "Type Server Protocol", "text": "The packaging is a nightmare thats for sure.\n\nVenvs, activate, deactivate, shitty scripts hacking on $PATH. How did this ever ship? Then there was poetry, `uv`, and maybe something in else in $CURRENT_YEAR.\n\nTry to set it up on a new macOS, go on. Install a package from pip, and there's a bunch of garbage that won't let you do it.\n\nIt's horrible. Python packaging engineer is now an FTE, maybe that's what they wanted."}, {"id": "44895007", "author": "jsmeaton", "year": 2025, "thread": "PYX: The next step in Python packaging", "text": "Astral folks that are around - there seems to be a bit of confusion in the product page that the blog post makes a little more clear.\n\n> The next step in Python packaging\n\nThe headline is the confusing bit I think - \"oh no, another tool already?\"\n\nIMO you should lean into stating this is going to be a paid product (answering how you plan to make money and become sustainable), and highlight that this will help solve private packaging problems.\n\nI'm excited by this announcement by the way. Setting up scalable private python registries is a huge pain. Looking forward to it!"}, {"id": "41236409", "author": "ryanjshaw", "year": 2024, "thread": "Go is my hammer, and everything is a nail", "text": "I started using Dagster a few days ago, which runs on Python.\n\nAs far as I can tell, I have to install the packages with pip. Wait - don't forget venv first. Oh but I'm not supposed to commit the venv, so how is anybody to know what I did? Okay I have to setup a requirements.txt... but now what did I install in the venv? Okay there's a way to dump the venv.. but it's giving me all the dependencies, not the root package I installed?!\n\nOkay there's something called pipenv that seems smart... Oh wait no this Dagster has a pyproject.toml, maybe I should use poetry? Wait poetry doesn't work, it seems like I'm supposed to use setup.py... so what's the point of pyproject.toml.\n\nOkay I put the packa"}], "key": "i37-Python developers need o"}, {"name": "Rust developers find building async actors a huge pain in existing frameworks", "one_liner": "Draft: cluster not yet reviewed. Keywords: rust, async, rust developers, library, developers, times", "draft": true, "verdict_score": null, "cluster": "rust, async, rust developers, library", "category": "developer tools", "signal_score": 21.62, "authors": 17, "years": [2017, 2019, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 8.5, "avg_intensity": 2.59, "mentions": 17, "problem": "Large Rust codebases suffer from slow compile times; Large Rust codebases suffer from slow compile times; Embedded teams lack vendor libraries and tooling for Rust beyond a few hobby chips; Rust game developers lack a UI framework for the Bevy ECS that supports reusable widgets and text input; Rust developers lack a mature GUI library; Rust teams have huge rebuild times and target directories and want reusable cross-platform components", "quotes": [{"id": "44398097", "author": "rtfeldman", "year": 2025, "thread": "Why is the Rust compiler so slow?", "text": "> Given Rust's numerous benefits, is having subpar compilation time really that big of a deal?\n\nAs someone who uses Rust as a daily driver at work at zed.dev (about 600K LoC of Rust), and Zig outside of work on roc-lang.org (which was about 300K LoC of Rust before we decided to rewrite it in Zig, in significant part because of Rust's compilation speed), yes - it is an absolutely huge deal.\n\nI like a lot of things about Rust, but its build times are my biggest pain point."}, {"id": "42938495", "author": "gregwebs", "year": 2025, "thread": "Roc rewrites the compiler in Zig", "text": "Go was built while waiting for C++ to compile- fast compilation was an implicit design goal.\n\nRust on the other hand didn’t prioritize compile times and ended up making design decisions that make faster compilation difficult to achieve. To me it’s the biggest pain point with Rust for a large code base and that seems to be the sentiment here as well."}, {"id": "41835579", "author": "myrmidon", "year": 2024, "thread": "Embedded Rust in Production?", "text": "A very important point that the article neglects is that for a lot of embedded platforms, you have to heavily rely on the hardware manufacturers libraries and tooling. All of that stuff is typically gonna be targeted at C.\n\nWithout this, using even very simple hardware interfaces (like an SPI/I2C bus) is gonna be a huge pain, because you'll have to comb through reference manuals and register descriptions for your processor and piece everything together yourself instead of just calling a few API functions (this is also very error-prone and using Rust is not really gonna help one bit).\n\nThe only chance to get even halfway decent rust integration is to pick one of the like 3 most popular hardwa"}, {"id": "40177867", "author": "lyu07282", "year": 2024, "thread": "Leaving Rust gamedev after 3 years", "text": "> ECS in Rust has this tendency of turning from something that is considered a tool in other language to become almost a religious belief.\n\nI think bevy ui is the best example to give, it's like nobody ever did a ui framework with a pure ECS before. You can conclude either that's because it makes no sense to do that or that's because nobody has ever came up with the right way to do that. The bevy community thinks it's the latter.\n\nIt's especially concerning because they constantly talk about the editor, even though they don't even have any of the fundamental pieces for a gui framework in place. In bevy ui there is no way to create a reusable ui component, there are ways to do it but they all"}], "key": "i38-Rust developers find bui"}, {"name": "Developers find recompiling old Linux software with old toolchains and dependencies a nightmare", "one_liner": "Draft: cluster not yet reviewed. Keywords: nix, old, packages, dependencies, developers, linux", "draft": true, "verdict_score": null, "cluster": "nix, old, packages, dependencies", "category": "developer tools", "signal_score": 20.8, "authors": 16, "years": [2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 7.5, "avg_intensity": 2.62, "mentions": 16, "problem": "Developers want reproducible dev environments that work with existing tools and package managers instead of all-or-nothing Nix; Developers find reviving decade-old untyped Node projects with broken dependencies a nightmare; Software maintainers find building packages for every Linux distro and old release a nightmare; Node developers find the library ecosystem a nightmare of abandoned or constantly changing packages; Users want Nix-style reproducible system builds with a nicer configuration language; Linux application vendors struggle with library version differences across distributions", "quotes": [{"id": "37871365", "author": "jcrites", "year": 2023, "thread": "Why you shouldn't join Y Combinator", "text": "I’m definitely interested in the build system / package manager. I have (idly, in a daydreaming sort of way) considered building something like it myself.\n\nI tried to get into Nix recently, but found it difficult to accommodate my workflows within its uncompromising nature. My goal was to set up a reproducible development environment, where anyone at my company could easily get set up to work on our code with a single (or concise set of) action(s). I also tried to use home-manager, which I have heard might have been a mistake.\n\nAnyway, Nix is really only designed to manage the entire world. I wasn’t able to use Nix to build a development environment where other developers and I could work in"}, {"id": "47909725", "author": "wakamoleguy", "year": 2026, "thread": "Reviving BrowserID in 2026", "text": "That’s how this project started, with trying to take the Persona repo and bringing it up to date. There were two challenges… first, don’t underestimate how hard it is to take a decade old Node repo and run it today. There are no types, many dependencies don’t work on modern Node versions, and upgrading them all together is a nightmare. BrowserID is not a very complex protocol, so rebuilding it gave me an opportunity to use new tools (TypeScript, Bun, Jose for crypto).\n\nAnd the second reason is that I don’t want to try to be Mozilla Persona. The fallback IdP is a great idea, but y’all have no reason to trust me to be the one to run it. I can sidestep that issue for my own needs today, avoid t"}, {"id": "46764891", "author": "koffiezet", "year": 2026, "thread": "The Holy Grail of Linux Binary Compatibility: Musl and Dlopen", "text": "It however shifts a lot of the complexity of building the application to the distro maintainer, or a software maintainer has to prioritize for which distribution they choose to build and maintain a package, because supporting them all is a nightmare and an ever shifting moving target. And it's not just a distribution problem, it's even a distribution version/release problem.\n\nLook at the hoops you sometimes have to jump through or hacks you have to apply to make something work on Nix, just because there is no standardization or build processes assume library locations etc. And if you then raise an issue with the software maintainer - the response is often \"but we don't support Nix\". And if t"}, {"id": "44949893", "author": "nake89", "year": 2025, "thread": "Node.js is able to execute TypeScript files without additional configuration", "text": "> the library ecosystem is a nightmare\nI agree.\n\n> Just keeping a project from falling apart takes a huge amount of effort\nI think the culture of importing libraries with lots of dependencies is a big contributor.\n\n> Libraries are either abandoned when the author moves on\nThis applies to any OSS project. Generally speaking popular abandoned libraries get forked.\n\n> or they push major releases almost every month\nThis sounds like a very bad library to use. I would not recommend having this type of library as a dependency in Node or even in Python for that matter.\n\n> Python libraries are much more stable and reliable.\nNot sure what would make python libraries magically more stable and more reli"}], "key": "i39-Developers find recompil"}, {"name": "Windows and Linux users want Apple-quality laptop hardware", "one_liner": "Draft: cluster not yet reviewed. Keywords: laptop, linux, laptops, macbooks, quality, apple", "draft": true, "verdict_score": null, "cluster": "laptop, linux, laptops, macbooks", "category": "hardware & IoT", "signal_score": 19.39, "authors": 12, "years": [2018, 2019, 2020, 2021, 2023, 2024, 2025], "pay_signals": 7.0, "avg_intensity": 2.75, "mentions": 12, "problem": "Linux users want MacBook-quality laptops that reliably support Linux; Windows and Linux users want Apple-quality laptop hardware; Laptop buyers want rugged, quiet, quality hardware like old MacBooks from other makers, with good EU support; Linux users want laptop makers other than ThinkPad with predictable build quality and documented components; Users want a non-Apple laptop matching M-series performance, battery and silence; Laptop buyers want touchpads as good as MacBooks", "quotes": [{"id": "39642146", "author": "trelane", "year": 2024, "thread": "Full AMD Linux Laptop (Radeon 7600M XT GPU, Ryzen CPU): Tuxedo Sirius 16 Review", "text": "> Why isn't there a company that would produce nearly macbook-quality laptops (albeit without the M-series ARM processor), but reliably linux-friendly?\n\nBecause hackintoshes are much, much, much less common than someone slapping Linux on some random bit of kit. And nobody complains about OSX breaking or not running perfectly on non-Apple hardware. As evidenced by the term \"hackintosh\" itself.\n\nIt's very hard for a Linux hardware company to gain any ability to innovate when so much of the market goes elsewhere.\n\nIMHO, it's nigh on miraculous that System76 is as great as it is. I would dearly love for them to be able to do more, but the reality is that most folks complain that it's not exactly"}, {"id": "44319497", "author": "criddell", "year": 2025, "thread": "Framework Laptop 12 review", "text": "Assuming everything you say is correct, there are a lot of people with more money than sense. Why is Apple the only company to chase that market?\n\nApple’s margins are the envy of the industry. Their stores have revenue per square foot numbers that few other retailers can match. Why isn’t there a Dell store across the street from every Apple store? Why doesn’t HP have a machine that goes toe-to-toe with every SKU that Apple sells?\n\n> Apple makes a laptop for you\n\nAnd, unfortunately, only Apple is making a laptop with those characteristics. My laptop is a ThinkPad because I need Windows and it’s not a very nice computer to use. There’s lots of Linux and Windows people out there who want Apple-"}, {"id": "41133793", "author": "nextos", "year": 2024, "thread": "Delta CEO calls Microsoft 'the most fragile platform' while praising Apple", "text": "In my house we have 3 Macs: A MacBook (2007), a MacBook Pro (2009, the first unibody model) and a MacBook Air 11 (late 2012). The only hardware failure in all this time came from the MBA. The SSD got loose, but it was easy to fix. All of them still work fine. The MBP gets used daily. So that's 15 years of daily use with zero issues.\n\nI dislike where macOS is going. In fact, 2/3 of my machines run Linux. But Apple hardware is pretty good, rugged and silent. I hate laptops that sound like hairdyers. I wish there were other manufacturers that had a similar focus on quality.\n\nPerhaps Framework might be one to keep an eye on. Some ThinkPads are great, but they churn out way too many models and th"}, {"id": "41063835", "author": "hakfoo", "year": 2024, "thread": "Arch-based CachyOS promises speed but trips over its laces", "text": "The appeal of Thinkpads is that they're more or less predictable.\n\nSome manufacturers tend to swing wildly from \"really great\" to \"terrible and flimsy\" from generation to generation.\n\nThinkpads may, like everything else, be slowly enshittifying, but you can pretty much buy one at random and it probably won't creak when you pick it up, or overheat due to insufficient cooling capacity.\n\nOn a per-model level they also tend to be very well documented.  Knowing that it comes with specific wireless and GPU choices is important for Linux support, and is the sort of thing that they don't do with some cheap consumer laptops.\n\nI wish there were other manufacturers that did the same thing.  I've heard "}], "key": "i40-Windows and Linux users "}, {"name": "Users would pay for a paid tier of a private messenger", "one_liner": "Draft: cluster not yet reviewed. Keywords: private, messenger, imessage, chat, messaging, android", "draft": true, "verdict_score": null, "cluster": "private, messenger, imessage, chat", "category": "communication & social", "signal_score": 19.11, "authors": 12, "years": [2017, 2019, 2021, 2022, 2023, 2024], "pay_signals": 12.0, "avg_intensity": 2.83, "mentions": 12, "problem": "Android users would pay for iMessage access; Users would pay for a unified multi-device chat client bridging WhatsApp, Signal and Telegram; Users would pay for private messaging that syncs chat history across devices with good usability; Users would pay for encrypted chat backups and business features in a secure messenger; Users wanted to pay for a private, ad-free messenger; Android users would pay for a service that lets them use iMessage", "quotes": [{"id": "38724692", "author": "robust-cactus", "year": 2023, "thread": "Beeper – Moving Forward", "text": "At this point, I'd pay for iMessage on Android. There's a lot of conversations android users are not a part of because of iMessage."}, {"id": "29002085", "author": "NikolaNovak", "year": 2021, "thread": "Element One – All of Matrix, WhatsApp, Signal and Telegram in one place", "text": "If I can enhance understanding on any level, FYI FWIW I will sign up for this likely.\n\n1. Yes - In this context I prefer convenience over impractical/unrealized encryption. (Not privacy - I find Whatsapp, which hinges on my personal private phone number, far less \"private\", than other traditional messenger apps which I can sign up for anonymously; and for my use cases it's not a realized encryption, as people I talk to have no concept of security and I should assume anything I send to them has been scrubbed by malware and any other apps they've intentionally installed and agreed to).\n\n2. Dozen apps are annoying impractical and I darn tooting well do Not have their notifications enabled. I'll"}, {"id": "40527493", "author": "daft_pink", "year": 2024, "thread": "[dead]", "text": "Honestly, it’s gotta work across all my devices pretty well.  Signal doesn’t really let you move from device to device easily.  I like privacy, but I don’t need it that badly.  If it had a chat history, I would pay for it to be honest.\n\nThe problem with Signal and Proton is they sacrifice usability for over the top security.  I don’t want to use Google or Zuckerberg products that are using you to sell ads, but I don’t want terrible usability either."}, {"id": "38292124", "author": "ruffrey", "year": 2023, "thread": "Privacy is priceless, but Signal is expensive", "text": "I would pay for a few signal features:\n1. encrypted backups or backup integration of my chats, photos and videos.\n2. business features (backup, directory integration, search)\n\nI have not used:\n1. voice and video\n\nIncredible that SMS costs so much. I wonder if it's worth it because it _saves_ so much in spam and other sorts of fraud or bad behavior?"}], "key": "i41-Users would pay for a pa"}, {"name": "Listeners would pay for a service that reliably finds music they love", "one_liner": "Draft: cluster not yet reviewed. Keywords: listeners, music, listeners music, streaming, music platform, music listeners", "draft": true, "verdict_score": null, "cluster": "listeners, music, listeners music, streaming", "category": "media & content", "signal_score": 18.8, "authors": 12, "years": [2016, 2017, 2018, 2019, 2021, 2022, 2023, 2026], "pay_signals": 13.0, "avg_intensity": 2.38, "mentions": 13, "problem": "Listen r": "raffraffraff", "year": 2021, "thread": "Music Library and MusicBrainz Picard", "text": "I would pay for a music metadata service that stored tags, ratings and playlists. It wouldn't even have to provide music streaming at all, as long as it could integrate with YouTube, Spotify, Apple, Dropbox or local files. Something that treated a playlist with the same respect as an album, capturing creation date, comments, tags, author.\n\nIf I lost my whole music collection tomorrow, I could recover the actual tracks from Bandcamp/7Digital/rip etc. But my custom tags and ratings that I use to generate playlists, and the history of saved playlists found back over 15 years, would be impossible to recover."}, {"id": "28354512", "author": "stavros", "year": 2021, "thread": "Music Composition with Deep Learning: A Review", "text": "I don't know, I'd pay for something that gave me music I loved, 100% of the time (or, hell, even 2% of the time). Beats sifting through the infinite trove of music just so I can stumble upon something I like by chance. My success rate there is more like 0.1%."}], "key": "i42-Listeners would pay for "}, {"name": "Users would pay $10-20 a month for premium search that respects queries", "one_liner": "Draft: cluster not yet reviewed. Keywords: search, 10, unlimited, ad search, google, searchers", "draft": true, "verdict_score": null, "cluster": "search, 10, unlimited, ad search", "category": "consumer & home", "signal_score": 18.29, "authors": 11, "years": [2010, 2020, 2022, 2023, 2024], "pay_signals": 12.0, "avg_intensity": 3.17, "mentions": 12, "problem": "Users would pay $20 a month to escape frustrating modern search engines; Searchers would pay $50 a month for a search engine that saves hours by cutting useless results; Users would pay $10 a month for a privacy-respecting Google search replacement; Users would pay up to $5 a month for unlimited quality search; Users would pay $5 a month for search over a curated list of non-spam sites; Users would pay $5 a month for unlimited search with comparable quality", "quotes": [{"id": "29842008", "author": "spurgu", "year": 2022, "thread": "Kagi: A Premium Search Engine", "text": "I would happily pay $20/month to remove the massive frustrations I've had with modern search engines."}, {"id": "22848670", "author": "luckylion", "year": 2020, "thread": "Moving Away from Gmail", "text": "> - like Google search in 2008. I'll happily turn off your adblocker for you and be glad to see simple, relevant text ads. Or pay up to USD5 monthly if thats better (more if necessary and if the quality is good enough, although at some point I'd probably need to expense it.)\n\nI'd happily pay significantly more if it's good. The amount of time I'd save with a good search engine will easily be calculated in hours per month. $50 a month to save me 5 hours and lots of mental energy not spent on skimming useless results? Where do I sign up?"}, {"id": "39126384", "author": "davkan", "year": 2024, "thread": "Kagi search reached 20k paying members", "text": "Honestly I just pay for kagi because i find google to be a despicable company and every other search alternative is trash. Apart from YouTube, search was my last Google dependency and I’d happily pay $10/mo to get rid of it. Encountering Google search on an unconfigured browser now gives me ick feelings similar to when I occasionally have to go on to Facebook."}, {"id": "37560389", "author": "thesuitonym", "year": 2023, "thread": "Ask HN: How to do literal web searches after Google destroyed the “ ” feature?", "text": "That would be great. The $5 price point is the most I'd pay for search, but 300 searches per month is just not worth it in any sense. If all of the tiers moved down one step, or if Kagi offered a discount for annual membership, I could see it working for me."}], "key": "i43-Users would pay $10-20 a"}, {"name": "People would pay $2-3 a month for an app that reliably makes their photos look great", "one_liner": "Draft: cluster ilm SDK on a Camera Voids Its Warranty", "text": "I would happily pay a subscription for an iOS app. The usual argument against this is being commodified, but for the vast majority of the market, Canon has already been commodified in the shape of Apple and Samsung phones. They have to compete now on how good their hardware is, but their \"stupid\" hardware doesn't cut it without smart software. Their time in the broader marketplace is gone. They can get a small amount of marketshare back if they can make their hardware work with iPhones and Galaxies. Possibly just iPhones.\n\nI've got the cash for a great canon camera. I used to carry one around with me all the time. The size isn't what's stopping me. It's the UX."}, {"id": "15338780", "author": "Kiro", "year": 2017, "thread": "TensorFlow Examples for Beginners with Latest APIs", "text": "I would pay good money for a service where I upload a folder of images, gets an interface where I can classify each image one by one and then let ML classify the rest. Does this exist?"}], "key": "i44-People would pay $2-3 a "}, {"name": "Developers want a lightweight editor with IDE-grade refactoring and find-usages across many languages", "one_liner": "Draft: cluster not yet reviewed. Keywords: refactoring, code, developers, editing, collaborative, editor", "draft": true, "verdict_score": null, "cluster": "refactoring, code, developers, editing", "category": "developer tools", "signal_score": 18.17, "authors": 10, "years": [2018, 2022, 2023, 2024, 2025, 2026], "pay_signals": 6.0, "avg_intensity": 2.6, "mentions": 10, "problem": "Developers lack a CRDT-based version control system for both realtime and async collaborative editing; A VSCode-level code editor without telemetry or spyware.; Teams find large-scale refactoring in dynamic languages a huge pain without reliable static analysis; Rails developers want gradual typing and safer refactoring without losing productivity; Teams want high-quality real-time collaborative code editing; Developers want a lightweight editor with IDE-grade refactoring and find-usages across many languages", "quotes": [{"id": "47408374", "author": "josephg", "year": 2026, "thread": "Lies I was told about collaborative editing, Part 2: Why we don't use Yjs", "text": "> The biggest evidence against collaborative editing working and being useful is that programmers don't use it. We go through the pain of having git branches and manual merges.\n\nBut git branches are collaborative editing! They're just asynchronous collaborative editing.\n\nIt would be possible to build a git clone on top of CRDTs, which had the same merge conflict behaviour. The advantage of a system like that would be that you could use the same system for both kinds of collab. editing - realtime collab editing and offline / async collab editing. Its just, nobody has built that yet.\n\n> the fact that Google Docs style CRDTs have completely elided the profession speaks volumes about their actua"}, {"id": "44705474", "author": "bsder", "year": 2025, "thread": "Performance and telemetry analysis of Trae IDE, ByteDance's VSCode fork", "text": "> Why isn't there a decently done code editor with VSCode level features but none of the spyware garbage?\n\nBecause no other company was willing to spend enough money to reach critical mass other than Microsoft.  VSCode became the dominant share of practically every language that it supported within 12-18 months of introduction.\n\nThis then allowed things like the Language Server Protocol which only exists because Microsoft reached critical mass and could cram it down everybody's throat."}, {"id": "44098083", "author": "nasretdinov", "year": 2025, "thread": "You can choose tools that make you happy", "text": "The issue with dynamic languages mostly is that it's sometimes next to impossible to find all references to the code you're refactoring, so you can't just rely on a compiler & tests to ensure that nothing breaks after a change in some core library that everyone uses. Instead you almost have to add some logging into a function you're refactoring, make sure it's not used after you've made the change to a new API, and ideally do that a couple times. It's not too bad when you're the sole developer in a repository, but in the presence of hundreds of feature branches that sometimes can be weeks old, you can't be sure that nothing breaks after your change in the future too. So unless your code can "}, {"id": "43144841", "author": "troad", "year": 2025, "thread": "Why Ruby on Rails still matters", "text": "Thank you, I really, really appreciate the thoughtful answer.\n\nI've written APIs in Rust, they were performant but the dev experience is needlessly painful, even after years of experience using the language. I'm now using Rails for a major user-facing project, and while the dev experience is all sunshine and flowers, I can't shake the feeling that every line I write is instant tech debt. Refactoring the simplest Rails-favoured Ruby code is a thousand times more painful than refactoring even the most sophisticated system in Rust. I yearn for some kind of sensible mid-point.\n\nElixir seems extremely neat, but I've been blocked from seriously exploring it by (a) a sense that it may not be more a"}], "key": "i45-Developers want a lightw"}, {"name": "Users would pay for a legal Plex-like service to buy and stream owned media", "one_liner": "Draft: cluster not yet reviewed. Keywords: media, plex, piracy, convenient, legal plex, personal media", "draft": true, "verdict_score": null, "cluster": "media, plex, piracy, convenient", "category": "media & content", "signal_score": 17.99, "authors": 8, "years": [2012, 2021, 2022, 2023, 2025, 2026], "pay_signals": 8.0, "avg_intensity": 3.12, "mentions": 8, "problem": "Viewers would pay $200+ a month for a legal Plex-like service with all content, offline caching and one UI; Users would pay for media server software focused on personal media collections; Plex users would pay to strip pushed content from their personal media server; Users would pay for a legal Plex-like service to buy and stream owned media; Viewers would pay for a streaming UX as clean as auto-downloaded torrents; People would pay for media if paying were as convenient as piracy", "quotes": [{"id": "30922035", "author": "joshstrange", "year": 2022, "thread": "Plex launches feature to discover content across streaming services", "text": "100% this. I pay for all the streaming services and I would happily pay for shows/movies on a per-title basis but getting a DRM free version (or sometimes even a high quality version, some stuff doesn't get released on Blu-ray) is like pulling teeth. I've said more times than I can count \"I'd pay 200+/mo for a fully legal version of Plex\" (in this case referencing a platform that had all my shows, one UI/UX, ability to watch offline/cache locally, etc), it just doesn't exist."}, {"id": "46517309", "author": "ziml77", "year": 2026, "thread": "State of the Fin 2026-01-06", "text": "Accurate. I'd pay for Plex if I was supporting the development of software designed for watching your personal media collection. Genuinely I considered it not long ago, until I found out that they'd shifted away from caring about local media."}, {"id": "43440411", "author": "panick21_", "year": 2025, "thread": "Plex no Longer Offers Free Remote Playback for Personal Media", "text": "I would pay for Plex to disable all the bullshit they are trying to push into my experience."}, {"id": "43143961", "author": "shepherdjerred", "year": 2025, "thread": "Amazon now discloses you're buying a license to view Kindle eBooks", "text": "Oh what I’d pay for a 100% legal version of Plex (e.g. allows me to easily buy and stream my media)"}], "key": "i46-Users would pay for a le"}, {"name": "Readers would pay a premium for DRM-free ebooks", "one_liner": "Draft: cluster not yet reviewed. Keywords: readers, ebook, drm, books, ebooks, authors", "draft": true, "verdict_score": null, "cluster": "readers, ebook, drm, books", "category": "media & content", "signal_score": 17.85, "authors": 9, "years": [2010, 2011, 2012, 2022, 2023, 2025, 2026], "pay_signals": 10.0, "avg_intensity": 2.4, "mentions": 10, "problem": "Self-published authors would pay to convert manuscripts into both epub and print-ready trade PDFs; E-reader owners would pay for books if available as DRM-free ePubs; Readers would pay authors directly for cheap DRM-free PDFs instead of expensive locked ebooks; Self-published authors would happily pay for easy ebook and print-ready conversion; Readers would pay a premium for DRM-free ebooks; Readers would pay for reader-friendly formatted editions of free public domain great books", "quotes": [{"id": "3427141", "author": "halostatue", "year": 2012, "thread": "E-books Are Not That Easy", "text": "I'm sending you a note via email, but…how close to print-ready are the PDFs that are generated? My wife has been working on a novel (and 90%) of a sequel that we're getting ready to self-publish through Lulu and KDP and I'm tired from the formatting hoops.\n\nWe're using Ulysses (similar to Scrivener) and exporting to Word and importing to Pages (because the epub export was somewhat disappointing compared to the Pages epub export, and Pages layout tools are more powerful than Word's) because we need both epub and 6\"x9\" (US trade) print-ready PDF. She's got a cover and a back cover. She wants to have both ebook and hardcopy, and you guys don't offer hardcopy.\n\nI don't have the time to write the"}, {"id": "46327987", "author": "misterbishop", "year": 2025, "thread": "Amazon will allow ePub and PDF downloads for DRM-free eBooks", "text": "I love my Libra 2 reader, but I only use it to read epub files from questionable websites. I would pay for books if they were available as DRM-free epubs."}, {"id": "37531446", "author": "musicale", "year": 2023, "thread": "“Most notorious” illegal shadow library (LibGen) sued by textbook publishers", "text": "Pretty much this. I'd happily pay the author $7 for a PDF rather than $70 for a DRM-encumbered Kindle ebook (or $31 to \"rent\" it for a term.)"}, {"id": "3488533", "author": "halostatue", "year": 2012, "thread": "The Audacity of the iBooks Author EULA", "text": "iBooks 2 format is more or less ePub3, as I understand it. I could understand it incorrectly.\n\nI can also speak fairly highly of the leanpub team's process. My wife and I are finding it less than perfect for our needs in producing a fiction book with both ebook and print-ready book needs, but appreciate the directness and promptness with which both Scott & Peter have been responding to us when we are raising issues with what we're seeing.\n\nBetter yet, their conversion is free with no commitment to sell your book on leanpub required. I'd happily pay for what they're providing for free because it's so damned easy."}], "key": "i47-Readers would pay a prem"}, {"name": "Viewers would pay for one service with all movies, music and TV, DRM-free and ad-free", "one_liner": "Draft: cluster not yet reviewed. Keywords: viewers, movies, tv, content, 50, restrictions", "draft": true, "verdict_score": null, "cluster": "viewers, movies, tv, content", "category": "media & content", "signal_score": 17.83, "authors": 8, "years": [2017, 2018, 2019, 2020, 2021, 2023], "pay_signals": 8.0, "avg_intensity": 4.0, "mentions": 8, "problem": "Viewers would pay $50-100 a month for one streaming service with a unified UI and content that never disappears; Viewers would pay for one service with all movies, music and TV, DRM-free and ad-free; Viewers would pay more for a Spotify-like all-in-one service for TV, movies and sports; Viewers would pay one £25 subscription for all movies and TV instead of six services; Viewers would pay $30-50 a month for one global service with access to everything; Viewers would pay one bill to watch anything across all studios", "quotes": [{"id": "38437103", "author": "hotnfresh", "year": 2023, "thread": "Several piracy-related arrests spark fears of high-level crackdown", "text": "I’d happily pay $50/m for a streaming service with a single UI that had all the shit my piracy server does, and a guarantee that things won’t disappear (or at least a track record of that rarely happening). Hell, I might pay as much as $100/m. Maintaining the server and pirating stuff takes time, and hard drives cost real money.\n\nIt’s only the combo of money savings, higher quality (most steams are shit), unavailability of what I want (the best versions of several TV shows and movies are piracy exclusives, for one thing), and unified UI that make it worth it. Start chipping away at those, and it gets not-worth-it pretty fast. Apple tried with their unified streaming service UI on Apple TV, b"}, {"id": "29352150", "author": "ryandrake", "year": 2021, "thread": "Piracy release group EVO ‘blames’ movie industry for its popularity", "text": "Exactly. Here are my product requirements:\n\nUnrestricted access to all movies, music and TV shows ever made. Not 90%. Not 98%. Not \"all except a few we couldn't work out licensing agreements over\". All.\n\nHighest resolution/quality available at the time of release (DVD quality for 90s movies: OK. DVD quality for 2010 movies: NO)\n\nNo arbitrary device/OS limitations.\n\nCan watch/listen/download from any location on earth with sufficient bandwidth.\n\nNo ads embedded in the middle of the content.\n\nThat's it! Piracy offers all of the above for free, but I'd be willing to pay for this. Just release this product and take my money. The best part is, technology-wise, all of the above are solved problems"}, {"id": "29166816", "author": "thereisnospork", "year": 2021, "thread": "Opening this article voids warranty", "text": "This is one area where music has got it right, imo.\n\nThe value of a singular service with 'all' the content is higher than a plurality of services each with only a little. In other words I'd happily pay more per month for the Spotify of TV, movies, and sports that I currently do for a sampling of the usual streaming services."}, {"id": "23305224", "author": "Closi", "year": 2020, "thread": "GitHub reinstates Popcorn Time code", "text": "Definitely worth a comparison to the audio streaming market...\n\nMy Spotify subscription is £9.99 and gives me access to unlimited music from all artists (within reason - it’s very unlikely I find something not on there).\n\nI’m willing to pay more for a video subscription that gives me access to unlimited tv and movies.\n\nBut to get everything on streaming I have to buy:\n- Amazon Subscription\n- Netflix Subscription\n- Apple TV subscription\n- Disney+ Subscription\n- Now TV\n- TV licence (iPlayer)\n\nAnd after I have subscribed to all of these, there are still loads of movies and TV shows not covered.\n\nI would pay for one subscription that had the content mixed in. It would be better to have a single "}], "key": "i48-Viewers would pay for on"}, {"name": "Users would pay for a modern phone with a physical slide-out keyboard", "one_liner": "Draft: cluster not yet reviewed. Keywords: keyboard, physical, mobile keyboard, modern phone, physical keyboard, blackberry", "draft": true, "verdict_score": null, "cluster": "keyboard, physical, mobile keyboard, modern phone", "category": "consumer & home", "signal_score": 17.81, "authors": 8, "years": [2021, 2022, 2023, 2024, 2025], "pay_signals": 7.5, "avg_intensity": 2.75, "mentions": 8, "problem": "Users would pay for a good mobile keyboard for languages other than English; Phone buyers want a modern phone with a BlackBerry-style physical keyboard; Android users would pay for a keyboard app with excellent contextual self-learning prediction; Users want an open-source mobile keyboard with good, stable speech-to-text; Users would pay for a high-quality private swipe keyboard; Former BlackBerry users want a quality physical keyboard attachment for iPhone", "quotes": [{"id": "46234269", "author": "tasuki", "year": 2025, "thread": "iPhone Typos? It's Not Just You – The iOS Keyboard Is Broken [video]", "text": "> Why pay for a keyboard app when the default keyboard is already good enough?\n\nI'd pay for an actually good keyboard. I find the default keyboard (GBoard) atrocious for languages other than English."}, {"id": "44008803", "author": "thewebguyd", "year": 2025, "thread": "Material 3 Expressive", "text": "> You know what I wish I could get? A Blackberry phone with that keyboard (maybe KeyOne?). I wonder if there is anything like that still in production.\n\nYes! Before the iPhone came out my daily driver was a BlackBerry Bold. The keyboard was perfect, and it had the trackball (and later, trackpad) for text selection. Still not full size keyboard typing speed but pretty close. Then I switched to the first gen Moto Droid when it came out and it had the slide open landscape keyboard. Not as ergonomic as the black berry but it worked. Then after the first iPhone, everyone dumped physical keyboards and I'm still salty about it.\n\nI wish there was room in the mobile space to break apart the Samsung/A"}, {"id": "42404751", "author": "noAnswer", "year": 2024, "thread": "Unexpected Keyboard", "text": "The keyboard with the best prediction and self learning was my (first smartphone) Sony Xperia Z5 from 2015. I only realized it was a Sony specific app later in life. (I didn't understand auto correction memes until I got a work phone with a google keyboard.) Sadly they don't offer it as a stand alone app. I would pay for it.\n\nI have settled for FUTO Keyboard for now. Bevor that I used SwiftKey. (The Sony is still the only one where I did see contextual self-learning/prediction.)"}, {"id": "40831918", "author": "freedomben", "year": 2024, "thread": "FUTO Keyboard", "text": "I think this is a cool idea, and is something I would pay for, but I'm concerned about the (lack of) openness.  It's a lot harder than I would prefer to figure out these factoids for example:\n\n1.  FUTO Keyboard is licensed \"FUTO Source First License 1.0\"\n\n2.  FUTO Keyboard is a fork of the AOSP keyboard (called LatinIME).  LatinIME is open source, Apache licensed.\n\n3.  The source code is here:  https://gitlab.futo.org/alex/latinime/\n\nI'm not an open source purist, but the more central/fundamental the project is to my life/workflow, the more important that becomes to me.  A keyboard is pretty fundamental.  I'd love to have an open source keyboard that is good, especially with good speech to t"}], "key": "i49-Users would pay for a mo"}, {"name": "Musicians would pay for AI that generates harmonies they can reuse", "one_liner": "Draft: cluster not yet reviewed. Keywords: ai, musicians ai, musicians, music, generates, controllable", "draft": true, "verdict_score": null, "cluster": "ai, musicians ai, musicians, music", "category": "media & content", "signal_score": 17.62, "authors": 8, "years": [2022, 2023, 2024, 2026], "pay_signals": 7.5, "avg_intensity": 2.62, "mentions": 8, "problem": "Musicians want AI trained on their own unfinished project files to generate new material; Musicians would pay for AI tab, chord and lyric extraction with licensed output; Game and media makers want cheap AI voice acting with controllable emotion and custom voices; Music producers want controllable AI sample generation whose parameters can be fine-tuned after generation; Musicians would pay for AI that generates harmonies they can reuse; Music producers want AI in their DAW that generates variations and transitions from short ideas", "quotes": [{"id": "46606524", "author": "BrokrnAlgorithm", "year": 2026, "thread": "AI generated music barred from Bandcamp", "text": "I'm a musician, but am also pretty amused by this anti ai wave.\n\nThere was recently a post referencing aphex twin and old school idm and electronic music stuff and i can't help bein reminded how every new tech kit got always demonized until some group of artists came along and made it there own. Even if its just creative prompting, or perhaps custom trained models, someday someone will come along and make a genuine artistic viable piece of work using ai.\n\nI'd pay for some app which allows be to dump all my ableton files into, train some transformer on it, just to synthesize new stuff out of my unfinished body of work. It will happen and all lines will get blurred again, as usual."}, {"id": "41256012", "author": "tomcam", "year": 2024, "thread": "Show HN: Free Tools for Tabs, Chords, Lyrics Use 8 A100 GPUs", "text": "Mad props! So well executed. I would pay for this, especially if it were licensing the output (I think only lyrics would apply)."}, {"id": "41218155", "author": "Jensson", "year": 2024, "thread": "ChatGPT unexpectedly began speaking in a user's cloned voice during testing", "text": "> a voice assistant that starts making up its own prompts instead of listening to you is not a useful product\n\nThat would be way more useful than a voice assistant, with that you can replace voice actors for cheap! Many would pay good money for that product.\n\nThe important part is that you can ask it to do specific voice lines with specific feelings and voices. If it then starts to copy your voice lines afterwards that wont take from the fact that it generated the voice lines you wanted first. The censor that prevents it from using other voices prevents this use case."}, {"id": "39783429", "author": "chaosprint", "year": 2024, "thread": "Launch HN: Soundry AI (YC W24) – Music sample generator for music creators", "text": "Congratulations on your launch!\n\nI started music DRL (https://github.com/chaosprint/RaveForce) a few years ago. At that time, SOTA was still the \"traditional\" method of GANSynth.\n\nLater, I mainly turned to Glicol (https://glicol.org) and tried to combine it with RaveForce.\n\nThere are many kinds of music generation nowadays, such as Suno AI, but I think the biggest pain point is the lack of controllability. I mean, after generation, if you can't fine-tune the parameters, it's going to be really painful. As for pro, most of the generated results are still unusable. This is why I wanted to try DRL in the first place. Also worth checking\n\nhttps://forum.ircam.fr/projects/detail/rave-vst/\n\nIf this"}], "key": "i50-Musicians would pay for "}, {"name": "Users want offline interactive help that an LLM can search across local docs", "one_liner": "Draft: cluster not yet reviewed. Keywords: llm, local, local llm, retrieval, code, docs", "draft": true, "verdict_score": null, "cluster": "llm, local, local llm, retrieval", "category": "AI & ML tooling", "signal_score": 17.6, "authors": 8, "years": [2023, 2024, 2025, 2026], "pay_signals": 6.0, "avg_intensity": 3.0, "mentions": 8, "problem": "Companies want LLM tools that translate niche-language internal tools into maintainable mainstream code; Users want offline interactive help that an LLM can search across local docs; Local LLM users want a central place to share prompting tricks that make small models follow instructions; Developers want retrieval tooling for LLMs that properly ranks and chunks general text and source code; Developers want clean plain-text or Markdown software docs ready for LLM retrieval without scraping; Local LLM users struggle with prompt and instruct format handling", "quotes": [{"id": "41840322", "author": "ram_rar", "year": 2024, "thread": "Embedded Rust in Production?", "text": "> The reality was that these tools were unmaintainable by the rest of the company. Only the author \"knew\" Rust and it was hard to justify a new hire Rust developer to maintain this small set of tools.\n\nOnly If I had a dollar for everytime this happens. Choosing a language for the company is a business decision. we have a similar issue with Elixir and now the entire team is spending a quarter just to get rid of it. For anyone building startup on LLMs , this is one killer application I would pay for. The generated code doesn't event have to 100% correct, just right enough for devs to tweek would go a long way."}, {"id": "48045637", "author": "cookiengineer", "year": 2026, "thread": "Why most product tours get skipped", "text": "I never understood why there is no interactive Help program like there was in the \"old days\" when CHM files on Windows 95/98/XP were a thing. These CHM files and the interactiveness are heavily underrated, and they were some really good documentation, especially the ones from IDEs and compiler suites.\n\nToday I wish there was something like this but made for tutorials and wizards. If someone presses \"Help\" they should not have to go online on your website just to literally never find any help for their problems.\n\nWe are in the golden age of LLMs, yet nobody uses LLMs to explore and discover locally hosted knowledge bases ... which are in my opinion the single most useful use case of them. You"}, {"id": "46006142", "author": "nickreese", "year": 2025, "thread": "Olmo 3: Charting a path through the model flow to lead open-source AI", "text": "I'm just now moving my main workflows off openai over to local models and I'm starting to find that these smaller models main failure mode is that they will accept edgecases with the goal of being helpful.\n\nEspecially in extraction tasks. This appears as inventing data or rationalizing around clear roadblocks.\n\nMy biggest hack so far is giving them an out named \"edge_case\" and telling them it is REALLY helpful if they identify edgecases. Simply renaming \"fail_closed\" or \"dead_end\" options to \"edge_case\" with helpful wording causes qwen models to adhere to their prompting more.\n\nIt feels like there are 100s of these small hacks that people have to have discovered... why isn't there a centrali"}, {"id": "44107379", "author": "noosphr", "year": 2025, "thread": "Ask HN: Anyone struggling to get value out of coding LLMs?", "text": "For general text you run some type of vector search against the full-text corpus to see what relevant hits there are and where. Then you feed ion integration; Homeowners want API access to their communicating HVAC thermostats", "quotes": [{"id": "49831218", "author": "steveBK123", "year": 2026, "thread": "Owners mourn spoiled food after firmware update bricks Samsung smart fridges", "text": "There is SO much of this in IoT / smart / 2010s-2020s tech.\n\nRecent household BS:  music playing out of my thermostat.\n\nWife tried playing music out of Sonos, but the clunky app was laggy and had also signed her out of Spotify.  No problem, you can also just play direct from Spotify app into Sonos speakers.  She opens Spotify, selects \"Living Room\" and next thing you know our THERMOSTAT was playing music.\n\nNeither of us know this was possible, neither of us enabled it, apparently it's existed for years but for some reason Saturday was the day that \"Living Room\" thermostat beat out \"Living Room\" Sonos in the Spotify sort order.\n\nThere were product managers on both sides of that decision to pr"}, {"id": "45146097", "author": "xutopia", "year": 2025, "thread": "Nest 1st gen and 2nd gen thermostats no longer supported from Oct 25", "text": "This pisses me off to no end.  I paid a lot... I expected my Nest gear to work for as long as I own my house.  I paid extra to get someone to install it with my home system.  Now I see that my Nest Protect is saying it needs to be changed... not some small module... the whole thing.  Next will be my thermostats... I can't understand why I'd pay for them again."}, {"id": "18052618", "author": "GuB-42", "year": 2018, "thread": "Amazon pulled an Apple on the smart home", "text": "They didn't address the biggest \"pain point\" of \"smart homes\" aka home automation or domotics.\n\nThe biggest issue is the lack of a universal standard. A home is not a smartphone you can replace every 2 years. Things are measured in decades, and changes may require expensive and time consuming work in addition to the cost of the product itself.\n\nI looked into home automation when I had to work on an old house. I looked into KNX, which seemed to be a good standard: adopted by several manufacturers, robust, etc... The biggest problem, beside the price, is that I can't buy the hardware I want (ex: A/C unit) and expect it to connect to my network. Most of them don't have any smart feature, and th"}, {"id": "50452138", "author": "throwaway63467", "year": 2026, "thread": "Smart home devices should work without the internet", "text": "For serious smart home automation anything else is a nightmare, KNX is made to industrial standards and can be installed directly in the breaker box, most smart home devices aren’t cheap either I think most hubs cost at least 200-400 USD and you need actors, a large 24 channel KNX actor costs maybe 400 USD and is enough to switch all lights in a small to medium house. And again you program that stuff once and can forget about it, I know installations that have been running for 10 years plus without any kind of maintenance, the tech is designed to last 30-50 years, while most smart home gadgets are just trash after 5-10 years, look at all the defunc and obsolete stuff there is. With that in m"}], "key": "i58-Smart home owners want c"}, {"name": "Readers want a personal front-end that aggregates blogs and news", "one_liner": "Draft: cluster not yet reviewed. Keywords: blogs, news, feed, aggregates, curated, readers", "draft": true, "verdict_score": null, "cluster": "blogs, news, feed, aggregates", "category": "media & content", "signal_score": 17.25, "authors": 8, "years": [2019, 2020, 2023, 2024, 2026], "pay_signals": 5.5, "avg_intensity": 3.0, "mentions": 8, "problem": "A service that aggregates local events from papers, businesses and social feeds into one filterable view.; Readers want a hierarchical news digest by period, region and domain with quality sources across the spectrum; People want curated local news and event listings aggregated in digital feeds; A curated, expert-moderated short-form social feed with the quality of a strict subreddit.; Users want a feed of witty, intelligent blogs and sceptical news, like the early web; Readers want a blog platform with quality recommendations and search with time filtering", "quotes": [{"id": "41296643", "author": "solardev", "year": 2024, "thread": "Ask HN: What is a simple paid app / webapp that you wish existed?", "text": "Just one random pain point for me: I often wish there was an easy way to find local events both in the city where I live and when I travel. Usually I have to try to find a local paper or two and then see if they have an event calendar, but it's not always successful, then it's also a matter of checking the visitor's center, chamber of commerce, etc. And of course there's social media, and lots of local businesses only post their events on their own feeds and not even their websites anymore :(\n\nI wish there was a service that could scrap all these local papers and such and present a simple events view, with good filtering, that also point back to the original sources. I'd be happy to pay $5-$"}, {"id": "23987926", "author": "the_duke", "year": 2020, "thread": "TheirTube – How do the recommended videos look on their Youtube home page?", "text": "With all our media resources and technology, it's crazy that there is no easy way to answer questions like \"what happened politically in France in the last month?\",  \"what were the economic developments in Africa in the last quarter?\" or \"what were the biggest battery technology advances in the last year?\".\n\nWith the barrage of news it is very easy to miss a lot, especially if you want to keep up with multiple domains and geographical regions.\n\nI would love some  hierarchical listing  that shows the most important news items for different time periods (week,  month, quarter, year), and filterable by domain (eg business, economy, politics, science, technology, ...).\n\nOne should be able to  co"}, {"id": "41964788", "author": "jll29", "year": 2024, "thread": "Inside the Transport for London cyberattack", "text": "Are people really no longer interested in what happens locally?\n\nI would pay for local news, even about places that I no longer live, but used to live and still have a passing interest in. But perhaps I would want to receive it as XML feed.\n\nEven events (concerts, readings, exhibitions, screenings etc.) are typically scattered across many smaller lists or mailing lists, depending on location. For example, there is way more going on in London than what is listed by Time Out:\nhttps://www.timeout.com/london/things-to-do/london-events-in...\nLocal communities may have their own sites or still rely on paper flyers.\n\nSome facts of communal interest are published in government outlets that are still"}, {"id": "40489606", "author": "arlcode", "year": 2024, "thread": "Twitter is now attention roulette and ultimately meaningless", "text": "I wish there was a Twitter currated and moderated like /r/historians is on reddit. The answers you are getting are not always correct and sometimes you dont' get one at all (either because no expert can answer or the question is unsanswerable in the first place) but they are always reasoned, calm and thought out.\n\n(And yes I realize the irony posting this on a social media webpage).\n\nUltimately most people and their takes are really really boring and \"freedom of speech absolutism\" (as Twitter nowadays sees itself) leads to interesting, well researched and novel thoughts being drowned out by the mass garbage stuff.\n\nI really don't understand why some people (like the current Twitter CEO) seem"}], "key": "i59-Readers want a personal "}, {"name": "Infra teams find Kubernetes a nightmare to manage and want simpler VMware replacements", "one_liner": "Draft: cluster not yet reviewed. Keywords: kubernetes, teams, simpler, aws, teams tooling, nightmare", "draft": true, "verdict_score": null, "cluster": "kubernetes, teams, simpler, aws", "category": "devops & infra", "signal_score": 17.16, "authors": 9, "years": [2017, 2020, 2021, 2022, 2023, 2024, 2025, 2026], "pay_signals": 3.0, "avg_intensity": 3.0, "mentions": 9, "problem": "Teams find recovering self-managed Kubernetes clusters and expiring certs a nightmare; Kubernetes teams on AWS find node pool management and upgrades manual and slow; Infra teams find Kubernetes a nightmare to manage and want simpler VMware replacements; A simpler way than Helm charts to deploy self-written services to Kubernetes.; Simple CI-driven deploys for a multi-service app on one big server without Kubernetes.; Teams migrating legacy Java EE servers struggle to containerize them for Kubernetes", "quotes": [{"id": "39281408", "author": "0xbadcafebee", "year": 2024, "thread": "Learnings from our years of Kubernetes in production", "text": "You aren't a real K8s admin until your self-managed cluster crashes hard and you have to spend 3 days trying to recover/rebuild it. Just dealing with the certs once they start expiring is a nightmare.\n\nTo avoid chicken-and-egg, your critical services (Drone, Vault, Bind) need to live outside of K8s in something stupid simple, like an ASG or a hot/cold EC2 pair.\n\nI've mostly come to think of K8s as a development tool. It makes it quick and easy for devs to mock up a software architecture and run it anywhere, compared to trying to adopt a single cloud vendor's SaaS tools, and giving devs all the Cloud access needed to control it. Give them access to a semi-locked-down K8s cluster instead and t"}, {"id": "27976953", "author": "jrockway", "year": 2021, "thread": "Docker in Production: A History of Failure (2016)", "text": "The biggest pain point is having to manually use cloudformation to create node pools.  This is especially irritating when you just need to roll the Linux version on nodes -- takes half a day to do right.  In GKE, it's just a button in the UI (or better, an easy-to-use API), and you can schedule maintenance windows for security updates (which are typically zero downtime anyway, assuming you have the right PodDisruptionBudgets).  I think AWS fixed that.  I remember when I used it, they said they had some new tool that would handle that, but you had to re-create the cluster from scratch.  This was a couple years ago, and is probably decent nowadays.\n\nThere are other warts, like certain storage "}, {"id": "49928177", "author": "danudey", "year": 2026, "thread": "Red Hat being phased out of existence?", "text": "Their goal is to create a system that's easy to run and manage even if you don't really know much about k8s - which I guess is a common thing, since k8s is a nightmare to manage directly until you learn everything about everything.\n\nMore importantly, they want to build an ecosystem around their ecosystem around k8s. They want people publishing their software to work on OpenShift (e.g. in the operator catalog), they have certification processes for software compatibility (e.g. CNI certification), and now that they've come as far as they have they're going after VMWare's lunch, madly scooping up every customer they can get their hands on to try to offer them a user-friendly kubevirt implementa"}, {"id": "45924147", "author": "buster", "year": 2025, "thread": "Helm 4.0", "text": "I think we are having different contexts here.\nI am mostly talking about selfwritten services and how writing, maintaining and deploying helm charts for them is a nightmare.\n\nRegarding dependencies: Using some SaaS Kubernetes (Google GKE) for example, you'll typically use terraform for SQL and other Services anyway (atleast we do use Google CloudSQL and not some selfhosted postgres in k8s).\n\nI find it interesting that cert-manager points to kubectl for new users and not helm: https://cert-manager.io/docs/installation/\n\nBut, for sure, there may be reasons to use helm, as you said. I'm sure it is overused, though."}], "key": "i60-Infra teams find Kuberne"}, {"name": "A search engine that returns direct answers instead of padded SEO articles, with user downvotes for spam.", "one_liner": "Draft: cluster not yet reviewed. Keywords: search engine, engine, search, results, spam, personal search", "draft": true, "verdict_score": null, "cluster": "search engine, engine, search, results", "category": "consumer & home", "signal_score": 17.13, "authors": 10, "years": [2016, 2020, 2021, 2022, 2023, 2026], "pay_signals": 6.0, "avg_intensity": 3.2, "mentions": 10, "problem": "A mid-2000s style search engine where users can downvote SEO spam blogs.; A search engine that returns direct answers instead of padded SEO articles, with user downvotes for spam.; A search engine that strips referral and affiliate spam from results.; A search engine that lets you permanently exclude chosen domains from results.; Searchers would switch to a search engine that honors literal queries by default; Users would pay for a personal search engine over their own site list with custom crawling modules", "quotes": [{"id": "36197937", "author": "mostlysimilar", "year": 2023, "thread": "Google no longer automatically indexes websites?", "text": "> I wish there was a search engine that ran like mid 2000s google but with a social media component so you can down vote SEO spammer blogs into oblivion.\n\nI want this too, but I think an often understated aspect of this issue is that by this point Google has absolutely trashed the web of that era. In these threads people will say \"the content you want isn't out there, it's all on social media now\" -- and they're largely right, but I think Google is the party most responsible for mutilating the web to the state it is in now, and users fled to social media partly because it seemed like a safe haven.\n\nWhat we need is a concentrated effort to rebuild the web. Take the best parts of what we've le"}, {"id": "36197177", "author": "throwaway894345", "year": 2023, "thread": "Google no longer automatically indexes websites?", "text": "I used DDG for a while, but DDG's quality fell precipitously a few years ago (similar issues where it ignores quotes and won't find pages even if you search for the title string exactly, etc) and I eventually came back to Google which has also been increasingly frustrating.\n\n> I wish there was a search engine that ran like mid 2000s google but with a social media component so you can down vote SEO spammer blogs into oblivion.\n\nThere's no way this won't get abused, but the SEO stuff is out of control. Not even spammer blogs, but if you have a quick question like \"how do I check tire pressure\" you will only get articles that start with a treatise on the entire history of car tires and the answ"}, {"id": "29791811", "author": "razemio", "year": 2022, "thread": "Show HN: No Trash Search", "text": "Yes, a product which cleans my search from most referral sites is something I would pay for."}, {"id": "29155341", "author": "rpastuszak", "year": 2021, "thread": "Pinterest ruined photo search on the internet", "text": "I’d pay for a search engine that would allow me me to automatically exclude certain domains from search results."}], "key": "i61-A search engine that ret"}, {"name": "Developers want a fast, embeddable scripting language with static typing, big integers and good tooling", "one_liner": "Draft: cluster not yet reviewed. Keywords: scripting, language, scripting language, embeddable, shell, developers", "draft": true, "verdict_score": null, "cluster": "scripting, language, scripting language, embeddable", "category": "developer tools", "signal_score": 17.11, "authors": 9, "years": [2021, 2022, 2024, 2025, 2026], "pay_signals": 3.5, "avg_intensity": 2.4, "mentions": 10, "problem": "Developers want an easily embeddable scripting language with integer types and a C FFI for app plugins; Developers want a scripting language with shell-style pipes, redirection and safe argument handling but sane syntax; A shell-like scripting language with simple concurrency, serialization and terseness.; A portable scripting language for installers and build systems that behaves the same on every OS.; Developers want a fast, embeddable scripting language with static typing, big integers and good tooling; Developers want an embeddable config and scripting language with static types and zero-based arrays", "quotes": [{"id": "45716974", "author": "pcfwik", "year": 2025, "thread": "Wren: A classy little scripting language", "text": "I once considered Wren for a situation where I (to a first approximation) wanted to allow users to write 'plugins' that link against my internal C application symbols but using a language focusing more on ease of use (rather than C).\n\nUnfortunately, neither Wren nor any of the other major 'embeddable scripting languages' (e.g., Lua) were really a good fit for this, because they commit fully to the 'all-numbers-are-floats' thing and generally don't seem to even try to provide a general equivalent to the C++ `extern \"C\" { ... }` thing.\n\nOf course, I know this isn't really the target use case of Wren/Lua/etc., but if anyone knows of a good embeddable scripting language for this I'd love to hear"}, {"id": "45423489", "author": "OskarS", "year": 2025, "thread": "The ABS programming language", "text": "The superpower of shell scripting languages is not just that it's easy to run external processes, it's also that you can run them extremely flexibly: chain them into pipelines, run them in background, redirecting streams, process substitution, etc. These kinds of things is why \"just use Python or whatever!\" is not always a great answer to \"shell scripting sucks\" (which it does, I agree). I mean, you CAN do all those things in Python, but it's a huge pain in the ass to write compared to the dedicated syntax of shell scripting.\n\nIf the developers of ABS are reading this, it would be great some examples of that kind of thing to the homepage. Like, how would you do `curl <url> | grep something |"}, {"id": "44098917", "author": "crabbone", "year": 2025, "thread": "TIL: timeout in Bash scripts", "text": "Neither Python nor Ruby offer a simple interface to concurrency, serialization and terseness. Not even close. And aren't moving in the desired direction. Perl could have tried... but it's a separate can of worms, and still not quite there.\n\nPowerShell is a missed opportunity. A project with a ton of resources dedicated by a company with bottomless coffers... which ended up being sub-par.\n\nI wish there was a sensible alternative, but I haven't found one yet."}, {"id": "31165382", "author": "t43562", "year": 2022, "thread": "Hush, a modern shell scripting language", "text": "For me the reason for pursuing scripting languages over sh is because of multi-platform projects that I've had to support in the past where every little shell nuance, every tool nuance has introduced bugs in one platform or the other.  It's too easy to create problems and too time consuming to find them.  You need special resources to test/debug and so on.\n\nThe installer and the build system were the areas that caused the most pain - e.g. trying to debug build errors because some system has a slightly different version of some tool like sed.....\n\nI felt that including a portable language in the installer would mostly eliminate this problem since one could eliminate the use of these hard-to-s"}], "key": "i62-Developers want a fast, "}, {"name": "Mac users want consistent window tiling, a snappy Settings app and the ability to uninstall default apps", "one_liner": "Draft: cluster not yet reviewed. Keywords: window, mac, window snapping, snapping, default, management", "draft": true, "verdict_score": null, "cluster": "window, mac, window snapping, snapping", "category": "productivity & work", "signal_score": 17.1, "authors": 9, "years": [2022, 2023, 2024, 2025, 2026], "pay_signals": 4.0, "avg_intensity": 2.56, "mentions": 9, "problem": "iPad users lack a sane default window management model; macOS users want native drag-to-side window snapping; Mac users find window and desk ktop GUI Minimalism", "text": "I have a Mac and a Linux box for work.  I have been using my Macbook for some AI work I'm doing, but my workflow has been a mess.  I had 4 desktops going, 2 projects opened w/debugging, many browser tabs opened to various docs, MS Teams, Outlook, etc.  I don't even run Apple music anymore because it makes my laptop too hot.\n\nOn my mac the desktops constantly change position for unknown reasons.  Managing windows is a huge pain on each desktop because it's very easy to obscure them... there is also a ton of wasted space with so much gui noise.  CMD tabbing through apps is tedious and inflexible.\n\nI posted some screenshots of my Linux setup in a different comment.  My Linux workflow is night a"}, {"id": "36374427", "author": "SebastianKra", "year": 2023, "thread": "Ask HN: Why does Apple refuse to add window snapping to macOS?", "text": "I always feel like Apple must have some grand 1000IQ concept for window management and I just don't get it. Stage Manager, Spaces, Mission Control, Expose, Window Zooming, Hiding, Minimizing (which is different from Hiding), Fullscreen/Splitscreen... yet the first thing I do is install a third-party window manager.\n\nI tried for months to go vanilla and get my head around the features. But why, why do fullscreen windows create their own space when I want them to exist within a space? Why can't I briefly bring up Finder on top of my fullscreen window? Why are there lengthy animations to switch between spaces? Why do CMD+Tab and CMD+` have a million special rules for which windows they select? "}], "key": "i63-Mac users want consisten"}, {"name": "Rust developers would pay for a fast Sublime Text debugger plugin as an alternative to VS Code", "one_liner": "Draft: cluster not yet reviewed. Keywords: debugger, vs code, vs, developers, ide, code", "draft": true, "verdict_score": null, "cluster": "debugger, vs code, vs, developers", "category": "developer tools", "signal_score": 17.0, "authors": 7, "years": [2019, 2021, 2022, 2023, 2025, 2026], "pay_signals": 6.5, "avg_intensity": 2.86, "mentions": 7, "problem": "Developers would pay for a standalone cross-platform debugger extracted from an IDE; Rust developers would pay for a fast Sublime Text debugger plugin as an alternative to VS Code; Linux C++ developers would pay for a fast, stable visual debugger like RemedyBG; Developers would pay for a terminal text editor that supports the VS Code extension API; Developers would pay for a VS Code with IntelliJ-level language plugins and remoting; Lisp developers would pay once, without DRM, for a full modern Lisp IDE with completion and a debugger", "quotes": [{"id": "43915025", "author": "WhereIsTheTruth", "year": 2025, "thread": "CLion Is Now Free for Non-Commercial Use", "text": "I wish they'd extract the debugger and release it as a crossplatform standalone tool, i'd pay for it"}, {"id": "42863284", "author": "culebron21", "year": 2025, "thread": "I still like Sublime Text", "text": "I'm happy with the most of the features, bought v2, 3 & 4 over the last 13 years, but it lacks debugger, so for Rusti, I have to use VS Code -- which is awful, but there's no better alternative. I'd pay for a special plugin that will work faster than VS Code."}, {"id": "37013552", "author": "the-smug-one", "year": 2023, "thread": "Green vs. brown programming languages (2021)", "text": "I'm a C++ dev also, and I don't agree with you! I use clangd, gdb, dynamic analysis tools, no static analysis tools (other than compiler warnings). The help I've gotten from Rust analyzer compared to clangd is pretty large, imho. Rust restraining itself means that our tooling gets to be more free.\n\nAlso, gdb is... Not that great. Yes, it definitely does debug my app and in that sense it is great. It is however pretty unstable and gets into weird state I cannot get out of, gdb/mi is a mess, and the text interface (TUI) is not performant enough. I'm still very happy that I have it, but when I look at RemedyBG I get jealous. I'd pay for an equivalent to RemedyBG on Linux, if it was FOSS."}, {"id": "30851975", "author": "ilrwbwrkhv", "year": 2022, "thread": "Zee: A modern text editor for the terminal written in Rust", "text": "I love text editors. Can someone create one which can also work with the vs code extension API? I would pay for something like that."}], "key": "i64-Rust developers would pa"}, {"name": "A Mac file browser with sane new-folder placement, sorting and Enter-to-open.", "one_liner": "Draft: cluster not yet reviewed. Keywords: file, finder, mac, mac file, enter open, folder", "draft": true, "verdict_score": null, "cluster": "file, finder, mac, mac file", "category": "productivity & work", "signal_score": 16.95, "authors": 9, "years": [2020, 2021, 2022, 2024, 2025, 2026], "pay_signals": 3.0, "avg_intensity": 2.56, "mentions": 9, "problem": "A standard Parquet-compatible file format optimized for cheap row-by-row appends.; Mac users want Finder features like cut and delete keys, showing all folders, and disabling scroll acceleration; A Mac file browser with sane new-folder placement, sorting and Enter-to-open.; A plain file-browsing mode in Jellyfin instead of error-prone metadata auto-detection.; Mac users want a polished Finder replacement with smart column widths and window memory; Safer, friendlier command-line file utilities with sane defaults between raw coreutils and a file manager.", "quotes": [{"id": "46997247", "author": "amluto", "year": 2026, "thread": "Apache Arrow is 10 years old", "text": "You can do row by row appends to a Feather (Arrow IPC — the naming is confusing). It works fine.  The main problem is that the per-append overhead is kind of silly — it costs over 300 bytes (IIRC) per append.\n\nI wish there was an industry standard format, schema-compatible with Parquet, that was actually optimized for this use case."}, {"id": "45594050", "author": "Sohcahtoa82", "year": 2025, "thread": "Apple M5 chip", "text": "> - Finder is very mediocre comparing to even File explorer in Windows\n\nIt really is awful.  Why the hell is there no key to delete a file?  Where's the \"cut\" option for moving a file?  Why is there no option for showing ALL folders (ie, /bin, /etc) without having to memorize some esoteric key combination?\n\nFor fuck's sake, even my home directory is hidden by default.\n\n> - Scrollbar and other UI issues\n\nDisappearing scrollbars make sense on mobile where screen real estate is at a premium and people don't typically interact with them.  It does not make sense on any screen that you'd use a mouse to navigate.\n\nFor years, you couldn't even disable mouse acceleration without either an esoteric co"}, {"id": "41497933", "author": "greatgib", "year": 2024, "thread": "Gnome Files: A detailed UI examination", "text": "In my opinion, OS X Finder is the most defective file browser of them all.\n\nIt always makes me laugh when some people believe the marketing of Apple saying that their OS is the most ergonomic when it is totally not the case.\n\nThings like creating a new folder is a nightmare, if you are in the kind of a tree view and try to create a folder or paste a file, it will end up in the top parent folder.\n\nWhen you sort by recent date it does not make any sense: you have files from the most recent to the oldest, but for a given day, like the last day or week, they are ordered in the opposite way (oldest to newest).\n\nThere are hundreds of other stupid decisions like that.\n\nIn the same way, who had this"}, {"id": "39939390", "author": "shiroiushi", "year": 2024, "thread": "Plex Asks GitHub to Take Down 'Reshare' Repository over Piracy Fears", "text": "I haven't tried Plex, and use Jellyfin, but I have to say, the UI on Jellyfin is absolutely atrocious.\n\nI wish there was simply a way to make it show me the files I have available, for instance.  There seems to be no way to do that.  Instead, it insists on auto-detecting everything and then showing some preview image for that
