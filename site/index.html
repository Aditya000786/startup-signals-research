o live up to the promises of the product.\n\nThe baked in communication style of these models is so obnoxious it's impacting my work. The best way I can describe it is that everything is optimized to impress the user and make the agent sound more authoritative, but t"}, {"id": "35743665", "author": "sharonzhou", "year": 2023, "thread": "Launch Lamini: The LLM Engine for Rapidly Customizing Models as Good as ChatGPT", "text": "Hi HN!\n\nI’m super excited to announce Lamini, the LLM engine that gives every developer the superpowers that took the world from GPT-3 to ChatGPT!\n\nI’ve seen a lot of developers get stuck after prompt-tuning for a couple days or after fine-tuning an LLM and it just gets worse—there’s no good way to debug it. I have a PhD in AI from Stanford, and don’t think anyone should need one to build an LLM as good as ChatGPT. A world full of LLMs as different & diverse as people would be even more creative, productive, and inspiring.\n\nThat’s why I’m building Lamini, the LLM engine for developers to rapidly customize models from amazing foundation models from a ton of institutions: OpenAI, EleutherAI, C"}, {"id": "49409020", "author": "shostack", "year": 2026, "thread": "Why your local LLM feels dumber than it is", "text": "Debugging any LLM output when you also have done substantial harness engineering is a total pita and I wish there were better tools for it to isolate issues.\n\nI spent ages tracking down start appears to be an issue with the current Deepseek v4 flash 0731 version that would cause it to output giant walls of gibberish in Hermes with reasoning turned on."}, {"id": "48075833", "author": "TACIXAT", "year": 2026, "thread": "Read Programming as Theory Building", "text": "This is helps describe my biggest pain point when engineering a program with LLMs. They do not have the full theory of the program, which makes things difficult. Additionally, the more hands-off approach to programming (even when I try to maintain involvement as much a tical in my life mission-critical payment without the pain of migrating to a new email provider.\n\nShut up and take my money, Google."}, {"id": "13952767", "author": "dhd415", "year": 2017, "thread": "Google Talk Is Being Discontinued", "text": "I'm pretty concerned about their commitment to Google Voice functionality, too. I'm so invested in that ecosystem that I don't even know what my carrier number is anymore. I'd happily pay money for the service, but I don't think Google is interested in a subscription model for it. Does anyone know of third-party products with similar functionality? I dread the thought of having to figure something out on short notice."}, {"id": "41255220", "author": "stogot", "year": 2024, "thread": "Google is a monopoly – the fix isn't obvious", "text": "I’d pay for consumer tier (which we’ll pretend was the former free tier) if I got proper customer service number I could call. I don’t use it enough to pay for a business tier"}, {"id": "25620611", "author": "wojciii", "year": 2021, "thread": "Apple reverses stance on Amphetamine App", "text": "I don't use apple products. Voting with your wallet is the only kind of voting the corporates understand.. besides shitstorms on social media.\n\nI use Android but will pay for a Linux phone as soon as one can be bought here in Denmark (importing can be really expensive) and I would happily pay a monthly fee to not be tracked/targeted (be free of Google at last)."}], "key": "i68-Users would pay monthly "}, {"name": "People with ADHD want ways to direct hyperfocus toward the right work", "one_liner": "Draft: cluster not yet reviewed. Keywords: adhd, hyperfocus, help, repeatable, configurable, missed", "draft": true, "verdict_score": null, "cluster": "adhd, hyperfocus, help, repeatable", "category": "health & fitness", "signal_score": 16.7, "authors": 7, "years": [2016, 2021, 2022, 2023, 2025, 2026], "pay_signals": 5.0, "avg_intensity": 3.43, "mentions": 7, "problem": "People with ADHD need calendar alerts with escalating classes that cannot be missed; People with ADHD need effective help starting tasks they care about; Workers with ADHD struggle with logistics like scheduling and minutes that secretaries used to handle; People with ADHD want ways to direct hyperfocus toward the right work; People with ADHD want help steering hyperfocus toward rewarding activities; People with ADHD would pay for a configurable repeatable-checklist app", "quotes": [{"id": "36991776", "author": "gtowey", "year": 2023, "thread": "Cognitive AI for ADHD", "text": "Google calendar is actually terrible for people with focus problems. Or at least I haven't found a good way to manage its alerts in a helpful way.\n\nFor one, basically all alerts are the same.  Meaning there's no good way to make noisy alerts for critical events and quiet ones for mundane things. You can set multiple alerts for an event, like 1 week before, 1 day before, etc. But it's manual every time.\n\nSomething more like PagerDuty style alerts that let you set up classes of alert patterns would help. Alerts that blow up your phone until you get them would help. It's so easy to have the calendar alerts go completely unnoticed with just a chime if your phone is in your pocket or in another r"}, {"id": "34659542", "author": "Bjartr", "year": 2023, "thread": "I hired 5 people to sit behind me and make me productive for a month", "text": "> If it really meant a lot, it wouldn't be a challenge to actually do it.\n\nDear god I wish this were true. You have no idea. Hell, I would pay good money right this second to make it true for myself.\n\nOne of the major struggles of ADD is having things you actually care about being challenging to do. Doesn't matter how important, your brain just says \"nope\".\n\nI struggle with this constantly. Things I truly care about, or which are exceedingly important are a huge uphill battle just to put any effort at all towards them.\n\nIn general in the replies here there are a lot of people who aren't aware that other people might experience life differently from them."}, {"id": "33964826", "author": "pwpw", "year": 2022, "thread": "The silent struggles of workers with ADHD", "text": "I wonder if the workplace has gradually become worse for ADHD workers as the number of secretaries continues to decline[0]. Anecdotally, early in my career when I had little sway, I was often tasked with scheduling meetings, taking minutes, and keeping track of various things on behalf of my boss while still having to perform my own job. I think this sort of role would have been previously handled by a secretary that workers at my boss’ level no longer have access to.\n\nKeeping track of that logistical stuff is a nightmare and is directly incompatible for most with ADHD. And then as the ADHD worker progresses in their career, they no longer get a secretary who would have offloaded these incom"}, {"id": "49616420", "author": "98codes", "year": 2026, "thread": "I-have-ADHD: A skill to stop coding agents from burying the answer", "text": "When you can align hyperfocus with your most beneficial vector of productivity, it's like you can accomplish anything, in half the time thought possible.\n\nProblem is, there is no good way to direct the hyperfocus demon. It likes what it likes, it wants what it wants, and that's that.\n\nMedication helps to save a pile of willpower/spoons/executive function safely from the demon so that we can get things that need doing done."}], "key": "i69-People with ADHD want wa"}, {"name": "Job seekers would pay for an AI service that applies to jobs automatically", "one_liner": "Draft: cluster not yet reviewed. Keywords: ai, 20, job, 100 ai, employee, ai assistants", "draft": true, "verdict_score": null, "cluster": "ai, 20, job, 100 ai", "category": "AI & ML tooling", "signal_score": 16.68, "authors": 7, "years": [2018, 2022, 2023, 2024], "pay_signals": 7.0, "avg_intensity": 3.0, "mentions": 7, "problem": "Individuals would pay $10-20 for fast AI revi teresting use case, web monetization API.\n\nhttps://webmonetization.org\n\nIt is a proposed standard (not accepted) that allows you to use micro-payments in crypto to pay for access to sites as you browse the web. While it isn't perfect, a web free of paywalls and ads is something I would pay for, if it was easy to use, secure, and integrated into the browser. I'm not sure it will have enough momentum to become a thing, but it is an interesting idea.\n\nAnd, to your point, the only legit use case for crypto I have seen."}, {"id": "27065437", "author": "echelon", "year": 2021, "thread": "Why I Work on Ads", "text": "> The alternative of paying $9.99/month for Youtube...\n\nI do pay for YouTube Red, and it's worth it to not see ads.\n\n> micropayments for each search query or a \"Google Search Engine yearly subscription\"\n\nI would pay for this, too.\n\n> ... or Patreon donations for video content ...\n\nI do it for music. It feels really good to support creators directly.\n\nAds are the worst, and I adblock everything.\n\nI'd happily pay for web content if there were microtransactions. Either that, or a content marketplace that disburses based on views or some other accounting."}], "key": "i71-Users would pay for brow"}, {"name": "Android users want app store search by privacy and would pay for honest ad-free apps", "one_liner": "Draft: cluster not yet reviewed. Keywords: android, store, filter, android filter, play store, play", "draft": true, "verdict_score": null, "cluster": "android, store, filter, android filter", "category": "consumer & home", "signal_score": 16.45, "authors": 7, "years": [2019, 2022, 2023, 2025, 2026], "pay_signals": 5.0, "avg_intensity": 2.71, "mentions": 7, "problem": "Android users searching apps by name get scam or copycat ads and lack a real Play Store alternative with mainstream apps; Android power users want an app store curated to exclude apps with ads, microtransactions and excessive permissions; Android users want to filter out app s; Users would pay $50 a year for private, convenient email on custom domains; Low-income users want affordable privacy-focused email; Users would pay for temp email bundled with a throwaway domain", "quotes": [{"id": "39304147", "author": "AdmiralAsshat", "year": 2024, "thread": "Mozilla names new CEO as it pivots to data privacy", "text": "Still waiting for a Mozilla-branded email domain/provider. They've already got their Mozilla-branded partnerships with the VPN and now the data scrubber. Not sure why they're sleeping on email. That seems like an obvious thing that I would pay for."}, {"id": "31523376", "author": "cowtools", "year": 2022, "thread": "Proton is trying to become Google without your data", "text": "I mean, they are legally obligated to. At least they are not selling my data to advertisers or arbitrarily locking me out of my account like google. Hell, i'd pay for their premium service if wasn't so expensive and they accepted anonymous payments through monero or something.\n\nI mean, this is what email has basically come to. I've tried to host my own email server, all my outbound mail ends up in spam. If you want privacy, use PGP\n\nEdit: please don't downvote this parent comment, I think it is still a pretty reasonable concern"}, {"id": "4885903", "author": "bad_user", "year": 2012, "thread": "Google Apps stops accepting free sign-ups", "text": "I use Google Apps because I want to use GMail, but with my own domain. That's it.\n\nI'm not an enterprise. I don't need more support than regular GMail users. I don't have special needs, like managing what services are allowed. I just don't want a @gmail.com address.\n\nI see people here defending this move, but think of how services like Google+ make mandatory an email address that's managed by Google. That email address will now have to be a @gmail.com address for regular users. Now think of how you can register with any email address on Facebook or Twitter, an email address which becomes your online ID.\n\nBy using your own domain with your own email address, if the email provider interrupts t"}, {"id": "4884845", "author": "edj", "year": 2012, "thread": "Google Apps stops accepting free sign-ups", "text": "I'm not sure if I'm parsing this correctly, but it sounds like people who use Google Apps as an email backend for personal email on custom domains will now have to pay $50/year.\n\nIf so, that's a huge bummer. I only recently switched to running my email this way and I don't relish the thought of migrating elsewhere so soon.\n\nI would happily pay $50/year (or perhaps more... I don't know how high I'd go) for email that's not only convenient and spam free, but also well protected from governments and the provider's employees, and not data mined.\n\nI have absolutely no use for phone support or 99.9 uptime for my personal email. So the businessification of Google mail is not a win for me. Privacy a"}], "key": "i73-Privacy users would pay "}, {"name": "More Lisp-based CAD scripting tools.", "one_liner": "Draft: cluster not yet reviewed. Keywords: cad, based cad, parametric, capable, based, parametric cad", "draft": true, "verdict_score": null, "cluster": "cad, based cad, parametric, capable", "category": "hardware & IoT", "signal_score": 16.38, "authors": 8, "years": [2023, 2025, 2026], "pay_signals": 3.0, "avg_intensity": 3.0, "mentions": 8, "problem": "Engineers want a capable open-source CAD kernel like Parasolid; CAD tool builders lack an open, capable geometry kernel; CAD users want GUI modeling that generates editable code for headless parametric scripting; Programmers find fillets, chamfers and threads tedious in code-based CAD; Makers need to convert mesh files into editable parametric CAD models; A good free desktop parametric CAD for 3D printing hobbyists as an alternative to Fusion 360.", "quotes": [{"id": "44508826", "author": "tda", "year": 2025, "thread": "Proposal: GUI-first, text-based mechanical CAD inspired by software engineering", "text": "> I wish there were some OSS type license for Parasolid. It could be treated like the Linux kernel.\n\n> Whatever replaces Parasolid and friends, should be treated like the Linux kernel.\n\nSo much this! But the undertaking is so daunting, how do we get there? A capable, OSS CAD kernel would provide so much value to the world. I whish e.g. the EU could just \"nationalise\" such important, crucial software and redistribute it openly. Or that through some Chinese effort a newer and better kernel just lands out of nowhere and disrupt the field, like with DeepSeek.\n\nThe world has benefitted so immensely from Linux being freely available, has anyone even tried to put a price on the benefit to humanity?"}, {"id": "44474753", "author": "ddingus", "year": 2025, "thread": "Proposal: GUI-first, text-based mechanical CAD inspired by software engineering", "text": "I live seeing efforts like this.\n\nBut I am just going to put this here so the general thoughts incorporate a fundamental problem before significant labor investments go too far:\n\nWhat is a probable, viable, possible answer to the geometry kernel problem?\n\nParasolid, arguably the leader and generally most capable geometry kernel we have today, is or at least I can't see past...\n\n...is just not something easily duplicated.\n\nThere are a bazillion man months of time in that body of code.  And those are hard hours!\n\nFor those unfamiliar, the geometry kernel is the piece that resolves geometry cases to make operations possible.  Imagine a cylinder and rectangle.  Now imagine they have some common "}, {"id": "34744530", "author": "mk_stjames", "year": 2023, "thread": "Show HN: DSLCad – a programming language and interpreter for building 3D models", "text": "I wish there was a way to combine the power of an imperative language driven model generating language like this (that generates breps, NOT meshes like openscad) but with the initial modeling using a GUI like a standard CAD tool.  The reason being, it is much, much faster to draw complex parts using traditional methods versus trying to 'program' them.  Writing code is fine for basic shapes, but go and try an 'code' a complex ribbed casting with bezier-definied swept surfaces.\n\nI'd love to see a way to generate models with normal tools but, in the background, be able to access a code file that could then be embedded in an external script, headlessly.  This way, say I have a part where 3 param"}, {"id": "50038981", "author": "nayuki", "year": 2026, "thread": "OpenSCAD the Programmers Solid 3D CAD Modeller", "text": "I use OpenSCAD as my primary design tool for 3D modeling. I get things done, but it isn't easy, and it's hard to recommend it to other people. OpenSCAD really requires the user to mathematics, trigonometry, mental visualization, and programming beforehand as prerequisites - unlike mainstream CAD programs which are more point-and-click friendly. Performing fillets and chamfers on corners is quite tedious, and describing a screw thread as a polyhedron is a nightmare, but I overcame these challenges.\n\nOn the plus side, I like these things about OpenSCAD:\n\n* The software is open source, so price or pirating are not barriers, you can use it as much as you want on any computer you want for as long"}], "key": "i74-More Lisp-based CAD scri"}, {"name": "ML teams want a multi-cloud GPU autoscaler that joins nodes to their own orchestrator and picks the cheapest", "one_liner": "Draft: cluster not yet reviewed. Keywords: gpu, ml, gpu compute, gpu clusters, compute, clusters", "draft": true, "verdict_score": null, "cluster": "gpu, ml, gpu compute, gpu clusters", "category": "AI & ML tooling", "signal_score": 16.37, "authors": 7, "years": [2017, 2020, 2023, 2024, 2026], "pay_signals": 4.5, "avg_intensity": 3.14, "mentions": 7, "problem": "ML teams want a multi-cloud GPU autoscaler that joins nodes to their own orchestrator and picks the cheapest; Indie ML researchers struggle to get GPU quota from major clouds even when ud provider but they just wouldn’t sell me it"}, {"id": "50427769", "author": "qoez", "year": 2026, "thread": "The same H100 costs $2.69 or $12.29 an hour depending where you rent it", "text": "I wish there was some kind of GPU marketplace so one could just arb this opportunity."}, {"id": "48220114", "author": "tristanj", "year": 2026, "thread": "Anthropic is expanding to Colossus2. Will use GB200", "text": "They tried and failed. xAi made a mistake building Colossus 1 and ended up with heterogenous cluster of H100/H200/GB200 GPUs. This is a nightmare to train huge models on because each card has different specs, features, and hardware requirements. During gradient synchronization, a heterogeneous cluster would bottleneck on the slowest GPU (H100) so the faster GPUs would end up idling. They also probably ran into unexpected compatibility issues, which are difficult to resolve.\n\nIt makes more sense to use this cluster for inference, since they can segment the cluster by GPU type and avoid GPU mixing. xAI doesn't have enough inference customers so it makes sense to monetize this to companies that"}], "key": "i75-ML teams want a multi-cl"}];
const META = {"note": "57 of 256 chunks read (8,550 of 38,273 comments), 5,511 signals extracted. 36 idea cards, 40 draft clusters. Built 2026-11-20."};
const store = (() => { try { return JSON.parse(localStorage.getItem("hi-state") || "{}"); } catch { return {}; } })();
store.star = store.star || {}; store.hide = store.hide || {};
const save = () => { try { localStorage.setItem("hi-state", JSON.stringify(store)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let onlyStar = false, showHidden = false, showDrafts = false;
$("#meta").textContent = META.note || "";

[...new Set(IDEAS.map(i => i.category))].sort().forEach(c => $("#cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));

function render() {
  const q = $("#q").value.toLowerCase(), cat = $("#cat").value, sort = $("#sort").value;
  let xs = IDEAS.filter(i => (!cat || i.category === cat)
    && (!onlyStar || store.star[i.key]) && (showHidden || !store.hide[i.key]) && (showDrafts || !i.draft)
    && (!q || JSON.stringify(i).toLowerCase().includes(q)));
  const k = {signal: i => i.signal_score, verdict: i => i.verdict_score ?? -1, recent: i => Math.max(...i.years), pay: i => i.pay_signals}[sort];
  xs.sort((a, b) => k(b) - k(a));
  $("#count").textContent = `${xs.length} of ${IDEAS.length} ideas`;
  $("#list").innerHTML = xs.length ? xs.map(card).join("") : `<p class="empty">No ideas match.</p>`;
}

function card(i) {
  const yrs = i.years.length ? `${i.years[0]}–${i.years[i.years.length - 1]}` : "";
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="card ${store.hide[i.key] ? "dim" : ""}">
    <div class="top">
      ${i.draft ? `<div class="score draft" title="Cluster without an idea card yet"><b>–</b><span>draft</span></div>` : `<div class="score" title="Analyst score out of 10"><b>${i.verdict_score}</b><span>/ 10</span></div>`}
      <div class="title"><h2>${esc(i.name)}</h2><p class="one">${esc(i.one_liner)}</p>
        <div class="chips"><span class="chip">${esc(i.category)}</span>${i.draft ? `<span class="chip">draft</span>` : ""}
          <span class="chip">${i.authors} commenters</span><span class="chip">${i.mentions} mentions</span>
          <span class="chip">${yrs}</span>${i.pay_signals ? `<span class="chip pay">💰 ${i.pay_signals} pay signals</span>` : ""}
          <span class="chip">pain ${i.avg_intensity}/5</span></div></div>
      <div class="acts"><button data-star="${esc(i.key)}" aria-label="Star">${store.star[i.key] ? "★" : "☆"}</button>
        <button data-hide="${esc(i.key)}">${store.hide[i.key] ? "Unhide" : "Hide"}</button></div>
    </div>
    <details><summary>Full idea card & evidence</summary><dl>
      ${row("Problem", i.problem)}${row("Customer", i.customer)}${row("Evidence", i.evidence)}
      ${row("Solution", i.solution)}${row("First version", i.mvp)}${row("Business model", i.business_model)}
      ${row("Alternatives", i.alternatives)}${row("Why now", i.why_now)}${row("Risks", i.risks)}</dl>
      ${i.quotes.map(q => `<blockquote>${esc(q.text)}<a href="https://news.ycombinator.com/item?id=${esc(q.id)}" target="_blank" rel="noopener">${esc(q.author)}, ${q.year}${q.thread ? " · " + esc(q.thread) : ""} ↗</a></blockquote>`).join("")}
    </details></article>`;
}

document.addEventListener("click", e => {
  const s = e.target.dataset.star, h = e.target.dataset.hide;
  if (s) { store.star[s] ? delete store.star[s] : store.star[s] = 1; save(); render(); }
  if (h) { store.hide[h] ? delete store.hide[h] : store.hide[h] = 1; save(); render(); }
});
$("#starred").onclick = () => { onlyStar = !onlyStar; $("#starred").classList.toggle("on", onlyStar); render(); };
$("#drafts").onclick = () => { showDrafts = !showDrafts; $("#drafts").classList.toggle("on", showDrafts); render(); };
$("#hidden").onclick = () => { showHidden = !showHidden; $("#hidden").classList.toggle("on", showHidden); render(); };
["#q", "#cat", "#sort"].forEach(s => $(s).addEventListener("input", render));
render();
</script>
</body>
</html>
