loats' thing and generally don't seem to even try to provide a general equivalent to the C++ `extern \"C\" { ... }` thing.\n\nOf course, I know this isn't really the target use case of Wren/Lua/etc., but if anyone knows of a good embeddable scripting language for this I'd love to hear"}, {"id": "45423489", "author": "OskarS", "year": 2025, "thread": "The ABS programming language", "text": "The superpower of shell scripting languages is not just that it's easy to run external processes, it's also that you can run them extremely flexibly: chain them into pipelines, run them in background, redirecting streams, process substitution, etc. These kinds of things is why \"just use Python or whatever!\" is not always a great answer to \"shell scripting sucks\" (which it does, I agree). I mean, you CAN do all those things in Python, but it's a huge pain in the ass to write compared to the dedicated syntax of shell scripting.\n\nIf the developers of ABS are reading this, it would be great some examples of that kind of thing to the homepage. Like, how would you do `curl <url> | grep something |"}], "key": "i71-Developers want a fast, "}, {"name": "Users want an open Linux phone that docks into a full desktop development environment", "one_liner": "Draft: cluster not yet reviewed. Keywords: linux phone, phone, linux, phone works, desktop, environment", "draft": true, "verdict_score": null, "cluster": "linux phone, phone, linux, phone works", "category": "hardware & IoT", "signal_score": 17.03, "authors": 7, "years": [2020, 2021, 2024, 2025, 2026], "pay_signals": 5.5, "avg_intensity": 2.86, "mentions": 7, "problem": "A Linux phone that works well with little tinkering.; A modern, fairly priced Linux phone like a successor to the Librem 5.; Developers want a full Linux environment on their phone that works as a desktop over HDMI; A full desktop OS like Debian that runs from a docked Android phone with notification integration.; Users would pay $1,500 for a Linux phone that runs their essential apps; Linux phone buyers would pay $100-200 more for faster processor, Wi-Fi and Bluetooth", "quotes": [{"id": "49203706", "author": "duxup", "year": 2026, "thread": "I'm switching my phone from Android to Linux", "text": "I wish there was a good option, at the same time I recognized that I look at my phone as a tool… and I have very very little interest in spending time messing around to make it work…"}, {"id": "48078970", "author": "zb3", "year": 2026, "thread": "GrapheneOS fixes Android VPN leak Google refused to patch", "text": "Why is there no Librem 6? Librem 5 is 7 years old, it's a low-end smartphone with a flagship price tag :("}, {"id": "40515893", "author": "ActorNightly", "year": 2024, "thread": "Ask HN: What hair on fire problem are you willing to pay for right now?", "text": "Full linux system on phone, available as a desktop experience through hdmi out. Samsung phones have Dex, Pixel 8 has desktop mode in beta. In terms of general use, UI is pretty much there (Dex is ahead of Pixel 8 beta, but likely full desktop mode is coming). Code-server works pretty well for running visual studio code in a browser window. Portable external monitor with a keyboard or a lapdock is much nicer to carry, serves as an extra battery, and you get the advantage of having internet connection through the phone when there is no wifi.\n\nBut because of how termux is structured, compiling stuff isn't always straighforward. The team does a good job of building out the packages, but for exam"}, {"id": "40022951", "author": "webdevver", "year": 2024, "thread": "The First Beta of Android 15", "text": "I wish there was a word about desktop mode. Plugging in my phone and having Windows 11 or Ubuntu or whatever pop up on my desktop has been my lifelong nerd fantasy. Something like DeX, but a \"real\" desktop OS (where i can open terminals, build stuff, maybe even launch nested VMs), and as a first-class citizen. Maybe Google/Android could have their own desktop skew of Android (like how Microsoft has Azure Linux optimized for their environment), e.g. take Debian and add integrations to it for the rest of the Android system, like when you get notifications, they will appear in the Gnome dock, etc."}], "key": "i72-Users want an open Linux"}, {"name": "Users want apps sandboxed with fake data for permissions they do not want to grant", "one_liner": "Draft: cluster not yet reviewed. Keywords: permissions, sandboxed, fake, permission, data, level", "draft": true, "verdict_score": null, "cluster": "permissions, sandboxed, fake, permission", "category": "security & privacy", "signal_score": 16.97, "authors": 8, "years": [2021, 2023, 2025, 2026], "pay_signals": 3.5, "avg_intensity": 3.25, "mentions": 8, "problem": "Users want OS-level file permissions per app, not just per user; Fine-grained app authorization (file groups, field-level DB permissions) needs a library that works on app data without syncing state to a policy service; Developers lack a library for building decentralized apps on signed, linked records independent of transport; Phone users want a permission option that feeds apps fake contacts and data; Package and app sandboxing between all-access and no-access, with good permission prompts.; Phone users want sandboxed containers to toggle invasive app permissions like always-on GPS", "quotes": [{"id": "49197134", "author": "Razengan", "year": 2026, "thread": "Humans missed 1 in 3 threats approving AI agent commands across 40k game runs", "text": "This brings me back to something I have always thought was lacking in OS security permissions architectures:\n\nWHY IS THERE NO WAY TO SET FILE PERMISSIONS PER APP???\n\nWe can set granular permissions per file and folder for elaborate hierarchies of users and groups, but there's no way to say \"Don't let Notepad.exe read this file\", or \"Only let ls access this folder\"\n\nmacOS's Sandbox is a roundabout way of doing this (manually choosing a file via the Open dialog gives that app implicit permission, but it doesn't work for non-sandboxed apps of course)"}, {"id": "37172096", "author": "academia_hack", "year": 2023, "thread": "Policy Engines: Open Policy Agent vs. AWS Cedar vs. Google Zanzibar", "text": "It's a pity the state of the art here is still so dire for basic use cases. Things like managing group access to files in directories, or giving people field-level permissions to specific columns on specific database records.\n\nAll of these languages (OPA, Cedar) are nifty but assume you have a whole team of devops engineers dedicated to replicating slices of your database state and getting them to the policy engine at the right time without discrepancies. Likewise, systems like Permit.io, OPAL, Topaz and SpiceDB claim to solve this problem, but they do it by adding an extra API call to everything your application does and then potentially having a permissions database which is in a divergent"}, {"id": "50111248", "author": "athrowaway3z", "year": 2026, "thread": "Show HN: Flipflop – Iroh-powered persistent tunnels for filesharing", "text": "I think you're both missing the forest for the trees. P2P connectivity is\n about as solved as it will get, and the last % will stay unsolved.\n\nThe final goal for decentralization is something like: no central party\n should become the irreplaceable master over data, community, feeds,\n moderation, UI and identity.\n\nWe already know the minimum pieces needed to avoid that kind of\n centralization: hashed, linked, signed records(/packets), so their\n validity and causal order don't depend on whatever connection carried them\n or whatever physical server received them.\n\nOnce we have that, apps 'transcend' the connection layer, and the parties\n that control identity, community, feeds, moderation, etc "}, {"id": "46287500", "author": "josephg", "year": 2025, "thread": "8M users' AI conversations sold for profit by \"privacy\" extensions", "text": "I wish there was another button on those contact permission boxes which would tell the app you've granted permissions. But when they try to read your contacts, send them randomly generated junk. Fake phone numbers. Fake names.\n\nOr even better, mix in some real names and phone numbers but change all the other details. I want data brokers to think I live in 8 different countries. I want my email address to show up for 50 different identities. Good luck sorting that out."}], "key": "i73-Users want apps sandboxe"}, {"name": "Developers have no good way to debug fine-tuned LLMs that get worse", "one_liner": "Draft: cluster not yet reviewed. Keywords: llms, developers, llm, structured machine, fine tuned, worse", "draft": true, "verdict_score": null, "cluster": "llms, developers, llm, structured machine", "category": "AI & ML tooling", "signal_score": 16.95, "authors": 8, "years": [2023, 2025, 2026], "pay_signals": 4.0, "avg_intensity": 3.12, "mentions": 8, "problem": "Developers have no reliable way to make LLM agents follow communication style preferences; Developers have no good way to debug fine-tuned LLMs that get worse; Developers want better tools to isolate issues when debugging LLM output in complex harnesses; Developers working with LLMs lose the mental model of their program and want tools that preserve design theory; Developers have no good way to make structured, machine-first queries to LLMs; Developers get stuck in sunk-cost loops with large amounts of LLM-generated code", "quotes": [{"id": "49376834", "author": "trefoiled", "year": 2026, "thread": "Vomit: Clean up Claude 5's token output with a separate LLM", "text": "I've been grappling with this for weeks, not just in Claude but in Codex as well, which isn't quite as bad but still annoying. AGENTS.md does very little, agents will consistently violate the communication preferences, especially as the session drags on. It's incredible to me that there's no good way to reliably change the way an LLM responds to you that a workaround like this would even be necessary. It seems like such a failure to live up to the promises of the product.\n\nThe baked in communication style of these models is so obnoxious it's impacting my work. The best way I can describe it is that everything is optimized to impress the user and make the agent sound more authoritative, but t"}, {"id": "35743665", "author": "sharonzhou", "year": 2023, "thread": "Launch Lamini: The LLM Engine for Rapidly Customizing Models as Good as ChatGPT", "text": "Hi HN!\n\nI’m super excited to announce Lamini, the LLM engine that gives every developer the superpowers that took the world from GPT-3 to ChatGPT!\n\nI’ve seen a lot of developers get stuck after prompt-tuning for a couple days or after fine-tuning an LLM and it just gets worse—there’s no good way to debug it. I have a PhD in AI from Stanford, and don’t think anyone should need one to build an LLM as good as ChatGPT. A world full of LLMs as different & diverse as people would be even more creative, productive, and inspiring.\n\nThat’s why I’m building Lamini, the LLM engine for developers to rapidly customize models from amazing foundation models from a ton of institutions: OpenAI, EleutherAI, C"}, {"id": "49409020", "author": "shostack", "year": 2026, "thread": "Why your local LLM feels dumber than it is", "text": "Debugging any LLM output when you also have done substantial harness engineering is a total pita and I wish there were better tools for it to isolate issues.\n\nI spent ages tracking down start appears to be an issue with the current Deepseek v4 flash 0731 version that would cause it to output giant walls of gibberish in Hermes with reasoning turned on."}, {"id": "48075833", "author": "TACIXAT", "year": 2026, "thread": "Read Programming as Theory Building", "text": "This is helps describe my biggest pain point when engineering a program with LLMs. They do not have the full theory of the program, which makes things difficult. Additionally, the more hands-off approach to programming (even when dy uses LLMs to explore and discover locally hosted knowledge bases ... which are in my opinion the single most useful use case of them. You"}, {"id": "46006142", "author": "nickreese", "year": 2025, "thread": "Olmo 3: Charting a path through the model flow to lead open-source AI", "text": "I'm just now moving my main workflows off openai over to local models and I'm starting to find that these smaller models main failure mode is that they will accept edgecases with the goal of being helpful.\n\nEspecially in extraction tasks. This appears as inventing data or rationalizing around clear roadblocks.\n\nMy biggest hack so far is giving them an out named \"edge_case\" and telling them it is REALLY helpful if they identify edgecases. Simply renaming \"fail_closed\" or \"dead_end\" options to \"edge_case\" with helpful wording causes qwen models to adhere to their prompting more.\n\nIt feels like there are 100s of these small hacks that people have to have discovered... why isn't there a centrali"}, {"id": "44107379", "author": "noosphr", "year": 2025, "thread": "Ask HN: Anyone struggling to get value out of coding LLMs?", "text": "For general text you run some type of vector search against the full-text corpus to see what relevant hits there are and where. Then you feed the first round of results into a ranking/filtering system which does pair wise comparison between each chunk that you've had a good score from the vector search. Contract/expand until you've reach the limit of the context window for your model and run against the original query.\n\nFor source code, you are even luckier since there are a lot of deterministic tools which provide solid grounding, e.g., etags, and the languages themselves enforce a hierarchical tree-like structure on the source code, viz. block statements. The above means that ranking and c"}, {"id": "43369057", "author": "darkteflon", "year": 2025, "thread": "Show HN: LLM-docs, software documentation intended for consumption by LLMs", "tex const META = {"note": "72 of 256 chunks read (10,800 of 38,273 comments), 6,747 signals extracted. 36 idea cards, 40 draft clusters. Built 2026-11-20."};
const store = (() => { try { return JSON.parse(localStorage.getItem("hi-state") || "{}"); } catch { return {}; } })();
store.star = store.star || {}; store.hide = store.hide || {};
const save = () => { try { localStorage.setItem("hi-state", JSON.stringify(store)); } catch {} };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let onlyStar = false, showHidden = false, showDrafts = false;
$("#meta").textContent = META.note || "";

[...new Set(IDEAS.map(i => i.category))].sort().forEach(c => $("#cat").insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));

function render() {
  const q = $("#q").value.toLowerCase(), cat = $("#cat").value, sort = $("#sort").value;
  let xs = IDEAS.filter(i => (!cat || i.category === cat)
    && (!onlyStar || store.star[i.key]) && (showHidden || !store.hide[i.key]) && (showDrafts || !i.draft)
    && (!q || JSON.stringify(i).toLowerCase().includes(q)));
  const k = {signal: i => i.signal_score, verdict: i => i.verdict_score ?? -1, recent: i => Math.max(...i.years), pay: i => i.pay_signals}[sort];
  xs.sort((a, b) => k(b) - k(a));
  $("#count").textContent = `${xs.length} of ${IDEAS.length} ideas`;
  $("#list").innerHTML = xs.length ? xs.map(card).join("") : `<p class="empty">No ideas match.</p>`;
}

function card(i) {
  const yrs = i.years.length ? `${i.years[0]}–${i.years[i.years.length - 1]}` : "";
  const row = (t, v) => v ? `<dt>${t}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="card ${store.hide[i.key] ? "dim" : ""}">
    <div class="top">
      ${i.draft ? `<div class="score draft" title="Cluster without an idea card yet"><b>–</b><span>draft</span></div>` : `<div class="score" title="Analyst score out of 10"><b>${i.verdict_score}</b><span>/ 10</span></div>`}
      <div class="title"><h2>${esc(i.name)}</h2><p class="one">${esc(i.one_liner)}</p>
        <div class="chips"><span class="chip">${esc(i.category)}</span>${i.draft ? `<span class="chip">draft</span>` : ""}
          <span class="chip">${i.authors} commenters</span><span class="chip">${i.mentions} mentions</span>
          <span class="chip">${yrs}</span>${i.pay_signals ? `<span class="chip pay">💰 ${i.pay_signals} pay signals</span>` : ""}
          <span class="chip">pain ${i.avg_intensity}/5</span></div></div>
      <div class="acts"><button data-star="${esc(i.key)}" aria-label="Star">${store.star[i.key] ? "★" : "☆"}</button>
        <button data-hide="${esc(i.key)}">${store.hide[i.key] ? "Unhide" : "Hide"}</button></div>
    </div>
    <details><summary>Full idea card & evidence</summary><dl>
      ${row("Problem", i.problem)}${row("Customer", i.customer)}${row("Evidence", i.evidence)}
      ${row("Solution", i.solution)}${row("First version", i.mvp)}${row("Business model", i.business_model)}
      ${row("Alternatives", i.alternatives)}${row("Why now", i.why_now)}${row("Risks", i.risks)}</dl>
      ${i.quotes.map(q => `<blockquote>${esc(q.text)}<a href="https://news.ycombinator.com/item?id=${esc(q.id)}" target="_blank" rel="noopener">${esc(q.author)}, ${q.year}${q.thread ? " · " + esc(q.thread) : ""} ↗</a></blockquote>`).join("")}
    </details></article>`;
}

document.addEventListener("click", e => {
  const s = e.target.dataset.star, h = e.target.dataset.hide;
  if (s) { store.star[s] ? delete store.star[s] : store.star[s] = 1; save(); render(); }
  if (h) { store.hide[h] ? delete store.hide[h] : store.hide[h] = 1; save(); render(); }
});
$("#starred").onclick = () => { onlyStar = !onlyStar; $("#starred").classList.toggle("on", onlyStar); render(); };
$("#drafts").onclick = () => { showDrafts = !showDrafts; $("#drafts").classList.toggle("on", showDrafts); render(); };
$("#hidden").onclick = () => { showHidden = !showHidden; $("#hidden").classList.toggle("on", showHidden); render(); };
["#q", "#cat", "#sort"].forEach(s => $(s).addEventListener("input", render));
render();
</script>
</body>
</html>
